name: Deploy Frontend (Expo Web) to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build Expo web & deploy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: Export static web build
        working-directory: ./frontend
        env:
          EXPO_PUBLIC_BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: npx expo export --platform web --output-dir dist

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway (frontend service)
        working-directory: ./frontend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service frontend --detach
