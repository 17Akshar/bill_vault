name: CI — Lint & Type Check

on:
  push:
    branches: [main, 'claude/**', 'feature/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend — syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: pip install --quiet -r requirements.txt

      - name: Python syntax check (all .py files)
        working-directory: ./backend
        run: |
          find . -name "*.py" -not -path "./__pycache__/*" \
            | xargs python3 -m py_compile && echo "All Python files OK"

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend-typecheck:
    name: Frontend — TypeScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --legacy-peer-deps

      - name: TypeScript type-check
        working-directory: ./frontend
        run: npx tsc --noEmit
