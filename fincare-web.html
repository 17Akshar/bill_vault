<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fincare — Personal Finance</title>
  <meta name="theme-color" content="#08082A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    /* ───────────────────────────────────────────────────────
       CSS TOKENS  (mirror React-Native T object)
    ─────────────────────────────────────────────────────── */
    :root {
      --bg:         #0A0A14;
      --bg2:        #0F0F1E;
      --card:       #13132A;
      --card2:      #1A1A35;
      --card3:      #1E1E40;
      --primary:    #7C5CFC;
      --primary-dim:rgba(124,92,252,0.15);
      --primary-glow:rgba(124,92,252,0.35);
      --success:    #10D078;
      --success-dim:rgba(16,208,120,0.12);
      --danger:     #FF4D6A;
      --danger-dim: rgba(255,77,106,0.12);
      --info:       #38BDF8;
      --info-dim:   rgba(56,189,248,0.12);
      --warn:       #FBBF24;
      --warn-dim:   rgba(251,191,36,0.12);
      --text:       #F0F0FF;
      --text-dim:   #8888AA;
      --text-muted: #5A5A7A;
      --border:     rgba(255,255,255,0.06);
      --border2:    rgba(255,255,255,0.10);
      --grad-from:  #6941F0;
      --grad-to:    #9B6BFF;
      --grad-gold:  linear-gradient(135deg,#F59E0B,#FCD34D);
      --grad-green: linear-gradient(135deg,#10D078,#34D399);
      --grad-red:   linear-gradient(135deg,#FF4D6A,#FF8FA3);
      --grad-blue:  linear-gradient(135deg,#38BDF8,#60A5FA);
      --radius:     20px;
      --radius-sm:  14px;
      --radius-xs:  10px;
      --shadow:     0 8px 32px rgba(0,0,0,0.5);
      --shadow-card:0 4px 20px rgba(0,0,0,0.4);
      --glow-purple:0 0 30px rgba(124,92,252,0.25);
    }

    /* ───────────────────────────────────────────────────────
       RESET & BASE
    ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: radial-gradient(ellipse at 20% 20%, rgba(124,92,252,0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 80% 80%, rgba(56,189,248,0.05) 0%, transparent 50%),
                  #070711;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ───────────────────────────────────────────────────────
       PHONE CHROME  (desktop: centered phone frame)
    ─────────────────────────────────────────────────────── */
    #phone-frame {
      position: relative;
      margin: 0 auto;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    @media (min-width: 500px) {
      body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      #phone-frame {
        height: 92dvh;
        max-height: 900px;
        border-radius: 44px;
        box-shadow: 0 0 0 1px rgba(255,255,255,0.08), 0 0 0 12px #0D0D1A, 0 40px 100px rgba(0,0,0,0.8), 0 0 80px rgba(124,92,252,0.15);
        overflow: hidden;
      }
    }

    /* ───────────────────────────────────────────────────────
       SCREEN CONTAINER
    ─────────────────────────────────────────────────────── */
    #screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    #screen::-webkit-scrollbar { display: none; }

    /* ───────────────────────────────────────────────────────
       BOTTOM NAV TAB BAR
    ─────────────────────────────────────────────────────── */
    #tab-bar {
      height: 72px;
      background: rgba(13,13,26,0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.4px;
      transition: color 0.25s;
      -webkit-tap-highlight-color: transparent;
      padding: 8px 0;
      position: relative;
    }
    .tab-item.active { color: var(--primary); }
    .tab-item.active::before {
      content: '';
      position: absolute;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 36px; height: 2px;
      background: var(--primary);
      border-radius: 0 0 2px 2px;
      box-shadow: 0 0 12px var(--primary-glow);
    }
    .tab-icon-wrap {
      width: 36px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 12px;
      transition: background 0.25s, transform 0.15s;
    }
    .tab-item.active .tab-icon-wrap {
      background: var(--primary-dim);
      transform: translateY(-1px);
    }
    .tab-icon { width: 22px; height: 22px; }

    /* ───────────────────────────────────────────────────────
       COMMON UI PRIMITIVES
    ─────────────────────────────────────────────────────── */

    /* Screen wrapper */
    .screen-wrap {
      min-height: 100%;
      padding-bottom: 24px;
      animation: fadeIn 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, var(--card) 25%, var(--card2) 50%, var(--card) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 8px;
    }

    /* Section */
    .section { margin-bottom: 24px; }

    /* Section header */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; margin-bottom: 12px;
    }
    .section-title { color: var(--text); font-size: 18px; font-weight: 800; letter-spacing: -0.3px; }
    .view-all { color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; }
    .view-all:hover { opacity: 0.8; }

    /* Card */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    /* Pill / Badge */
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700;
    }
    .pill-success { background: var(--success-dim); color: var(--success); }
    .pill-danger  { background: var(--danger-dim);  color: var(--danger);  }
    .pill-info    { background: var(--info-dim);    color: var(--info);    }
    .pill-warn    { background: var(--warn-dim);    color: var(--warn);    }
    .pill-primary { background: var(--primary-dim); color: var(--primary); }
    .pill-dim     { background: rgba(255,255,255,0.08); color: var(--text-dim); }

    /* Button */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: none; cursor: pointer; font-weight: 700;
      border-radius: var(--radius-sm); transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); opacity: 0.9; }
    .btn-primary {
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      color: #fff; padding: 15px 24px; font-size: 15px;
      box-shadow: 0 8px 24px var(--primary-glow);
      letter-spacing: 0.2px;
    }
    .btn-primary:active { opacity: 0.9; transform: scale(0.98); box-shadow: none; }
    .btn-outline {
      background: transparent; border: 1.5px solid var(--primary);
      color: var(--primary); padding: 12px 20px; font-size: 14px;
    }
    .btn-ghost {
      background: var(--card); color: var(--text);
      padding: 10px 16px; font-size: 13px;
    }

    /* Icon button */
    .icon-btn {
      width: 42px; height: 42px; border-radius: 21px;
      background: var(--card); border: 1px solid var(--border);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--text); transition: background 0.2s, transform 0.1s;
      flex-shrink: 0; -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { transform: scale(0.93); background: var(--card2); }

    /* Progress bar */
    .progress-wrap { background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; transition: width 0.6s cubic-bezier(0.25,0.46,0.45,0.94); }

    /* Divider */
    .divider { border: none; border-top: 1px solid var(--border); margin: 0; }

    /* List row */
    .list-row {
      display: flex; align-items: center; padding: 14px 16px; gap: 13px; cursor: pointer;
      transition: background 0.15s;
    }
    .list-row:active { background: var(--card2); }
    .list-icon {
      width: 46px; height: 46px; border-radius: 23px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .list-body { flex: 1; min-width: 0; }
    .list-title { color: var(--text); font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-sub   { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
    .list-right { text-align: right; flex-shrink: 0; }
    .list-amount { font-size: 14px; font-weight: 800; }
    .list-date   { color: var(--text-dim); font-size: 11px; margin-top: 2px; }

    /* ───────────────────────────────────────────────────────
       HEADER (screen-specific)
    ─────────────────────────────────────────────────────── */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 56px 20px 16px;
    }
    .page-title { color: var(--text); font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }

    .page-sub   { color: var(--text-dim); font-size: 13px; margin-top: 3px; }

    /* ───────────────────────────────────────────────────────
       DASHBOARD  –  NET WORTH HERO CARD
    ─────────────────────────────────────────────────────── */
    .hero-card {
      margin: 0 16px 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, #4A1FA8 0%, #6941F0 40%, #9B6BFF 80%, #B8A0FF 100%);
      padding: 24px;
      box-shadow: 0 12px 40px rgba(105,65,240,0.45), 0 0 0 1px rgba(255,255,255,0.1);
      position: relative;
      overflow: hidden;
    }
    .hero-card::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 180px; height: 180px;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hero-card::after {
      content: '';
      position: absolute;
      bottom: -30px; left: -30px;
      width: 120px; height: 120px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hero-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .hero-label {
      color: rgba(255,255,255,0.75);
      font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 5px;
      text-transform: uppercase; letter-spacing: 0.8px;
    }
    .hero-amount {
      color: #fff;
      font-size: 36px; font-weight: 800;
      margin: 10px 0 6px; letter-spacing: -1.5px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .hero-delta { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .hero-delta-abs { font-size: 12px; font-weight: 600; margin-top: 2px; }
    .hero-stats {
      display: flex; gap: 8px; margin-top: 18px;
      background: rgba(255,255,255,0.10);
      border-radius: 14px; padding: 10px;
    }
    .stat-pill {
      flex: 1; display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    }
    .stat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .stat-info {}
    .stat-value { color: #fff; font-size: 13px; font-weight: 700; }
    .stat-delta { font-size: 10px; font-weight: 600; margin-top: 1px; }

    /* Mini sparkline SVG */
    .sparkline { flex-shrink: 0; }

    /* ───────────────────────────────────────────────────────
       DASHBOARD  –  3 STAT CARDS (below hero)
    ─────────────────────────────────────────────────────── */
    .stat-cards-row {
      display: flex; gap: 10px; padding: 0 16px; margin-bottom: 22px;
    }
    .stat-card {
      flex: 1; background: var(--card); border-radius: var(--radius);
      padding: 16px 12px; display: flex; flex-direction: column;
      align-items: center; gap: 5px;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      position: relative; overflow: hidden;
    }
    .stat-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      border-radius: 2px 2px 0 0;
    }
    .stat-card:nth-child(1)::before { background: var(--grad-green); }
    .stat-card:nth-child(2)::before { background: var(--grad-red); }
    .stat-card:nth-child(3)::before { background: var(--grad-blue); }
    .stat-card-icon {
      width: 44px; height: 44px; border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .stat-card-amt {
      color: var(--text); font-size: 13px; font-weight: 800;
      text-align: center; letter-spacing: -0.3px; white-space: nowrap;
    }
    .stat-card-label {
      color: var(--text-dim); font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .stat-card-delta { font-size: 10px; font-weight: 700; }

    /* ───────────────────────────────────────────────────────
       DASHBOARD  –  QUICK ACTIONS
    ─────────────────────────────────────────────────────── */
    .quick-row {
      display: flex; gap: 10px; padding: 0 16px; margin-bottom: 22px;
    }
    .qa-card {
      flex: 1 1 0; min-width: 0;
      background: var(--card); border-radius: var(--radius);
      padding: 18px 8px; display: flex; flex-direction: column;
      align-items: center; gap: 10px; cursor: pointer;
      box-shadow: var(--shadow-card);
      border: 1px solid var(--border);
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .qa-card:active { transform: scale(0.95); box-shadow: none; background: var(--card2); }
    .qa-icon {
      width: 52px; height: 52px; border-radius: 26px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }
    .qa-label { color: var(--text); font-size: 12px; font-weight: 700; letter-spacing: 0.2px; }

    /* ───────────────────────────────────────────────────────
       DASHBOARD  –  ACCOUNT CARDS (horizontal scroll)
    ─────────────────────────────────────────────────────── */
    .account-scroll {
      display: flex; gap: 12px;
      padding: 0 16px; overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .account-scroll::-webkit-scrollbar { display: none; }
    .acct-card {
      min-width: 156px; background: var(--card); border-radius: var(--radius);
      padding: 16px; cursor: pointer; flex-shrink: 0;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      -webkit-tap-highlight-color: transparent;
      position: relative; overflow: hidden;
    }
    .acct-card::before {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
      background: linear-gradient(to top, rgba(0,0,0,0.12), transparent);
      border-radius: 0 0 var(--radius) var(--radius);
    }
    .acct-card:active { transform: scale(0.97); box-shadow: none; }
    .acct-icon {
      width: 42px; height: 42px; border-radius: 21px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 14px;
    }
    .acct-title { color: var(--text); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .acct-amount { font-size: 18px; font-weight: 800; margin-bottom: 4px; letter-spacing: -0.5px; }
    .acct-sub { color: var(--text-dim); font-size: 11px; }
    .acct-add {
      border: 1.5px dashed rgba(108,71,255,0.45);
      background: transparent !important;
      align-items: center; justify-content: center;
    }

    /* ───────────────────────────────────────────────────────
       DASHBOARD  –  LIST CARDS (reminders & transactions)
    ─────────────────────────────────────────────────────── */
    .list-card {
      background: var(--card); margin: 0 16px; border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }

    /* ───────────────────────────────────────────────────────
       FILTER PILLS (top of dashboard)
    ─────────────────────────────────────────────────────── */
    .filter-row { display: flex; gap: 10px; padding: 0 16px; margin-bottom: 16px; }
    .filter-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--card); padding: 9px 18px; border-radius: 50px;
      color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
      border: 1px solid var(--border2);
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s;
    }
    .filter-pill:active { background: var(--card2); }

    /* ───────────────────────────────────────────────────────
       AVATAR / HEADER
    ─────────────────────────────────────────────────────── */
    .dash-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 56px 20px 16px;
    }
    .dash-left { display: flex; align-items: center; gap: 12px; cursor: pointer; flex: 1; min-width: 0; }
    .avatar {
      width: 46px; height: 46px; border-radius: 23px;
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 18px; font-weight: 700; flex-shrink: 0;
      box-shadow: 0 4px 16px var(--primary-glow);
    }
    .dash-title { color: var(--text); font-size: 20px; font-weight: 800; letter-spacing: -0.3px; margin-top: 2px; }
    .dash-sub   { color: var(--text-dim); font-size: 12px; font-weight: 500; }
    .dash-right { display: flex; gap: 10px; }
    .notif-badge {
      position: absolute; top: 4px; right: 4px;
      min-width: 16px; height: 16px; border-radius: 8px;
      background: var(--danger); color: #fff;
      font-size: 9px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px;
      border: 1.5px solid var(--bg);
    }

    /* ───────────────────────────────────────────────────────
       MODAL / OVERLAY
    ─────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 200; animation: overlayIn 0.2s ease;
    }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-sheet {
      background: var(--card2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px 28px 0 0;
      padding: 24px; width: 100%; max-width: 430px;
      animation: sheetUp 0.3s cubic-bezier(0.25,0.46,0.45,0.94);
      max-height: 85dvh; overflow-y: auto;
      border: 1px solid var(--border2);
      border-bottom: none;
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle {
      width: 40px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.15); margin: 0 auto 22px;
    }
    .modal-title { color: var(--text); font-size: 18px; font-weight: 700; margin-bottom: 20px; }

    /* ───────────────────────────────────────────────────────
       LOGIN SCREEN
    ─────────────────────────────────────────────────────── */
    .login-wrap {
      display: flex; flex-direction: column;
      min-height: 100%;
      padding: 60px 28px 40px;
      background: radial-gradient(ellipse at 50% 0%, rgba(124,92,252,0.2) 0%, transparent 60%);
    }
    .login-logo {
      text-align: center; margin-bottom: 48px;
    }
    .login-logo-icon {
      width: 80px; height: 80px; border-radius: 28px;
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 12px 40px rgba(124,92,252,0.5), 0 0 0 1px rgba(255,255,255,0.1);
    }
    .login-app-name {
      color: var(--text); font-size: 32px; font-weight: 800; letter-spacing: -1px;
    }
    .login-tagline { color: var(--text-dim); font-size: 15px; margin-top: 6px; }
    .form-group { margin-bottom: 16px; }
    .form-label { color: var(--text-dim); font-size: 12px; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
    .form-input {
      width: 100%; background: var(--card); border: 1.5px solid var(--border2);
      border-radius: var(--radius-sm); padding: 15px 16px;
      color: var(--text); font-size: 15px;
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-dim); }
    .form-input::placeholder { color: var(--text-dim); }
    .login-btn { width: 100%; margin-top: 8px; border-radius: var(--radius-sm); }
    .login-footer { text-align: center; margin-top: 24px; color: var(--text-dim); font-size: 14px; }
    .login-link { color: var(--primary); font-weight: 600; cursor: pointer; }

    /* ───────────────────────────────────────────────────────
       TOAST NOTIFICATION
    ─────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
      background: rgba(20,20,40,0.96);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #fff;
      padding: 12px 24px; border-radius: 999px;
      font-size: 14px; font-weight: 500; z-index: 300;
      pointer-events: none; opacity: 0; transition: opacity 0.3s;
      white-space: nowrap;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.08);
      max-width: 90%;
    }
    #toast.show { opacity: 1; }

    /* ───────────────────────────────────────────────────────
       LOADING SPINNER
    ─────────────────────────────────────────────────────── */
    .spinner {
      width: 42px; height: 42px; border-radius: 50%;
      border: 3px solid rgba(124,92,252,0.2);
      border-top-color: var(--primary);
      animation: spin 0.8s cubic-bezier(0.68,-0.55,0.27,1.55) infinite;
      margin: 80px auto;
      box-shadow: 0 0 20px var(--primary-glow);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ───────────────────────────────────────────────────────
       EMPTY STATE
    ─────────────────────────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 40px 20px; color: var(--text-dim);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-title { color: var(--text); font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .empty-sub { font-size: 13px; line-height: 1.5; }

    /* ───────────────────────────────────────────────────────
       SVG ICONS  (inline utility class)
    ─────────────────────────────────────────────────────── */
    svg { display: block; }

    /* ───────────────────────────────────────────────────────
       REMINDERS MODULE
    ─────────────────────────────────────────────────────── */

    /* 4-tab bar */
    .rem-tab-bar {
      display: flex; gap: 0; padding: 0 20px 14px; overflow-x: auto; scrollbar-width: none;
    }
    .rem-tab-bar::-webkit-scrollbar { display: none; }
    .rem-tab {
      flex-shrink: 0; padding: 8px 18px; border-radius: 999px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      color: var(--text-dim); transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .rem-tab.active {
      background: linear-gradient(135deg,var(--grad-from),var(--grad-to));
      color: #fff;
    }

    /* Summary cards row */
    .rem-summary { display: flex; gap: 8px; padding: 0 20px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: none; }
    .rem-summary::-webkit-scrollbar { display: none; }
    .rem-sum-card {
      flex-shrink: 0; min-width: 96px; background: var(--card); border-radius: var(--radius-sm);
      padding: 14px; text-align: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }
    .rem-sum-count { font-size: 24px; font-weight: 800; }
    .rem-sum-label { color: var(--text-dim); font-size: 10px; font-weight: 600; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.3px; }
    .rem-sum-amt   { font-size: 11px; font-weight: 700; margin-top: 3px; }

    /* Category chip bar */
    .rem-cat-bar { display: flex; gap: 8px; padding: 0 20px 12px; overflow-x: auto; scrollbar-width: none; }
    .rem-cat-bar::-webkit-scrollbar { display: none; }
    .rem-cat { flex-shrink: 0; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; cursor: pointer; background: var(--card); color: var(--text-dim); border: 1.5px solid transparent; -webkit-tap-highlight-color: transparent; }
    .rem-cat.active { border-color: var(--primary); color: var(--primary); background: var(--primary-dim); }

    /* Date group label */
    .rem-group-label { padding: 4px 20px 8px; color: var(--text-dim); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }

    /* Reminder card */
    .rem-card {
      background: var(--card); margin: 0 16px 10px; border-radius: var(--radius);
      padding: 16px; display: flex; align-items: center; gap: 12px;
      cursor: pointer; transition: background 0.15s; position: relative;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
      -webkit-tap-highlight-color: transparent;
    }
    .rem-card:active { background: var(--card2); }
    .rem-card-left-bar { position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px; border-radius: 2px; }
    .rem-icon { width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px; }
    .rem-body { flex: 1; min-width: 0; }
    .rem-title { color: var(--text); font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .rem-provider { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
    .rem-badges { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
    .rem-right { text-align: right; flex-shrink: 0; }
    .rem-amount { color: var(--text); font-size: 15px; font-weight: 800; }
    .rem-status { font-size: 11px; font-weight: 700; margin-top: 4px; }
    .rem-recurring-dot { width: 6px; height: 6px; border-radius: 3px; background: var(--primary); display: inline-block; }

    /* AI suggestion card */
    .ai-card {
      margin: 0 20px 10px; border-radius: var(--radius);
      padding: 14px 16px; display: flex; align-items: flex-start; gap: 12px;
      border: 1px solid rgba(108,71,255,0.3);
      background: linear-gradient(135deg,rgba(108,71,255,0.08),rgba(108,71,255,0.04));
      cursor: pointer;
    }
    .ai-card:active { opacity: 0.8; }
    .ai-body { flex: 1; }
    .ai-label { color: var(--primary); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
    .ai-title { color: var(--text); font-size: 13px; font-weight: 600; margin-top: 3px; line-height: 1.4; }
    .ai-action { color: var(--primary); font-size: 12px; font-weight: 700; margin-top: 6px; }

    /* Calendar grid */
    .cal-header { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; margin-bottom: 12px; }
    .cal-month-label { color: var(--text); font-size: 16px; font-weight: 700; }
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 2px; padding: 0 20px; margin-bottom: 16px; }
    .cal-day-name { text-align: center; color: var(--text-dim); font-size: 11px; font-weight: 600; padding: 6px 0; }
    .cal-day {
      text-align: center; padding: 6px 0; border-radius: 8px; cursor: pointer;
      position: relative; -webkit-tap-highlight-color: transparent;
    }
    .cal-day:active { background: rgba(255,255,255,0.05); }
    .cal-day-num { font-size: 13px; font-weight: 600; color: var(--text-dim); line-height: 1; }
    .cal-day.today .cal-day-num { color: var(--primary); font-weight: 800; }
    .cal-day.selected { background: var(--primary); border-radius: 8px; }
    .cal-day.selected .cal-day-num { color: #fff; }
    .cal-day.has-rem .cal-day-num { color: var(--text); }
    .cal-dots { display: flex; justify-content: center; gap: 2px; margin-top: 3px; min-height: 6px; }
    .cal-dot { width: 5px; height: 5px; border-radius: 3px; }

    /* Reminder detail */
    .rem-detail-hero {
      margin: 0 20px 16px; border-radius: var(--radius); padding: 22px;
    }
    .rem-detail-amount { color: #fff; font-size: 34px; font-weight: 800; letter-spacing: -1px; margin: 8px 0 4px; }
    .rem-detail-provider { color: rgba(255,255,255,0.7); font-size: 13px; }

    /* Quick action strip */
    .rem-quick-strip { display: flex; gap: 8px; padding: 0 20px; margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
    .rem-quick-strip::-webkit-scrollbar { display: none; }
    .rem-quick-btn {
      flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
      background: var(--card); border-radius: var(--radius-sm); padding: 12px 14px;
      cursor: pointer; min-width: 72px;
      -webkit-tap-highlight-color: transparent;
    }
    .rem-quick-btn:active { opacity: 0.8; }
    .rem-quick-icon { width: 36px; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; }
    .rem-quick-label { color: var(--text); font-size: 11px; font-weight: 600; text-align: center; }

    /* Analytics mini cards */
    .rem-analytics-row { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 14px; }
    .rem-analytics-card { flex: 1; background: var(--card); border-radius: var(--radius-sm); padding: 14px 12px; }
    .rem-analytics-val { font-size: 20px; font-weight: 800; }
    .rem-analytics-lbl { color: var(--text-dim); font-size: 11px; margin-top: 3px; }

    /* Add reminder form specifics */
    .alert-chip-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 14px; }
    .alert-chip {
      padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
      background: var(--card2); color: var(--text-dim); cursor: pointer; border: 1.5px solid transparent;
      -webkit-tap-highlight-color: transparent;
    }
    .alert-chip.selected { background: var(--primary-dim); color: var(--primary); border-color: var(--primary); }

    /* Recurrence tabs */
    .rec-tabs { display: flex; gap: 6px; padding: 12px 16px; flex-wrap: wrap; }
    .rec-tab {
      padding: 7px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
      background: var(--card2); color: var(--text-dim); cursor: pointer; border: 1.5px solid transparent;
      -webkit-tap-highlight-color: transparent;
    }
    .rec-tab.active { background: var(--primary-dim); color: var(--primary); border-color: var(--primary); }

    /* ───────────────────────────────────────────────────────
       ACCOUNTS / WEALTH MODULE
    ─────────────────────────────────────────────────────── */

    /* Overview summary hero */
    .wealth-hero {
      margin: 0 20px 20px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
    }
    .wealth-hero-total { color: var(--text-dim); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
    .wealth-hero-amount { color: var(--text); font-size: 30px; font-weight: 800; letter-spacing: -1px; margin-bottom: 14px; }
    .wealth-sub-row { display: flex; gap: 0; border-radius: var(--radius-sm); overflow: hidden; margin-top: 14px; }
    .wealth-sub-cell { flex: 1; padding: 14px 16px; background: var(--card2); }
    .wealth-sub-cell:first-child { border-right: 1px solid var(--border); }
    .wealth-sub-label { color: var(--text-dim); font-size: 11px; font-weight: 500; margin-bottom: 4px; }
    .wealth-sub-val { font-size: 17px; font-weight: 800; margin-top: 4px; }

    /* Account group rows */
    .acct-group-list { background: var(--card); margin: 0 20px; border-radius: var(--radius); overflow: hidden; }
    .acct-group-row {
      display: flex; align-items: center; padding: 16px; gap: 14px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .acct-group-row:last-child { border-bottom: none; }
    .acct-group-row:active { background: rgba(255,255,255,0.04); }
    .acct-group-icon {
      width: 44px; height: 44px; border-radius: 22px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .acct-group-info { flex: 1; min-width: 0; }
    .acct-group-name { color: var(--text); font-size: 15px; font-weight: 600; }
    .acct-group-sub  { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
    .acct-group-bal  { font-size: 16px; font-weight: 700; text-align: right; }

    /* Advanced features grid */
    .adv-grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 20px; }
    .adv-card {
      flex: 0 0 calc(50% - 5px); background: var(--card); border-radius: var(--radius-sm);
      padding: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer;
      transition: opacity 0.15s;
    }
    .adv-card:active { opacity: 0.7; }
    .adv-card-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .adv-card-label { color: var(--text); font-size: 12px; font-weight: 600; line-height: 1.3; }

    /* ─── Premium Wealth Module ─── */
    .nw-hero {
      margin: 0 16px 20px;
      background: linear-gradient(135deg, #150838 0%, #2A1070 50%, #1A0A4A 100%);
      border-radius: 24px;
      padding: 24px 22px 20px;
      border: 1px solid rgba(124,92,252,0.3);
      box-shadow: 0 16px 48px rgba(124,92,252,0.3), 0 0 0 1px rgba(255,255,255,0.05);
      overflow: hidden; position: relative;
    }
    .nw-hero::before {
      content: ''; position: absolute; top: -40px; right: -40px;
      width: 150px; height: 150px;
      background: radial-gradient(circle, rgba(124,92,252,0.4) 0%, transparent 70%);
      border-radius: 50%;
    }
    .nw-label { color: rgba(255,255,255,0.6); font-size: 11px; font-weight: 700; letter-spacing: 1.5px; margin-bottom: 6px; }
    .nw-amount { color: #fff; font-size: 34px; font-weight: 800; letter-spacing: -1.5px; margin-bottom: 4px; }
    .nw-delta  { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; }
    .nw-delta-badge { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; }
    .nw-pills  { display: flex; gap: 8px; }
    .nw-pill   { flex: 1; background: rgba(255,255,255,0.08); border-radius: 10px; padding: 10px 12px; }
    .nw-pill-label { color: rgba(255,255,255,0.55); font-size: 10px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 4px; }
    .nw-pill-val   { font-size: 14px; font-weight: 800; }

    /* Wealth section titles */
    .ws-head { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-bottom: 10px; }
    .ws-title { color: var(--text-dim); font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; }
    .ws-view-all { color: var(--primary); font-size: 12px; font-weight: 600; cursor: pointer; }

    /* 3-column category cards */
    .wealth-cat-grid { display: flex; gap: 8px; padding: 0 20px 20px; }
    .wealth-cat-card {
      flex: 1; background: var(--card); border-radius: var(--radius-sm);
      padding: 16px 10px; display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer; transition: all 0.15s; border: 1px solid var(--border);
      text-align: center; box-shadow: var(--shadow-card);
    }
    .wealth-cat-card:active { opacity: 0.75; transform: scale(0.97); }
    .wealth-cat-icon { font-size: 24px; }
    .wealth-cat-name { color: var(--text-dim); font-size: 10px; font-weight: 600; line-height: 1.2; }
    .wealth-cat-val  { font-size: 13px; font-weight: 800; }

    /* Health score */
    .health-bar-bg { height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
    .health-bar-fill { height: 8px; border-radius: 4px; transition: width 0.6s; }

    /* AI insight row */
    .wealth-insight { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .wealth-insight:last-child { border-bottom: none; }
    .wealth-insight-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
    .wealth-insight-text { color: var(--text-dim); font-size: 13px; line-height: 1.5; }

    /* ─── Account Detail screen ─── */
    .acct-detail-hero {
      margin: 0 16px 20px;
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      border-radius: 24px;
      padding: 24px 22px;
      box-shadow: 0 12px 40px var(--primary-glow), 0 0 0 1px rgba(255,255,255,0.1);
      position: relative; overflow: hidden;
    }
    .acct-detail-name  { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 500; }
    .acct-detail-bank  { color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 2px; }
    .acct-detail-bal   { color: #fff; font-size: 30px; font-weight: 800; margin: 10px 0 4px; letter-spacing: -1px; }
    .acct-detail-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.4);
      color: var(--success); font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 999px;
    }

    /* Quick action buttons (Send / Statement / Edit / More) */
    .quick-acts { display: flex; gap: 8px; justify-content: space-between; margin: 0 20px 18px; }
    .quick-act {
      flex: 1; background: var(--card); border-radius: var(--radius-sm);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 14px 4px; cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .quick-act:active { background: var(--card2); }
    .quick-act-icon  { width: 38px; height: 38px; border-radius: 19px; display: flex; align-items: center; justify-content: center; }
    .quick-act-label { color: var(--text); font-size: 11px; font-weight: 600; text-align: center; }

    /* Account info table */
    .info-table { background: var(--card); margin: 0 20px 14px; border-radius: var(--radius); overflow: hidden; }
    .info-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 16px; border-bottom: 1px solid var(--border);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--text-dim); font-size: 13px; }
    .info-value { color: var(--text); font-size: 13px; font-weight: 600; max-width: 55%; text-align: right; word-break: break-all; }

    /* Action buttons row (Add Money / Transfer / Statement) */
    .action-btns { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 18px; }
    .action-btn {
      flex: 1; background: var(--primary-dim); border: 1.5px solid rgba(108,71,255,0.3);
      border-radius: var(--radius-sm); padding: 12px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; -webkit-tap-highlight-color: transparent;
    }
    .action-btn:active { opacity: 0.8; }
    .action-btn-label { color: var(--primary); font-size: 11px; font-weight: 700; text-align: center; }

    /* Smart insights */
    .insight-grid { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 18px; }
    .insight-card {
      flex: 1; background: var(--card); border-radius: var(--radius-sm); padding: 14px 12px;
    }
    .insight-icon  { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    .insight-label { color: var(--text-dim); font-size: 11px; font-weight: 500; }
    .insight-value { color: var(--text); font-size: 15px; font-weight: 700; margin-top: 4px; }

    /* Transaction filter panel */
    .filter-panel {
      background: var(--card2); margin: 0 20px 14px; border-radius: var(--radius);
      padding: 16px; border: 1px solid var(--border);
    }
    .filter-panel-title { color: var(--text); font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
    .filter-group-label { color: var(--text-dim); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; margin-top: 12px; }
    .filter-chips-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter-chip {
      padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600;
      background: var(--card); color: var(--text-dim); cursor: pointer;
      border: 1.5px solid transparent; -webkit-tap-highlight-color: transparent;
    }
    .filter-chip.active { background: var(--primary-dim); color: var(--primary); border-color: var(--primary); }
    .filter-btns { display: flex; gap: 10px; margin-top: 14px; }
    .filter-reset { flex: 1; }
    .filter-apply { flex: 2; }

    /* Search bar */
    .search-bar {
      display: flex; align-items: center; gap: 10px;
      background: var(--card); border-radius: var(--radius-sm);
      padding: 11px 14px; margin: 0 16px 14px;
      border: 1.5px solid var(--border2);
      box-shadow: var(--shadow-card);
    }
    .search-bar:focus-within { border-color: var(--primary); }
    .search-input {
      flex: 1; background: none; border: none; color: var(--text);
      font-size: 14px; outline: none;
    }
    .search-input::placeholder { color: var(--text-dim); }

    /* ─── Add Account form specifics ─── */
    .acct-type-grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 20px; margin-bottom: 20px; }
    .acct-type-card {
      flex: 0 0 calc(33.33% - 7px); background: var(--card);
      border-radius: var(--radius-sm); padding: 14px 8px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer; border: 1.5px solid transparent;
      transition: all 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .acct-type-card.active { background: var(--primary-dim); border-color: var(--primary); }
    .acct-type-card:active { opacity: 0.8; }
    .acct-type-label { color: var(--text); font-size: 12px; font-weight: 600; text-align: center; }
    .acct-type-card.active .acct-type-label { color: var(--primary); }

    /* Color swatch picker */
    .color-swatches { display: flex; flex-wrap: wrap; gap: 10px; padding: 14px 16px; }
    .color-swatch {
      width: 34px; height: 34px; border-radius: 17px; cursor: pointer;
      border: 3px solid transparent; transition: border-color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .color-swatch.selected { border-color: #fff; }

    /* ───────────────────────────────────────────────────────
       TRANSACTIONS SCREEN
    ─────────────────────────────────────────────────────── */

    /* Top bar */
    .tx-top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 56px 16px 14px;
    }
    .tx-top-bar-title { color: var(--text); font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .tx-top-bar-right { display: flex; align-items: center; gap: 6px; }

    /* Pill-shaped Expert View button */
    .tx-expert-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 7px 13px; border-radius: 999px;
      background: var(--primary-dim); color: var(--primary);
      border: 1.5px solid rgba(108,71,255,0.35);
      font-size: 12px; font-weight: 700; cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: opacity 0.15s;
      white-space: nowrap;
    }
    .tx-expert-btn:active { opacity: 0.7; }

    /* Month navigator */
    .month-nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; margin-bottom: 16px;
    }
    .month-label { color: var(--text); font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .month-btn {
      width: 36px; height: 36px; border-radius: 18px; background: var(--card);
      border: 1px solid var(--border); color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    .month-btn:active { background: var(--card2); transform: scale(0.93); }

    /* Filter row — dropdown selects */
    .tx-filter-row {
      display: flex; gap: 8px; padding: 0 20px; margin-bottom: 12px;
    }
    .tx-filter-select {
      flex: 1; background: var(--card); border: 1.5px solid var(--border);
      color: var(--text); font-size: 13px; font-weight: 600;
      border-radius: var(--radius-sm); padding: 9px 12px;
      outline: none; cursor: pointer; appearance: none;
      -webkit-appearance: none; color-scheme: dark;
      transition: border-color 0.15s;
    }
    .tx-filter-select:focus { border-color: var(--primary); }

    /* Type tab bar — pill style */
    .tx-type-bar {
      display: flex; gap: 6px; padding: 0 20px; margin-bottom: 14px;
      overflow-x: auto; scrollbar-width: none;
    }
    .tx-type-bar::-webkit-scrollbar { display: none; }
    .tx-type-tab {
      flex: 1; text-align: center; padding: 9px 8px; border-radius: 999px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      color: var(--text-dim); background: var(--card);
      border: 1.5px solid transparent; white-space: nowrap;
      transition: all 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .tx-type-tab.active {
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      color: #fff; border-color: transparent;
    }

    /* 3-column summary row */
    .tx-sum-3 {
      display: flex; gap: 8px; padding: 0 20px; margin-bottom: 14px;
    }
    .tx-sum-3-card {
      flex: 1; background: var(--card); border-radius: var(--radius-sm);
      padding: 14px 10px; text-align: center;
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 2px 12px rgba(0,0,0,0.2);
      overflow: hidden; position: relative;
    }
    .tx-sum-3-label {
      color: var(--text-dim); font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.4px;
    }
    .tx-sum-3-val {
      font-size: 15px; font-weight: 800; margin-top: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tx-sum-3-count { color: var(--text-dim); font-size: 10px; margin-top: 3px; }

    /* Search bar */
    .tx-search-bar {
      display: flex; align-items: center; gap: 8px;
      margin: 0 16px 12px; padding: 11px 14px;
      background: var(--card); border-radius: var(--radius-sm);
      border: 1.5px solid var(--primary);
      box-shadow: var(--shadow-card);
      animation: tx-search-in 0.18s ease;
    }
    @keyframes tx-search-in {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .tx-search-input {
      flex: 1; background: none; border: none; color: var(--text);
      font-size: 14px; outline: none;
    }
    .tx-search-input::placeholder { color: var(--text-dim); }
    .tx-search-clear {
      background: none; border: none; color: var(--text-dim);
      cursor: pointer; padding: 0; display: flex; align-items: center;
      -webkit-tap-highlight-color: transparent;
    }

    /* Legacy summary row — kept for compat */
    .tx-summary {
      display: flex; gap: 10px; padding: 0 20px; margin-bottom: 14px;
    }
    .tx-sum-card {
      flex: 1; background: var(--card); border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .tx-sum-label { color: var(--text-dim); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .tx-sum-value { font-size: 20px; font-weight: 800; margin-top: 4px; }

    /* Filter chip bar */
    .chip-bar {
      display: flex; gap: 8px; padding: 0 20px; margin-bottom: 14px;
      overflow-x: auto; scrollbar-width: none;
    }
    .chip-bar::-webkit-scrollbar { display: none; }
    .chip {
      flex-shrink: 0; padding: 7px 16px; border-radius: 999px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      background: var(--card); color: var(--text-dim);
      border: 1.5px solid transparent;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .chip.active { background: var(--primary-dim); color: var(--primary); border-color: var(--primary); }

    /* Tx date group header */
    .tx-date-header {
      padding: 8px 20px 6px; color: var(--text-dim);
      font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }

    /* Premium transaction row */
    .tx-row {
      display: flex; align-items: center; padding: 14px 16px; gap: 12px;
      border-bottom: 1px solid var(--border); cursor: pointer;
      transition: background 0.15s; -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .tx-row:last-child { border-bottom: none; }
    .tx-row:active { background: var(--card2); }
    .tx-row-icon {
      width: 44px; height: 44px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .tx-row-body { flex: 1; min-width: 0; }
    .tx-row-title {
      color: var(--text); font-size: 14px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tx-row-sub {
      color: var(--text-dim); font-size: 12px; margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tx-row-right { display: flex; flex-direction: column; align-items: flex-end; flex-shrink: 0; }
    .tx-row-amt   { font-size: 15px; font-weight: 800; letter-spacing: -0.3px; }
    .tx-row-date  { color: var(--text-dim); font-size: 11px; margin-top: 3px; }

    /* Add-Transaction chooser option card */
    .tx-chooser-opt {
      display: flex; align-items: center; gap: 14px;
      padding: 16px 20px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      -webkit-tap-highlight-color: transparent; transition: background 0.15s;
    }
    .tx-chooser-opt:last-child { border-bottom: none; }
    .tx-chooser-opt:active { background: rgba(255,255,255,0.04); }
    .tx-chooser-icon {
      width: 46px; height: 46px; border-radius: 14px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .tx-chooser-title { color: var(--text); font-size: 15px; font-weight: 700; }
    .tx-chooser-sub   { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

    /* Expert View sections */
    .ev-section {
      background: var(--card); margin: 0 16px 14px; border-radius: var(--radius);
      overflow: hidden; padding: 18px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }
    .ev-section-title {
      color: var(--text); font-size: 15px; font-weight: 800; margin-bottom: 12px;
    }
    .ev-cat-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
    }
    .ev-cat-icon {
      width: 30px; height: 30px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ev-cat-name  { flex: 1; color: var(--text); font-size: 13px; font-weight: 600; }
    .ev-cat-amt   { color: var(--text); font-size: 13px; font-weight: 700; }
    .ev-cat-pct   { color: var(--text-dim); font-size: 11px; text-align: right; min-width: 36px; }
    .ev-bar-bg    { height: 4px; background: var(--border); border-radius: 2px; margin-top: 4px; }
    .ev-bar-fill  { height: 4px; border-radius: 2px; }
    .ev-period-bar {
      display: flex; background: var(--card2); border-radius: var(--radius-sm);
      margin: 0 20px 14px; overflow: hidden;
      border: 1px solid var(--border);
    }
    .ev-period-tab {
      flex: 1; text-align: center; padding: 10px 4px; font-size: 12px; font-weight: 600;
      color: var(--text-dim); cursor: pointer; transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .ev-period-tab.active {
      background: var(--primary); color: #fff; border-radius: var(--radius-sm);
    }
    .ev-insight-card {
      display: flex; gap: 12px; padding: 12px 14px;
      background: var(--card2); border-radius: var(--radius-sm); margin-bottom: 10px;
    }
    .ev-insight-bar { width: 4px; border-radius: 2px; flex-shrink: 0; align-self: stretch; }
    .ev-insight-text { color: var(--text); font-size: 13px; line-height: 1.5; }

    /* Tx detail hero */
    .tx-detail-hero {
      margin: 0 20px 14px; border-radius: var(--radius); padding: 24px 20px; text-align: center;
    }
    .tx-detail-hero-amount {
      font-size: 36px; font-weight: 800; color: #fff; letter-spacing: -1px;
    }
    .tx-detail-hero-type {
      font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.75); margin-top: 4px;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .tx-detail-hero-cat {
      font-size: 15px; font-weight: 700; color: rgba(255,255,255,0.9); margin-top: 6px;
    }
    .tx-detail-hero-date {
      font-size: 12px; color: rgba(255,255,255,0.65); margin-top: 4px;
    }

    /* Tx detail action strip */
    .tx-action-strip {
      display: flex; gap: 10px; padding: 0 20px; margin-bottom: 14px;
      overflow-x: auto; scrollbar-width: none;
    }
    .tx-action-strip::-webkit-scrollbar { display: none; }
    .tx-action-btn {
      flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 10px 16px; background: var(--card); border-radius: var(--radius-sm);
      border: 1px solid var(--border); cursor: pointer;
      -webkit-tap-highlight-color: transparent; transition: background 0.15s;
      min-width: 70px;
    }
    .tx-action-btn:active { background: var(--card2); }
    .tx-action-btn-label { font-size: 11px; font-weight: 600; color: var(--text-dim); }

    /* Tx info table */
    .tx-info-table { background: var(--card); margin: 0 20px 14px; border-radius: var(--radius); overflow: hidden; }
    .tx-info-row {
      display: flex; align-items: center; padding: 13px 16px; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .tx-info-row:last-child { border-bottom: none; }
    .tx-info-label { flex: 1; color: var(--text-dim); font-size: 13px; font-weight: 500; }
    .tx-info-value { color: var(--text); font-size: 13px; font-weight: 700; text-align: right; }

    /* Category management rows */
    .cat-row {
      display: flex; align-items: center; padding: 13px 16px; gap: 12px;
      border-bottom: 1px solid var(--border); cursor: pointer;
      transition: background 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .cat-row:last-child { border-bottom: none; }
    .cat-row:active { background: rgba(255,255,255,0.04); }
    .cat-row-icon {
      width: 38px; height: 38px; border-radius: 11px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .cat-row-body { flex: 1; min-width: 0; }
    .cat-row-name { color: var(--text); font-size: 14px; font-weight: 700; }
    .cat-row-sub  { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

    /* FAB */
    .fab {
      position: fixed; right: calc(50% - 215px + 20px); bottom: 88px;
      width: 54px; height: 54px; border-radius: 27px;
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px var(--primary-glow), 0 0 0 1px rgba(255,255,255,0.1);
      cursor: pointer; border: none; z-index: 10;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.15s;
    }
    .fab:active { transform: scale(0.93); }
    @media (max-width: 500px) { .fab { right: 20px; } }

    /* ───────────────────────────────────────────────────────
       ADD TRANSACTION / FORM SCREEN
    ─────────────────────────────────────────────────────── */
    .form-screen { padding-bottom: 100px; }
    .form-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 52px 20px 16px;
    }
    .form-header-title { color: var(--text); font-size: 20px; font-weight: 800; }
    .form-save-btn {
      color: var(--primary); font-size: 16px; font-weight: 700;
      background: none; border: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* Amount hero */
    .amount-hero {
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      margin: 0 16px 20px; border-radius: var(--radius);
      padding: 28px 20px; text-align: center;
      box-shadow: 0 12px 40px var(--primary-glow);
    }
    .amount-hero-label { color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .amount-hero-prefix { color: rgba(255,255,255,0.8); font-size: 28px; font-weight: 700; }
    .amount-hero-input {
      background: none; border: none; color: #fff; font-size: 44px; font-weight: 800;
      text-align: center; width: 80%; outline: none; letter-spacing: -1px;
    }
    .amount-hero-input::placeholder { color: rgba(255,255,255,0.4); }

    /* Type selector chips */
    .type-chips { display: flex; gap: 8px; margin-bottom: 20px; padding: 0 20px; }
    .type-chip {
      flex: 1; padding: 10px; border-radius: var(--radius-sm);
      font-size: 13px; font-weight: 700; cursor: pointer;
      text-align: center; background: var(--card); color: var(--text-dim);
      border: 1.5px solid transparent; transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .type-chip.active-income   { background: var(--success-dim); color: var(--success); border-color: var(--success); }
    .type-chip.active-expense  { background: var(--danger-dim);  color: var(--danger);  border-color: var(--danger);  }
    .type-chip.active-transfer { background: var(--info-dim);    color: var(--info);    border-color: var(--info);    }

    /* Form group card */
    .form-card {
      background: var(--card); margin: 0 16px 14px; border-radius: var(--radius); overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-card);
    }
    .form-row {
      display: flex; align-items: center; padding: 15px 16px; gap: 12px;
      border-bottom: 1px solid var(--border); cursor: pointer;
      transition: background 0.15s;
    }
    .form-row:last-child { border-bottom: none; }
    .form-row:active { background: var(--card2); }
    .form-row-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .form-row-label { color: var(--text-dim); font-size: 12px; }
    .form-row-value { color: var(--text); font-size: 14px; font-weight: 600; margin-top: 2px; }
    .form-row-placeholder { color: var(--text-dim); font-size: 14px; margin-top: 2px; }

    /* Section label above card */
    .form-section-label {
      color: var(--text-dim); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.8px;
      padding: 0 20px; margin-bottom: 8px; margin-top: 4px;
    }

    /* Sticky save bottom bar */
    .sticky-save {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: var(--bg); border-top: 1px solid var(--border);
      padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0));
    }

    /* ───────────────────────────────────────────────────────
       MISC UTILITIES
    ─────────────────────────────────────────────────────── */
    .text-success { color: var(--success); }
    .text-danger  { color: var(--danger);  }
    .text-info    { color: var(--info);    }
    .text-warn    { color: var(--warn);    }
    .text-dim     { color: var(--text-dim); }
    .text-white   { color: #fff; }
    .fw-700 { font-weight: 700; }
    .fw-800 { font-weight: 800; }
    .mt-4  { margin-top: 4px; }
    .mt-8  { margin-top: 8px; }
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .flex  { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-8  { gap: 8px; }
    .gap-12 { gap: 12px; }
    .px-20  { padding: 0 20px; }
    .pos-rel { position: relative; }

    /* ───────────────────────────────────────────────────────
       INSIGHTS MODULE
    ─────────────────────────────────────────────────────── */
    .ins-tab-bar {
      display: flex; gap: 6px; padding: 0 20px 16px;
      overflow-x: auto; scrollbar-width: none;
    }
    .ins-tab-bar::-webkit-scrollbar { display: none; }
    .ins-tab {
      flex-shrink: 0; padding: 8px 16px; border-radius: 999px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      color: var(--text-dim); background: var(--card);
      transition: all 0.2s; border: 1.5px solid transparent;
      -webkit-tap-highlight-color: transparent;
    }
    .ins-tab.active {
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 16px var(--primary-glow);
    }
    .ins-period-row { display: flex; gap: 8px; padding: 0 20px; margin-bottom: 16px; }
    .ins-period-chip {
      flex: 1; text-align: center; padding: 9px 0; border-radius: 999px;
      font-size: 12px; font-weight: 600; cursor: pointer;
      background: var(--card); color: var(--text-dim); border: 1.5px solid transparent;
      transition: all 0.2s; -webkit-tap-highlight-color: transparent;
    }
    .ins-period-chip.active {
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to)); color: #fff;
      box-shadow: 0 4px 14px rgba(108,71,255,0.35);
    }
    .ins-flow-row { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 16px; }
    .ins-flow-card {
      flex: 1; background: var(--card); border-radius: var(--radius-sm);
      padding: 14px; display: flex; align-items: center; gap: 10px;
    }
    .ins-flow-icon {
      width: 38px; height: 38px; border-radius: 19px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .ins-flow-label { color: var(--text-dim); font-size: 11px; font-weight: 600; }
    .ins-flow-amt   { color: var(--text); font-size: 16px; font-weight: 800; margin-top: 2px; }
    .ins-bar-row { background: var(--card); margin: 0 20px 22px; border-radius: var(--radius); padding: 16px; }
    .ins-bar-item { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .ins-bar-item:last-child { margin-bottom: 0; }
    .ins-bar-label { color: var(--text-dim); font-size: 12px; font-weight: 600; width: 78px; flex-shrink: 0; }
    .ins-bar-track { flex: 1; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
    .ins-bar-fill  { height: 100%; border-radius: 4px; transition: width 0.6s ease; }
    .ins-bar-amt   { color: var(--text); font-size: 12px; font-weight: 700; width: 64px; text-align: right; flex-shrink: 0; }
    .ins-cat-row {
      display: flex; align-items: center; padding: 12px 16px; gap: 12px;
      border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s;
    }
    .ins-cat-row:last-child { border-bottom: none; }
    .ins-cat-row:active { background: rgba(255,255,255,0.04); }
    .ins-cat-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .ins-cat-body { flex: 1; min-width: 0; }
    .ins-cat-name { color: var(--text); font-size: 14px; font-weight: 600; }
    .ins-cat-bar-wrap { height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 5px; overflow: hidden; }
    .ins-cat-bar { height: 4px; border-radius: 2px; }
    .ins-cat-right { text-align: right; flex-shrink: 0; }
    .ins-cat-amt  { color: var(--text); font-size: 14px; font-weight: 700; }
    .ins-cat-pct  { color: var(--text-dim); font-size: 11px; font-weight: 600; margin-top: 2px; }
    .ins-bud-row {
      display: flex; align-items: center; padding: 12px 16px; gap: 12px;
      border-bottom: 1px solid var(--border);
    }
    .ins-bud-row:last-child { border-bottom: none; }
    .ins-bud-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .ins-bud-body { flex: 1; min-width: 0; }
    .ins-bud-name { color: var(--text); font-size: 13px; font-weight: 700; }
    .ins-bud-sub  { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
    .ins-bud-bar-wrap { height: 5px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 5px; overflow: hidden; }
    .ins-bud-bar { height: 5px; border-radius: 2px; transition: width 0.5s; }
    .ins-bud-right { text-align: right; flex-shrink: 0; }
    .ins-bud-pct { font-size: 14px; font-weight: 800; }
    .ins-trend-card {
      background: var(--card); margin: 0 20px 12px; border-radius: var(--radius); padding: 18px;
    }
    .ins-trend-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; }
    .ins-trend-label { color: var(--text-dim); font-size: 12px; font-weight: 600; }
    .ins-trend-view-all { color: var(--primary); font-size: 12px; font-weight: 600; cursor: pointer; }

    .ins-cal-day-num { font-size: 13px; font-weight: 600; color: var(--text-dim); }

    .ins-cal-day.selected { background: var(--primary); }
    .ins-cal-day.selected .ins-cal-day-num { color: #fff; }
    .ins-cal-day.has-event .ins-cal-day-num { color: var(--text); }
    .ins-cal-dots { display: flex; justify-content: center; gap: 2px; margin-top: 2px; min-height: 5px; }
    .ins-cal-dot  { width: 4px; height: 4px; border-radius: 2px; }
    .ins-acct-row {
      display: flex; align-items: center; padding: 13px 16px; gap: 12px;
      border-bottom: 1px solid var(--border); cursor: pointer;
      transition: background 0.15s; -webkit-tap-highlight-color: transparent;
    }
    .ins-acct-row:last-child { border-bottom: none; }
    .ins-acct-row:active { background: rgba(255,255,255,0.04); }
    .ins-quick-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .ins-quick-item:last-child { border-bottom: none; }
    .ins-quick-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
    .ins-quick-text { color: var(--text-dim); font-size: 13px; line-height: 1.5; flex: 1; }

    /* ───────────────────────────────────────────────────────
       UTILITY CLASSES
    ─────────────────────────────────────────────────────── */
    .glass {
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

    .glow-text-primary {

      background-clip: text;
    }
    .surface { background: var(--card2); border-radius: var(--radius-sm); border: 1px solid var(--border); }

/* ══════════════════════════════════════════════════════
   4. UTILITY FUNCTIONS
══════════════════════════════════════════════════════ */
function daysFromNow(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}

let _uid = 0;
function uid(prefix) { return prefix + Date.now() + '_' + (++_uid); }
function escapeHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function formatINR(n) {
  if (n == null || isNaN(n)) return '₹0';
  const abs = Math.abs(n);
  let s;
  if (abs >= 1e7)       s = (abs / 1e7).toFixed(2) + ' Cr';
  else if (abs >= 1e5)  s = (abs / 1e5).toFixed(2) + ' L';
  else s = abs.toLocaleString('en-IN');
  return (n < 0 ? '-' : '') + '₹' + s;
}

function formatINRFull(n) {
  if (n == null || isNaN(n)) return '₹0';
  return (n < 0 ? '-' : '') + '₹' + Math.abs(n).toLocaleString('en-IN');
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.getDate() + ' ' + MONTHS[d.getMonth()];
}

function daysUntil(iso) {
  if (!iso) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const then = new Date(iso); then.setHours(0,0,0,0);
  return Math.ceil((then - now) / 86400000);
}

function dueBadge(days) {
  if (days === null) return '';
  if (days < 0)  return `<span class="pill pill-danger">${Math.abs(days)}d overdue</span>`;
  if (days === 0) return `<span class="pill pill-danger">Due today</span>`;
  if (days <= 2)  return `<span class="pill pill-warn">Due in ${days}d</span>`;
  return `<span class="pill pill-dim">Due in ${days}d</span>`;
}

function userInitial() {
  const name = (State.user || DEMO.user).name || 'U';
  return name.charAt(0).toUpperCase();
}

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening';
}

function pct(spent, budget) {
  if (!budget) return 0;
  return Math.min(100, Math.round((spent / budget) * 100));
}

function progressColor(p) {
  if (p >= 100) return COLORS.danger;
  if (p >= 80)  return COLORS.warn;
  return COLORS.success;
}

/* ══════════════════════════════════════════════════════
   5. SVG CHART HELPERS
══════════════════════════════════════════════════════ */
function sparklineSVG(data, w, h, color, fill) {
  if (!data || data.length < 2) return '';
  const max = Math.max(...data, 1);
  const min = Math.min(...data, 0);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const path = pts.join(' ');
  const fillPath = fill
    ? `M${pts[0]} ${pts.slice(1).map(p => 'L'+p).join(' ')} L${w},${h} L0,${h} Z`
    : '';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${fill ? `<path d="${fillPath}" fill="${color}" fill-opacity="0.15"/>` : ''}
    <polyline points="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function donutSVG(slices, r, size) {
  // slices: [{value, color}]
  const cx = size / 2, cy = size / 2;
  const total = slices.reduce((s, x) => s + x.value, 0) || 1;
  let angle = -90;
  let paths = '';
  slices.forEach(sl => {
    const sweep = (sl.value / total) * 360;
    const startRad = angle * Math.PI / 180;
    const endRad   = (angle + sweep) * Math.PI / 180;
    const x1 = cx + r * Math.cos(startRad);
    const y1 = cy + r * Math.sin(startRad);
    const x2 = cx + r * Math.cos(endRad);
    const y2 = cy + r * Math.sin(endRad);
    const largeArc = sweep > 180 ? 1 : 0;
    paths += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc},1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${sl.color}" opacity="0.9"/>`;
    angle += sweep;
  });
  // inner circle cutout
  paths += `<circle cx="${cx}" cy="${cy}" r="${r * 0.58}" fill="var(--card)"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
}

function barChartSVG(bars, w, h, colors) {
  // bars: [{label, values:[v1,v2]}], colors:[c1,c2]
  if (!bars.length) return '';
  const allVals = bars.flatMap(b => b.values);
  const max = Math.max(...allVals, 1);
  const barW   = (w - (bars.length + 1) * 4) / (bars.length * colors.length);
  const labelH = 20;
  const chartH = h - labelH;
  let svgContent = '';
  bars.forEach((bar, i) => {
    bar.values.forEach((val, j) => {
      const x = 4 + i * (barW * colors.length + 4) + j * barW;
      const bh = (val / max) * (chartH - 8);
      const y  = chartH - bh;
      svgContent += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${colors[j]}" opacity="0.9"/>`;
    });
    // label
    const labelX = 4 + i * (barW * colors.length + 4) + barW * colors.length / 2;
    svgContent += `<text x="${labelX.toFixed(1)}" y="${h - 3}" text-anchor="middle" font-size="9" fill="var(--text-dim)">${bar.label}</text>`;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${svgContent}</svg>`;
}

/* ══════════════════════════════════════════════════════
   6. API LAYER  (with demo fallback)
══════════════════════════════════════════════════════ */
async function apiGet(path) {
  if (!State.token) return null;
  try {
    const res = await fetch(API_BASE + path, {
      headers: { 'Authorization': 'Bearer ' + State.token }
    });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch { return null; }
}

async function apiPost(path, body) {
  if (!State.token) return null;
  try {
    const res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + State.token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch { return null; }
}

async function loadDashboardData() {
  // Try real API first, fall back to demo data
  const [dash, accts, rems] = await Promise.all([
    apiGet('/dashboard'),
    apiGet('/accounts'),
    apiGet('/reminders'),
  ]);
  const now = new Date();
  const txArr = await Promise.all([
    apiGet(`/income?month=${now.getMonth()+1}&year=${now.getFullYear()}`),
    apiGet(`/expenses?month=${now.getMonth()+1}&year=${now.getFullYear()}`),
  ]);
  const income = txArr[0] || [];
  const exp    = txArr[1] || [];
  const all = [
    ...income.map(i => ({ ...i, _type: 'income',  id: i.income_id   || i.id })),
    ...exp.map(e    => ({ ...e, _type: 'expense', id: e.expense_id  || e.id })),
  ].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);

  State.data.dashboard   = dash  || DEMO.dashboard;
  State.data.accounts    = accts || DEMO.accounts;
  State.data.reminders   = rems  || DEMO.reminders;
  State.data.recentTx    = all.length ? all : DEMO.transactions.slice(0, 5);
}
