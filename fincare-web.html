  _saveInvSell() {
    var qtyStr  = document.getElementById('isf-qty')?.value;
    var price   = document.getElementById('isf-price')?.value;
    var id      = State.params.id;
    var cat     = State.params.cat;
    if (!qtyStr || !price) { this.showToast('Please enter sell quantity and price'); return; }
    var qty = parseFloat(qtyStr);
    if (isNaN(qty) || qty <= 0) { this.showToast('Quantity must be greater than 0'); return; }
    // Guard against selling more than available
    var txDataSell = INV_TRANSACTIONS[id];
    if (txDataSell) {
      var _bQty = (txDataSell.buys  || []).reduce(function(s, t) { return s + (t.qty || 0); }, 0);
      var _sQty = (txDataSell.sells || []).reduce(function(s, t) { return s + (t.qty || 0); }, 0);
      var available = _bQty - _sQty;
      if (available > 0 && qty > available) {
        this.showToast('Cannot sell more than ' + available + ' available shares');
        return;
      }
    }
    this.showToast('Sale recorded! 📉');
    this.navigate('investment-detail', { id: id, cat: cat });
  },

  _etfRecalc() {
    var units    = parseFloat(document.getElementById('etf-units')?.value);

  _saveETFTransaction() {
    var id      = (State.params && State.params.id) || '';
    var type    = State.etfTxType || 'purchase';
    var units   = parseFloat(document.getElementById('etf-units')?.value);
    var nav     = parseFloat(document.getElementById('etf-nav')?.value);
    var date    = document.getElementById('etf-date')?.value;
    var ref     = document.getElementById('etf-ref')?.value || '';
    var payMode = State.etfPayMode || 'upi';
    if (!id)                          { this.showToast('Please select an ETF'); return; }
    if (!date)                        { this.showToast('Please enter a date'); return; }
    if (isNaN(units) || units <= 0)   { this.showToast('Please enter valid units'); return; }
    if (isNaN(nav)   || nav   <= 0)   { this.showToast('Please enter valid NAV'); return; }

    var amt     = parseFloat((units * nav).toFixed(2));
    var charges = parseFloat((amt * 0.003).toFixed(2));
    var total   = parseFloat((amt + charges).toFixed(2));
    var fund    = _etfFund(id);

    if (!INV_TRANSACTIONS[id]) INV_TRANSACTIONS[id] = { buys: [], sells: [] };
    var tx = { id: uid(), date, qty: parseFloat(units.toFixed(3)), nav, amount: amt, charges, total, payment_mode: payMode, ref_id: ref };

    if (type === 'purchase') {
      INV_TRANSACTIONS[id].buys.push(tx);
      fund.invested = (fund.invested || 0) + amt;
      fund.qty      = (fund.qty      || 0) + units;
      fund.current  = (fund.current  || 0) + amt;
      fund.buy_price = fund.invested / fund.qty;
      this.showToast('Purchase saved! 📈');
    } else if (type === 'redemption') {
      if (units > (fund.qty || 0)) { this.showToast('Cannot redeem more units than held'); return; }
      tx.type = 'redemption';
      INV_TRANSACTIONS[id].sells.push(tx);
      fund.qty     = (fund.qty     || 0) - units;
      fund.current = (fund.current || 0) - amt;
      this.showToast('Redemption saved! 📤');
    } else {
      this.showToast('Switch saved! 🔄');
    }
    this.navigate('etf-detail', { id });
  },

  _saveBond() {
    var name       = document.getElementById('bond-name')?.value.trim();
    var type       = document.getElementById('bond-type')?.value;
    var isin       = document.getElementById('bond-isin')?.value.trim();
    var rating     = document.getElementById('bond-rating')?.value.trim();
    var faceVal    = parseFloat(document.getElementById('bond-face')?.value);
    var qty        = parseFloat(document.getElementById('bond-qty')?.value);
    var price      = parseFloat(document.getElementById('bond-price')?.value);
    var coupon     = parseFloat(document.getElementById('bond-coupon')?.value);
    var purchDate  = document.getElementById('bond-purchase-date')?.value;
    var matDate    = document.getElementById('bond-maturity-date')?.value;
    var payMode    = document.getElementById('bond-pay-mode')?.value;
    var ref        = document.getElementById('bond-ref')?.value.trim();
    var notes      = document.getElementById('bond-notes-inp')?.value.trim();
    if (!name)              { this.showToast('Enter bond name'); return; }
    if (isNaN(faceVal)||faceVal<=0) { this.showToast('Enter face value'); return; }
    if (isNaN(qty)||qty<=0){ this.showToast('Enter quantity'); return; }
    if (isNaN(price)||price<=0){ this.showToast('Enter purchase price'); return; }
    if (isNaN(coupon)||coupon<=0){ this.showToast('Enter coupon rate'); return; }
    if (!purchDate)         { this.showToast('Enter purchase date'); return; }
    var newId = 'b'+uid();
    var invested = qty * price;
    var newBond = {
      id:newId, name, type, sub_type:'', face_value:faceVal, qty, purchase_price:price,
      coupon_rate:coupon, invested, current:invested, current_price:price,
      invested_on:purchDate, maturity_date:matDate||'', status:'active',
      isin:isin||'', credit_rating:rating||'—',
    };
    INV_PORTFOLIO.bonds = INV_PORTFOLIO.bonds||[];
    INV_PORTFOLIO.bonds.push(newBond);
    INV_TRANSACTIONS[newId] = { purchases:[], sells:[] };
    INV_TRANSACTIONS[newId].purchases.push({
      id:uid('bp'), date:purchDate, qty, purchase_price:price, total_amount:invested,
      coupon_rate:coupon, payment_mode:payMode||'bank_transfer', ref_id:ref||'', notes,
    });
    if (notes && !INV_NOTES[newId]) INV_NOTES[newId] = [];
    if (notes) INV_NOTES[newId].push({ id:uid('bn'), type:'research', date:new Date().toISOString().slice(0,10), title:'Setup Note', text:notes });

    State.params = { id:newId };

    if (!date) { this.showToast('Please enter a date'); return; }
    if (isNaN(amt) || amt <= 0) { this.showToast('Please enter a valid amount'); return; }
    if (isNaN(nav) || nav <= 0) { this.showToast('Please enter a valid NAV'); return; }

    var units = amt / nav;
    var fund  = _mfFund(id);
    if (!INV_TRANSACTIONS[id]) INV_TRANSACTIONS[id] = { buys: [], sells: [] };

    var tx = { id: uid(), date: date, amount: amt, units: parseFloat(units.toFixed(3)), nav: nav, sip: isSip };

    if (type === 'purchase') {
      INV_TRANSACTIONS[id].buys.push(tx);
      fund.invested = (fund.invested || 0) + amt;
      fund.units    = (fund.units    || 0) + units;
      fund.current  = (fund.current  || 0) + amt;
      this.showToast('Purchase recorded! 📈');
    } else if (type === 'redemption') {
      tx.type = 'redemption';
      if (units > (fund.units || 0)) { this.showToast('Cannot redeem more units than available'); return; }
      INV_TRANSACTIONS[id].sells.push(tx);
      fund.units   = (fund.units   || 0) - units;
      fund.current = (fund.current || 0) - amt;
      this.showToast('Redemption recorded! 📤');
    } else {
      this.showToast('Switch recorded! 🔄');
    }

    this.navigate('mf-detail', { id: id });
  },

  _mfAddNote(fundId) {
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay center';
    overlay.innerHTML = '<div class="modal-card">'
      + '<div style="color:var(--text);font-size:17px;font-weight:800;margin-bottom:16px">Add Note</div>'
      + '<select id="mn-type" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;margin-bottom:12px;box-sizing:border-box">'
        + '<option value="research">🔬 Research</option>'
        + '<option value="ideas">💡 Ideas</option>'
        + '<option value="updates">📢 Updates</option>'
        + '<option value="private">🔒 Private</option>'
      + '</select>'
      + '<input id="mn-title" type="text" placeholder="Note title" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;margin-bottom:12px;box-sizing:border-box;outline:none">'
      + '<textarea id="mn-text" placeholder="Your note…" rows="4" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;margin-bottom:16px;box-sizing:border-box;outline:none;resize:vertical"></textarea>'
      + '<div style="display:flex;gap:10px">'
        + '<button onclick="this.closest(\'.modal-overlay\').remove()" style="flex:1;padding:12px;background:transparent;color:var(--text-dim);border:1px solid var(--border);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer">Cancel</button>'
        + '<button onclick="App._mfSaveNote(\'' + fundId + '\',this.closest(\'.modal-overlay\'))" class="btn" style="flex:1;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer">Save</button>'
      + '</div>'
    + '</div>';
    document.body.appendChild(overlay);
  },

  _mfSaveNote(fundId, overlay) {
    var type  = document.getElementById('mn-type')?.value || 'research';
    var title = document.getElementById('mn-title')?.value.trim();
    var text  = document.getElementById('mn-text')?.value.trim();
    if (!title || !text) { this.showToast('Title and text are required'); return; }
    if (!INV_NOTES[fundId]) INV_NOTES[fundId] = [];
    INV_NOTES[fundId].push({ id: uid(), type, date: new Date().toISOString().slice(0,10), title, text });
    overlay.remove();
    this.showToast('Note saved!');
    App.render();
  },

  _mfEditNote(fundId, noteId) {
    var notes = INV_NOTES[fundId] || [];
    var n = notes.find(function(n){ return n.id === noteId; });
    if (!n) return;
    var overlay = document.createElement('div');
    overlay.className = 'modal-overlay center';
    overlay.innerHTML = '<div class="modal-card">'
      + '<div style="color:var(--text);font-size:17px;font-weight:800;margin-bottom:16px">Edit Note</div>'
      + '<input id="mn-etitle" type="text" value="' + escapeHtml(n.title) + '" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;margin-bottom:12px;box-sizing:border-box;outline:none">'
      + '<textarea id="mn-etext" rows="4" style="width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:10px 14px;color:var(--text);font-size:14px;margin-bottom:16px;box-sizing:border-box;outline:none;resize:vertical">' + escapeHtml(n.text) + '</textarea>'
      + '<div style="display:flex;gap:10px">'
        + '<button onclick="this.closest(\'.modal-overlay\').remove()" style="flex:1;padding:12px;background:transparent;color:var(--text-dim);border:1px solid var(--border);border-radius:10px;font-size:14px;font-weight:700;cursor:pointer">Cancel</button>'
        + '<button onclick="App._mfSaveNoteEdit(\'' + fundId + '\',\'' + noteId + '\',this.closest(\'.modal-overlay\'))" class="btn" style="flex:1;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer">Update</button>'
      + '</div>'
    + '</div>';
    document.body.appendChild(overlay);
  },

  _mfSaveNoteEdit(fundId, noteId, overlay) {
    var notes = INV_NOTES[fundId] || [];
    var n = notes.find(function(n){ return n.id === noteId; });
    if (!n) return;
    var title = document.getElementById('mn-etitle')?.value.trim();
    var text  = document.getElementById('mn-etext')?.value.trim();
    if (!title || !text) { this.showToast('Title and text are required'); return; }
    n.title = title; n.text = text;
    overlay.remove();
    this.showToast('Note updated!');
    App.render();
  },

  _mfDeleteNote(fundId, noteId) {
    var notes = INV_NOTES[fundId] || [];
    var idx = notes.findIndex(function(n){ return n.id === noteId; });
    if (idx < 0) return;
    notes.splice(idx, 1);
    this.showToast('Note deleted');
    App.render();
  },

  /* ── Toast ───────────────────────────────────── */
  showToast(msg, duration = 2500) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._toastTimer);
    el._toastTimer = setTimeout(() => el.classList.remove('show'), duration);
  },
};

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

/* ══════════════════════════════════════════════════════
   10. INIT
══════════════════════════════════════════════════════ */
(async function init() {
  if (State.token && State.user) {
    if (State.token === 'demo-token') {
      // Demo mode — skip backend validation, load DEMO data directly
      await loadDashboardData();
      document.getElementById('tab-bar').style.display = 'flex';
      App.goTab('dashboard');
    } else {
      // Real token — validate with backend first
      await loadDashboardData();
      // If a 401 was received, _handleApiUnauth() already cleared the token
      // and rendered the login screen — don't overwrite that navigation.
      if (!State.token) return;
      document.getElementById('tab-bar').style.display = 'flex';
      App.goTab('dashboard');
    }
  } else {
    App.navigate('login');
  }
})();
</script>
