  },

  _doDeleteTx(id) {
    const idx = DEMO.transactions.findIndex(t => t.id === id);
    if (idx !== -1) {
      const tx = DEMO.transactions[idx];
      DEMO.transactions.splice(idx, 1);
      const txD = new Date(tx.date); const now2 = new Date();
      const isCur = txD.getMonth()===now2.getMonth() && txD.getFullYear()===now2.getFullYear();
      if (tx._type === 'income')  { if (isCur) DEMO.dashboard.monthly_income   -= tx.amount; DEMO.dashboard.total_balance -= tx.amount; }
      if (tx._type === 'expense') { if (isCur) DEMO.dashboard.monthly_expenses -= tx.amount; DEMO.dashboard.total_balance += tx.amount; }
      // Also reverse individual account balance
      const allAccts = State.data.accounts || DEMO.accounts;
      const srcAcct = allAccts.find(a => a.account_id === tx.account_id);
      if (tx._type === 'income'   && srcAcct) srcAcct.balance -= tx.amount;
      if (tx._type === 'expense'  && srcAcct) srcAcct.balance += tx.amount;
      if (tx._type === 'transfer') {
        if (srcAcct) srcAcct.balance += tx.amount;
        const destAcct = allAccts.find(a => a.account_id === tx.to_account_id);
        if (destAcct) destAcct.balance -= tx.amount;
      }
    }
    this.showToast('Transaction deleted');
    this.goTab('transactions');
  },

  async saveTx() {
    const amount = parseFloat(document.getElementById('tx-amount')?.value || '0');
    if (!amount || amount <= 0) { this.showToast('Please enter a valid amount'); return; }
    const type   = State.addTxType || State.params?.type || 'expense';
    const dateEl = document.getElementById('tx-date');
    const timeEl = document.getElementById('tx-time');
    const dateStr = dateEl?.value || new Date().toISOString().slice(0,10);
    const timeStr = timeEl?.value || '00:00';
    const date   = dateStr + 'T' + timeStr + ':00';
    const payee  = document.getElementById('tx-payee')?.value || '';
    const notes  = document.getElementById('tx-notes')?.value || '';
    const acct   = document.getElementById('tx-account')?.value || document.getElementById('tx-from')?.value || '';
    const cat    = type === 'transfer' ? 'Transfer' : (document.getElementById('tx-category')?.value || 'Others');
    const toAcct = document.getElementById('tx-to')?.value || '';
    if (type === 'transfer' && !toAcct) { this.showToast('Please select a destination account'); return; }
    if (type === 'transfer' && toAcct === acct) { this.showToast('From and To accounts must be different'); return; }

    const body = { amount, date, notes, account_id: acct, category: cat };
    let ok = false;
    if (type === 'income') {
      const r = await apiPost('/income', { ...body, source: payee });
      ok = !!r;
    } else if (type === 'expense') {
      const r = await apiPost('/expenses', { ...body, description: payee });
      ok = !!r;
    } else {
      const r = await apiPost('/transfers', { ...body, from_account_id: acct, to_account_id: toAcct });
      ok = !!r;
    }

    const isEdit = State.txIsEdit && State.txEditData;
    const editId = isEdit ? State.txEditData.id : null;
    const allAccts = State.data.accounts || DEMO.accounts;

    const txData = {
      _type: type, amount, date, category: cat,
      source: type === 'income' ? payee : '',
      description: type === 'expense' ? payee : '',
      payee, notes, account_id: acct,
      ...(type === 'transfer' ? { to_account_id: toAcct } : {}),
    };

    if (isEdit) {
      const idx = DEMO.transactions.findIndex(t => t.id === editId);
      if (idx !== -1) {
        const old = DEMO.transactions[idx];
        // Reverse old dashboard totals (only if in current month)
        const oldDate = new Date(old.date); const now3 = new Date();
        const oldIsCur = oldDate.getMonth()===now3.getMonth() && oldDate.getFullYear()===now3.getFullYear();
        if (old._type === 'income'  && oldIsCur) { DEMO.dashboard.monthly_income   -= old.amount; }
        if (old._type === 'expense' && oldIsCur) { DEMO.dashboard.monthly_expenses -= old.amount; }
        DEMO.dashboard.total_balance -= (old._type==='income' ? old.amount : old._type==='expense' ? -old.amount : 0);
        // Reverse old individual account balances
        const oldAcct = allAccts.find(a => a.account_id === old.account_id);
        if (old._type === 'income'  && oldAcct) oldAcct.balance -= old.amount;
        if (old._type === 'expense' && oldAcct) oldAcct.balance += old.amount;
        if (old._type === 'transfer') {
          if (oldAcct) oldAcct.balance += old.amount;
          const oldTo = allAccts.find(a => a.account_id === old.to_account_id);
          if (oldTo) oldTo.balance -= old.amount;
        }
        DEMO.transactions[idx] = { ...old, ...txData };
      }
    } else {
      DEMO.transactions.unshift({ id: uid('tx_'), ...txData });
    }

    const txDate2 = new Date(date); const now2 = new Date();
    const isCurrentMonth = txDate2.getMonth() === now2.getMonth() && txDate2.getFullYear() === now2.getFullYear();
    if (type === 'income')  { if (isCurrentMonth) DEMO.dashboard.monthly_income   += amount; DEMO.dashboard.total_balance += amount; }
    if (type === 'expense') { if (isCurrentMonth) DEMO.dashboard.monthly_expenses += amount; DEMO.dashboard.total_balance -= amount; }
    // Update individual account balances
    const srcAcct = allAccts.find(a => a.account_id === acct);
    if (type === 'income'  && srcAcct) srcAcct.balance += amount;
    if (type === 'expense' && srcAcct) srcAcct.balance -= amount;
    if (type === 'transfer') {
      if (srcAcct) srcAcct.balance -= amount;
      const destAcct = allAccts.find(a => a.account_id === toAcct);
      if (destAcct) destAcct.balance += amount;
    }

    State.addTxType   = null;
    State.txRecurring = false;
    State.txEditData  = null;
    State.txIsEdit    = false;
    const label = type.charAt(0).toUpperCase() + type.slice(1);
    this.showToast(isEdit ? label + ' updated!' : (ok ? label + ' saved!' : label + ' saved (demo mode)'));
    await loadDashboardData();
    this.goTab('transactions');
  },

  /* ── Reminder Actions ────────────────────────── */
  openReminderDetail(id) {
    State.remDetailId = id;
    this.navigate('reminder-detail');
  },

  markReminderPaid(id) {
    const r = (DEMO.reminders||[]).find(x => x.reminder_id === id);
    if (r) { r.is_completed = true; r.completed_on = new Date().toISOString().slice(0,10); r.paid_amount = r.amount; }
    this.showToast('Reminder marked as paid ✅');
    this.navigate('reminders');
  },

  snoozeReminder(id) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    const opts = [[1,'Tomorrow'],[3,'3 Days'],[7,'1 Week'],[14,'2 Weeks']];
    const btns = opts.map(([d,l]) => '<button class="btn btn-outline" style="width:100%;margin-bottom:8px" onclick="this.closest(\'.modal-overlay\').remove();App._doSnooze(\''+id+'\','+d+')">⏰ '+l+'</button>').join('');
    overlay.innerHTML = '<div class="modal-sheet"><div class="modal-handle"></div>'
      +'<div style="color:var(--text);font-size:16px;font-weight:700;margin-bottom:16px;text-align:center">Snooze Reminder</div>'
      +btns
      +'<button class="btn btn-outline" style="width:100%;color:var(--text-dim)" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>'
      +'</div>';
    document.getElementById('phone-frame').appendChild(overlay);
  },

  _doSnooze(id, days) {
    const r = (DEMO.reminders||[]).find(x => x.reminder_id === id);
    if (!r) return;
    if (r.is_completed) { this.showToast('Cannot snooze a completed reminder'); return; }
    if (r && r.reminder_date) {
      const d = new Date(r.reminder_date);
      d.setDate(d.getDate() + days);
      r.reminder_date = d.toISOString().slice(0,10);
    }
    this.showToast('Snoozed for ' + days + ' day' + (days > 1 ? 's' : '') + ' ⏰');
    this.render();
  },

  deleteReminder(id) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    overlay.innerHTML = '<div class="modal-sheet"><div class="modal-handle"></div>'
      +'<div style="text-align:center;padding:10px 0 20px">'
      +'<div style="font-size:44px;margin-bottom:12px">🗑️</div>'
      +'<div style="color:var(--text);font-size:17px;font-weight:700;margin-bottom:8px">Delete Reminder?</div>'
      +'<div style="color:var(--text-dim);font-size:14px;margin-bottom:24px">This cannot be undone.</div>'
      +'<div style="display:flex;gap:12px">'
      +'<button class="btn btn-outline" style="flex:1" onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>'
      +'<button class="btn btn-primary" style="flex:1;background:#EF4444;border-color:#EF4444" onclick="this.closest(\'.modal-overlay\').remove();App._doDeleteReminder(\''+id+'\')">Delete</button>'
      +'</div></div></div>';
    document.getElementById('phone-frame').appendChild(overlay);
  },

  _doDeleteReminder(id) {
    const idx = (DEMO.reminders||[]).findIndex(x => x.reminder_id === id);
    if (idx !== -1) DEMO.reminders.splice(idx, 1);
    this.showToast('Reminder deleted');
    this.navigate('reminders');
  },

  duplicateReminder(id) {
    const r = (DEMO.reminders||[]).find(x => x.reminder_id === id);
    if (!r) return;
    const copy = Object.assign({}, r, { reminder_id: uid('rem_'), is_completed: false, completed_on: null, paid_amount: null });
    DEMO.reminders.push(copy);
    this.showToast('Reminder duplicated 📋');
    this.render();
  },

  toggleAlertDay(days) {
    if (!State.remForm) return;
    State.remForm.alertDays = State.remForm.alertDays || [];
    const idx = State.remForm.alertDays.indexOf(days);
    if (idx >= 0) State.remForm.alertDays.splice(idx, 1);
    else State.remForm.alertDays.push(days);
    this.render();
  },

  saveReminder() {
    const rf = State.remForm;
    if (!rf) return;
    const title  = (rf.title || '').trim();
    const amount = parseFloat(rf.amount || 0);
    const date   = rf.date || '';
    if (!title)  { this.showToast('Please enter a reminder title'); return; }
    if (!amount || amount <= 0) { this.showToast('Please enter a valid amount'); return; }
    if (!date)   { this.showToast('Please select a due date'); return; }
    const existing = (DEMO.reminders || []).find(function(r){ return r.reminder_id === rf.id; });
    const newRem = {
      reminder_id: existing ? rf.id : uid('rem_'),
      title,
      amount,
      reminder_date: date,
      reminder_type: rf.type || 'bill',
      provider: rf.provider || '',
      description: rf.notes || '',
      priority: rf.priority || 'medium',
      is_completed: existing ? existing.is_completed : false,
      is_recurring: rf.recurring || false,
      recurrence: rf.recurrence || 'monthly',
      end_type: rf.endType || 'never',
      end_date: rf.endDate || null,
      end_after: rf.endAfter || null,
      auto_pay: rf.autoPay || false,
      alert_days: rf.alertDays || [1],
      account_id: rf.account || null,
    };
    if (existing) {
      const idx = DEMO.reminders.indexOf(existing);
      DEMO.reminders[idx] = newRem;
      this.showToast('Reminder updated! 🔔');
    } else {
      DEMO.reminders.push(newRem);
      this.showToast('Reminder saved! 🔔');
    }
    State.remForm    = null;
    State.remDetailId = null;
    this.navigate('reminders');
  },

  remCalPrev() {
    if (State.remCalMonth === 0) { State.remCalMonth = 11; State.remCalYear--; }
    else State.remCalMonth--;
    State.remCalDay = null;
    this.render();
  },

  remCalNext() {
    if (State.remCalMonth === 11) { State.remCalMonth = 0; State.remCalYear++; }
    else State.remCalMonth++;
    State.remCalDay = null;
    this.render();
  },

  remCalSelectDay(day) {
    State.remCalDay = State.remCalDay === day ? null : day;
    this.render();
  },

  /* ── Toast ───────────────────────────────────── */
  showToast(msg, duration = 2500) {
    const el = document.getElementById('toast');
    if (!el) return;
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(el._toastTimer);
    el._toastTimer = setTimeout(() => el.classList.remove('show'), duration);
  },
};

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

/* ══════════════════════════════════════════════════════
   10. INIT
══════════════════════════════════════════════════════ */
(async function init() {
  if (State.token && State.user) {
    // Already logged in — restore session
    await loadDashboardData();
    document.getElementById('tab-bar').style.display = 'flex';
    App.goTab('dashboard');
  } else {
    App.navigate('login');
  }
})();
</script>
</body>
</html>
