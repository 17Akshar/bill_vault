  var funds   = _etfFunds();
  var filter  = State.etfHoldingsFilter || 'all';
  var search  = State.etfSearch || '';

  var filtered = funds.filter(function(f) {
    if (filter === 'active' && f.status !== 'active') return false;
    if (filter === 'sold'   && f.status !== 'sold')   return false;
    if (search && f.name.toLowerCase().indexOf(search.toLowerCase()) < 0) return false;
    return true;
  });

  var activeFunds = funds.filter(function(f){ return f.status === 'active'; });
  var totalInv    = activeFunds.reduce(function(s,f){ return s + (f.invested||0); }, 0);
  var totalCur    = activeFunds.reduce(function(s,f){ return s + (f.current||0); }, 0);
  var totalGain   = activeFunds.reduce(function(s,f){ return s + Math.max(0, _etfGain(f)); }, 0);
  var totalLoss   = activeFunds.reduce(function(s,f){ return s + Math.min(0, _etfGain(f)); }, 0);
  var gainPct     = totalInv > 0 ? (totalGain / totalInv * 100) : 0;
  var lossPct     = totalInv > 0 ? (Math.abs(totalLoss) / totalInv * 100) : 0;

  var filterTabs = [
    { key:'all',    label:'All (' + funds.length + ')' },
    { key:'active', label:'Active (' + activeFunds.length + ')' },
    { key:'sold',   label:'Sold (' + funds.filter(function(f){ return f.status==='sold'; }).length + ')' },
  ].map(function(t) {
    var active = filter === t.key;
    return '<div onclick="State.etfHoldingsFilter=\'' + t.key + '\';App.render()"'
      + ' style="flex:1;text-align:center;padding:10px 4px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid ' + (active ? '#38BDF8' : 'transparent') + ';color:' + (active ? '#38BDF8' : 'var(--text-dim)') + '">' + t.label + '</div>';
  }).join('');

  var cards = filtered.map(function(f) {
    var gain = _etfGain(f), gp = _etfGainPct(f), gc = _etfColor(gain);
    var isSold = f.status === 'sold';
    var col = _etfFundColor(f.id);
    var displayCur = isSold ? (f.sold_value || 0) : (f.current || 0);
    var displayGain = isSold ? ((f.sold_value||0) - (f.invested||0)) : gain;
    var displayGp   = f.invested > 0 ? (displayGain / f.invested * 100) : 0;
    var gc2 = _etfColor(displayGain);

    return '<div onclick="App.navigate(\'etf-detail\',{id:\'' + f.id + '\'})"'
      + ' style="background:var(--card2);border-radius:var(--radius-sm);padding:14px;border:1px solid var(--border);margin-bottom:10px;cursor:pointer">'
      // Top row: icon + name + exchange + badge
      + '<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">'
        + '<div style="width:44px;height:44px;border-radius:12px;background:' + col + '22;border:1px solid ' + col + '33;display:flex;align-items:center;justify-content:center;color:' + col + ';font-size:11px;font-weight:900;flex-shrink:0">' + _etfInitials(f.name) + '</div>'
        + '<div style="flex:1;min-width:0">'
          + '<div style="color:var(--text);font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(f.name) + '</div>'
          + '<div style="color:var(--text-dim);font-size:11px;margin-top:2px">' + (f.exchange||'NSE') + ' · ' + (f.category||'Equity') + '</div>'
        + '</div>'
        + '<div style="display:flex;align-items:center;gap:6px">'
          + (isSold
            ? '<span style="background:rgba(255,77,106,0.12);color:#FF4D6A;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;border:1px solid rgba(255,77,106,0.25)">SOLD</span>'
            : '<span style="background:rgba(16,208,120,0.12);color:#10D078;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px;border:1px solid rgba(16,208,120,0.25)">ACTIVE</span>')
          + '<svg width="16" height="16" viewBox="0 0 24 24" fill="var(--text-dim)"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>'
        + '</div>'
      + '</div>'
      // Metrics grid
      + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'
        + '<div style="background:var(--card);border-radius:8px;padding:8px 10px">'
          + '<div style="color:var(--text-dim);font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px">Invested</div>'
          + '<div style="color:var(--text);font-size:12px;font-weight:800">' + formatINR(f.invested||0) + '</div>'
        + '</div>'
        + '<div style="background:var(--card);border-radius:8px;padding:8px 10px">'
          + '<div style="color:var(--text-dim);font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px">' + (isSold ? 'Redeemed' : 'Current') + '</div>'
          + '<div style="color:var(--text);font-size:12px;font-weight:800">' + formatINR(displayCur) + '</div>'
        + '</div>'
        + '<div style="background:var(--card);border-radius:8px;padding:8px 10px">'
          + '<div style="color:var(--text-dim);font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px">Gain/Loss</div>'
          + '<div style="color:' + gc2 + ';font-size:12px;font-weight:800">' + _etfSign(displayGain) + formatINR(Math.abs(displayGain)) + '</div>'
          + '<div style="color:' + gc2 + ';font-size:10px;font-weight:700">' + _etfSign(displayGp) + displayGp.toFixed(2) + '%</div>'
        + '</div>'
      + '</div>'
    + '</div>';
  }).join('');

  return '<div class="screen-wrap" style="padding-bottom:90px">'
    // Header
    + '<div style="display:flex;align-items:center;justify-content:space-between;padding:52px 20px 12px">'
      + '<div class="icon-btn" onclick="App.navigate(\'investment-dashboard\')">'
        + '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>'
      + '</div>'
      + '<div style="text-align:center">'
        + '<div style="color:var(--text);font-size:19px;font-weight:800">Exchange Traded Funds</div>'
        + '<div style="color:var(--text-dim);font-size:11px;margin-top:2px">' + funds.length + ' ETFs · NSE/BSE</div>'
      + '</div>'
      + '<div onclick="App.navigate(\'etf-add-transaction\',{mode:\'new\'})" style="width:38px;height:38px;border-radius:19px;background:#38BDF8;display:flex;align-items:center;justify-content:center;cursor:pointer">'
        + '<svg width="18" height="18" viewBox="0 0 24 24" fill="#0a0a0a"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>'
      + '</div>'
    + '</div>'
    // Summary card
    + '<div style="margin:0 20px 14px;background:var(--card);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border)">'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">'
        + '<div>'
          + '<div style="color:var(--text-dim);font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px">Total Invested</div>'
          + '<div style="color:var(--text);font-size:18px;font-weight:900">' + formatINR(totalInv) + '</div>'
        + '</div>'
        + '<div>'
          + '<div style="color:var(--text-dim);font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px">Current Value</div>'
          + '<div style="color:var(--text);font-size:18px;font-weight:900">' + formatINR(totalCur) + '</div>'
        + '</div>'
      + '</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.06)">'
        + '<div style="background:rgba(16,208,120,0.08);border:1px solid rgba(16,208,120,0.18);border-radius:8px;padding:8px 12px">'
          + '<div style="color:var(--text-dim);font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Total Gain</div>'
          + '<div style="color:#10D078;font-size:15px;font-weight:900">' + _etfSign(totalGain) + formatINR(totalGain) + '</div>'
          + '<div style="color:#10D078;font-size:10px;font-weight:700">(' + gainPct.toFixed(2) + '%)</div>'
        + '</div>'
        + '<div style="background:rgba(255,77,106,0.08);border:1px solid rgba(255,77,106,0.18);border-radius:8px;padding:8px 12px">'
          + '<div style="color:var(--text-dim);font-size:10px;font-weight:700;text-transform:uppercase;margin-bottom:3px">Total Loss</div>'
          + '<div style="color:#FF4D6A;font-size:15px;font-weight:900">– ' + formatINR(Math.abs(totalLoss)) + '</div>'
          + '<div style="color:#FF4D6A;font-size:10px;font-weight:700">(' + lossPct.toFixed(2) + '%)</div>'
        + '</div>'
      + '</div>'
    + '</div>'
    // Search bar
    + '<div style="margin:0 20px 12px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px">'
      + '<svg width="16" height="16" viewBox="0 0 24 24" fill="var(--text-dim)"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>'
      + '<input type="text" placeholder="Search ETFs…" value="' + escapeHtml(search) + '"'
        + ' oninput="State.etfSearch=this.value;App.render()"'
        + ' style="flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px">'
      + (search ? '<div onclick="State.etfSearch=\'\';App.render()" style="color:var(--text-dim);cursor:pointer;font-size:18px;line-height:1">×</div>' : '')
    + '</div>'
    // Filter tabs
    + '<div style="display:flex;margin:0 20px 14px;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border)">' + filterTabs + '</div>'
    // ETF cards
    + '<div style="padding:0 20px">'
      + (cards || '<div style="color:var(--text-dim);font-size:14px;text-align:center;padding:40px 0">No ETFs found.</div>')
    + '</div>'
  + '</div>';
}

/* ─── ETF DETAIL ─────────────────────────────────────── */
function renderETFDetail() {
  var id     = (State.params && State.params.id) || ((_etfFunds()[0]||{}).id);
  var fund   = _etfFund(id);
  var tab    = State.etfDetailTab || 'overview';
  var period = State.etfChartPeriod || '1Y';
  var gain   = _etfGain(fund), gp = _etfGainPct(fund), gc = _etfColor(gain);
  var col    = _etfFundColor(id);
  var isSold = fund.status === 'sold';

  var hist = fund.nav_history || [];
  var curNav = hist.length ? hist[hist.length - 1] : (fund.current_price || 0);
  var prevNav = hist.length > 1 ? hist[hist.length - 2] : curNav;
  var navChg = curNav - prevNav, navChgPct = prevNav > 0 ? (navChg / prevNav * 100) : 0;
  var navGc  = _etfColor(navChg);

  var tabs = ['overview','transactions','notes'].map(function(t) {
    var lbl = t.charAt(0).toUpperCase() + t.slice(1);
    var active = tab === t;
    return '<div onclick="State.etfDetailTab=\'' + t + '\';App.render()" style="flex:1;text-align:center;padding:10px 4px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid ' + (active ? col : 'transparent') + ';color:' + (active ? col : 'var(--text-dim)') + '">' + lbl + '</div>';
  }).join('');

  var periodTabs = ['1D','1M','3M','6M','1Y','3Y','5Y','ALL'].map(function(p) {
    var active = period === p;
    return '<div onclick="State.etfChartPeriod=\'' + p + '\';App.render()" style="padding:4px 8px;border-radius:6px;background:' + (active ? col : 'transparent') + ';color:' + (active ? '#fff' : 'var(--text-dim)') + ';font-size:11px;font-weight:700;cursor:pointer">' + p + '</div>';
  }).join('');

  var bodyHtml = '';
  if (tab === 'overview')      bodyHtml = _etfDetailOverview(fund, col, gc, period, periodTabs, curNav, navChg, navChgPct, navGc, isSold);
  else if (tab === 'transactions') bodyHtml = _etfDetailTransactions(id);
  else                         bodyHtml = _etfDetailNotes(id);

  return '<div class="screen-wrap" style="padding-bottom:100px">'
    // Header
    + '<div style="display:flex;align-items:center;gap:14px;padding:52px 20px 14px">'
      + '<div class="icon-btn" onclick="App.navigate(\'etf-list\')">'
        + '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>'
      + '</div>'
      + '<div style="flex:1;min-width:0">'
        + '<div style="color:var(--text);font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(fund.name || 'ETF') + '</div>'
        + '<div style="color:var(--text-dim);font-size:11px;margin-top:2px">' + (fund.exchange||'NSE') + ' · Folio: ' + (fund.folio_id||'—') + '</div>'
      + '</div>'
      + '<div style="width:36px;height:36px;background:rgba(255,255,255,0.06);border-radius:18px;display:flex;align-items:center;justify-content:center;cursor:pointer" onclick="App.showToast(\'Options coming soon\')">'
        + '<svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text-dim)"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>'
      + '</div>'
    + '</div>'
    // ETF identity card
    + '<div style="margin:0 20px 14px;background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border)">'
      + '<div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">'
        + '<div style="width:52px;height:52px;border-radius:14px;background:' + col + '22;border:1.5px solid ' + col + '44;display:flex;align-items:center;justify-content:center;color:' + col + ';font-size:14px;font-weight:900;flex-shrink:0">' + _etfInitials(fund.name) + '</div>'
        + '<div style="flex:1;min-width:0">'
          + '<div style="color:var(--text);font-size:15px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(fund.name||'') + '</div>'
          + '<div style="color:var(--text-dim);font-size:12px;margin-top:3px">' + (fund.exchange||'NSE') + ' · ' + (fund.symbol||'—') + '</div>'
        + '</div>'
        + (isSold
          ? '<span style="background:rgba(255,77,106,0.12);color:#FF4D6A;font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;border:1px solid rgba(255,77,106,0.3)">SOLD</span>'
          : '<span style="background:rgba(16,208,120,0.12);color:#10D078;font-size:11px;font-weight:800;padding:4px 10px;border-radius:8px;border:1px solid rgba(16,208,120,0.3)">Active</span>')
      + '</div>'
      + (!isSold ? '<div>'
        + '<div style="color:var(--text);font-size:28px;font-weight:900;letter-spacing:-0.5px">₹' + curNav.toFixed(2) + '</div>'
        + '<div style="display:flex;align-items:center;gap:8px;margin-top:4px">'
          + '<span style="color:' + navGc + ';font-size:13px;font-weight:700">' + _etfSign(navChg) + navChg.toFixed(2) + ' (' + _etfSign(navChgPct) + navChgPct.toFixed(2) + '%)</span>'
          + '<span style="color:var(--text-dim);font-size:11px">NAV (' + (new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})) + ')</span>'
        + '</div>'
      + '</div>' : '')
      + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:' + (isSold ? '0' : '14px') + ';padding-top:' + (isSold ? '0' : '14px') + ';border-top:' + (isSold ? 'none' : '1px solid rgba(255,255,255,0.07)') + '">'
        + _etfMetricCell('Total Invested', formatINR(fund.invested||0), 'var(--text)')
        + _etfMetricCell('Current Value', formatINR(isSold ? (fund.sold_value||0) : (fund.current||0)), 'var(--text)')
        + _etfMetricCell('Gain/Loss', _etfSign(gain) + formatINR(Math.abs(gain)) + '\n' + _etfSign(gp) + gp.toFixed(2) + '%', gc)
      + '</div>'
    + '</div>'
    // Tabs
    + '<div style="display:flex;margin:0 20px 14px;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border)">' + tabs + '</div>'
    + bodyHtml
    // CTA buttons
    + (!isSold ? '<div style="position:fixed;bottom:0;left:0;right:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:14px 20px 22px;display:flex;gap:12px;max-width:480px;margin:auto;box-sizing:border-box">'
      + '<button onclick="App.navigate(\'etf-add-transaction\',{id:\'' + id + '\',txType:\'purchase\'})" class="btn" style="flex:1;padding:14px;font-size:14px;font-weight:800;border-radius:var(--radius-sm);background:#10D078;color:#000;border:none">Invest More</button>'
      + '<button onclick="App.navigate(\'etf-add-transaction\',{id:\'' + id + '\',txType:\'redemption\'})" class="btn" style="flex:1;padding:14px;font-size:14px;font-weight:800;border-radius:var(--radius-sm);background:var(--primary);color:#fff;border:none">Redeem</button>'
    + '</div>' : '')
  + '</div>';
}

function _etfMetricCell(label, value, color) {
  var lines = String(value).split('\n');
  return '<div style="background:rgba(255,255,255,0.04);border-radius:8px;padding:8px 10px">'
    + '<div style="color:var(--text-dim);font-size:9px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px">' + label + '</div>'
    + '<div style="color:' + color + ';font-size:12px;font-weight:800;line-height:1.4">' + lines.join('<br>') + '</div>'
  + '</div>';
}

function _etfDetailOverview(fund, col, gc, period, periodTabs, curNav, navChg, navChgPct, navGc, isSold) {
  var chart = _etfNavChart(fund, period);
  return '<div style="padding:0 20px">'
    // Performance chart
    + '<div style="background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);margin-bottom:14px">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">'
        + '<div>'
          + '<div style="color:var(--text-dim);font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px">Performance</div>'
          + '<div style="color:var(--text);font-size:18px;font-weight:900">₹' + curNav.toFixed(2) + '</div>'
          + (navChg !== 0 ? '<div style="color:' + navGc + ';font-size:12px;font-weight:700">' + _etfSign(navChg) + navChg.toFixed(2) + ' (' + _etfSign(navChgPct) + navChgPct.toFixed(2) + '%)</div>' : '')
        + '</div>'
      + '</div>'
      + '<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px">' + periodTabs + '</div>'
      + (chart || '<div style="height:90px;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:12px;border:1px dashed rgba(255,255,255,0.1);border-radius:8px">' + (isSold ? 'ETF has been redeemed' : 'Chart data unavailable') + '</div>')
    + '</div>'
    // ETF info table
    + '<div style="background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);margin-bottom:14px">'
      + '<div style="color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:12px">ETF INFORMATION</div>'
      + _etfInfoRow('Units',            (fund.qty||0) + ' units')
      + _etfInfoRow('Avg. NAV',         '₹' + (fund.buy_price||0).toFixed(2))
      + _etfInfoRow('Invested On',      fund.invested_on || '—')
      + _etfInfoRow('Category',         fund.category || '—')
      + _etfInfoRow('Expense Ratio',    fund.expense_ratio ? fund.expense_ratio + '%' : '—')
      + _etfInfoRow('Dividend Option',  fund.dividend_option || '—')
      + _etfInfoRow('Fund House',       fund.fund_house || '—')
      + _etfInfoRow('Benchmark',        fund.benchmark || '—')
      + _etfInfoRow('Exchange',         fund.exchange || 'NSE')
      + _etfInfoRow('Symbol',           fund.symbol || '—')
      + (fund.status === 'sold' ? _etfInfoRow('Sold On', fund.sold_on || '—') : '')
      + (fund.status === 'sold' ? _etfInfoRow('Sale Value', formatINR(fund.sold_value||0)) : '')
    + '</div>'
  + '</div>';
}

function _etfInfoRow(label, value) {
  return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.05)">'
    + '<div style="color:var(--text-dim);font-size:13px">' + label + '</div>'
    + '<div style="color:var(--text);font-size:13px;font-weight:700;text-align:right;max-width:60%">' + escapeHtml(String(value)) + '</div>'
  + '</div>';
}

function _etfDetailTransactions(id) {
  var txData = INV_TRANSACTIONS[id] || { buys: [], sells: [] };
  var buys   = txData.buys  || [];
  var sells  = txData.sells || [];

  var totBuyAmt  = buys.reduce(function(s,t){ return s+(t.amount||0); }, 0);
  var totBuyQty  = buys.reduce(function(s,t){ return s+(t.qty||0); }, 0);
  var avgNav     = totBuyQty > 0 ? (totBuyAmt / totBuyQty) : 0;

/* ─── RECURRING DEPOSIT MODULE ──────────────────────── */
function _rdAll() { return INV_PORTFOLIO.recurring_deposits || []; }
function _rdFunds(filter) {
  var rds = _rdAll();
  if (filter === 'active')  return rds.filter(function(r){ return r.status === 'active'; });
  if (filter === 'matured') return rds.filter(function(r){ return r.status === 'matured'; });
  if (filter === 'closed')  return rds.filter(function(r){ return r.status === 'closed'; });
  return rds;
}
function _rdFund(id) { return _rdAll().find(function(r){ return r.id === id; }) || {}; }
function _rdInstallments(id) { return (INV_TRANSACTIONS[id] && INV_TRANSACTIONS[id].installments) || []; }
function _rdPaidCount(id) { return _rdInstallments(id).length; }
function _rdTotalInvested(id) {
  return _rdInstallments(id).reduce(function(s, t){ return s + (t.amount||0); }, 0);
}
function _rdCalcCurrentValue(installmentAmt, rate, paidCount) {
  if (paidCount <= 0) return 0;
  var r_m = rate / 12 / 100;
  if (r_m < 0.000001) return installmentAmt * paidCount;
  return installmentAmt * (1 + r_m) * (Math.pow(1 + r_m, paidCount) - 1) / r_m;
}
function _rdCalcMaturity(installmentAmt, rate, months) {
  var r_m = rate / 12 / 100;
  if (r_m < 0.000001) return installmentAmt * months;
  return installmentAmt * (1 + r_m) * (Math.pow(1 + r_m, months) - 1) / r_m;
}
function _rdDaysRemaining(maturityDate) {
  var mat = new Date(maturityDate), now = new Date();
  return Math.max(0, Math.ceil((mat - now) / (1000*86400)));
}
function _rdMonthsRemaining(maturityDate) {
  var mat = new Date(maturityDate), now = new Date();
  var diff = (mat.getFullYear() - now.getFullYear()) * 12 + (mat.getMonth() - now.getMonth());
  return Math.max(0, diff);
}
function _rdBankColor(id) {
  var map = { rd1:'#22409A', rd2:'#0052CC' };
  return map[id] || '#8B5CF6';
}
function _rdBankInitials(bank) {
  return (bank||'RD').split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
}
function _rdGrowthChart(r, period) {
  var months = r.tenure_months || 24;
  var maxM   = period === '1M' ? 1 : period === '3M' ? 3 : period === '6M' ? 6 : period === '1Y' ? 12 : months;
  maxM = Math.min(maxM, months);
  var pts = Math.min(maxM + 1, 25);
  var points = [];
  for (var i = 0; i < pts; i++) {
    var m = Math.round((i / (pts-1)) * maxM);
    points.push(_rdCalcCurrentValue(r.installment_amount, r.interest_rate, m));
  }
  var min = 0, max = points[points.length-1] || 1;
  var w = 320, h = 90;
  var coords = points.map(function(v, i) {
    var x = (i / (pts-1)) * w;
    var y = h - ((v-min) / (max-min+0.01)) * (h-12) - 6;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var d = 'M'+coords[0];
  for (var j=0; j<coords.length-1; j++) {
    var cp = coords[j].split(','), np = coords[j+1].split(',');
    var mx = ((+cp[0]+(+np[0]))/2).toFixed(1);
    var my = ((+cp[1]+(+np[1]))/2).toFixed(1);
    d += ' Q'+cp[0]+','+cp[1]+' '+mx+','+my;
  }
  d += ' L'+coords[coords.length-1];
  var area = d+' L'+w+','+h+' L0,'+h+' Z';
  var gl = [0.25,0.5,0.75].map(function(f){ var y=(h*f+6).toFixed(1); return '<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>'; }).join('');
  var lx = coords[coords.length-1].split(',')[0], ly = coords[coords.length-1].split(',')[1];
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'
    +'<defs><linearGradient id="rdg'+period+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10D078" stop-opacity="0.4"/><stop offset="100%" stop-color="#10D078" stop-opacity="0.03"/></linearGradient></defs>'
    +gl
    +'<path d="'+area+'" fill="url(#rdg'+period+')"/>'
    +'<path d="'+d+'" fill="none" stroke="#10D078" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+lx+'" cy="'+ly+'" r="4" fill="#10D078" stroke="#0f0f1a" stroke-width="2"/>'
    +'</svg>';
}

function renderRDDetail() {

  var header = '<div class="form-header">'

    +'<div class="form-header-title">'+r.name+'</div>'

    +'</div>';

  var body = '';

    var identCard = '<div style="margin:0 16px 14px;background:var(--card);border-radius:var(--radius);padding:18px">'

      +'<div style="width:52px;height:52px;border-radius:50%;background:'+color+'22;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:'+color+'">'+initials+'</div>'

      +'</div>'
      +'<div style="display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid rgba(255,255,255,.07);margin-bottom:14px">'
      +'<div><div style="font-size:11px;color:var(--text-dim)">Total Invested</div><div style="font-size:24px;font-weight:800;color:var(--text)">'+formatINR(totalInv)+'</div></div>'
      +'<div style="text-align:right"><div style="font-size:11px;color:var(--text-dim)">Rate (p.a.)</div><div style="font-size:24px;font-weight:800;color:#8B5CF6">'+r.interest_rate+'%</div></div>'
      +'</div>'
      // Info rows
      +[
        ['Invested On',           _invFmtDate(r.start_date)],
        ['Maturity Date',         _invFmtDate(r.maturity_date)+(isActive?' <span style="font-size:10px;color:#8B5CF6;font-weight:700">('+moLeft+' Months to maturity)</span>':'')],
        ['Tenure',                r.tenure],
        ['Interest Type',         r.interest_type],
        ['Payout',                r.payout],
        ['Installment Amount',    formatINR(r.installment_amount)],
        ['Total Installments',    '<span style="color:#8B5CF6;font-weight:700">'+paid+' / '+r.total_installments+' Paid</span>'],
        ['Total Invested',        formatINR(totalInv)],
        ['Interest Earned (Till Now)', '<span style="color:#10D078;font-weight:700">'+formatINR(Math.round(intEarned))+'</span>'],
        ['Current Value',         '<span style="color:var(--text);font-weight:700">'+formatINR(Math.round(curVal))+'</span>'],
      ].map(function(row){
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)">'
          +'<div style="font-size:13px;color:var(--text-dim)">'+row[0]+'</div>'

      +'<div style="font-size:11px;color:var(--text-dim)">'+_invFmtDate(r.start_date)+'</div>'
      +'<div style="font-size:11px;color:var(--text-dim)">'+_invFmtDate(r.maturity_date)+'</div>'
      +'</div>'
      +'</div>';

    var actionBtns = '<div style="margin:0 16px 20px;display:flex;gap:10px">'
      +'<button onclick="App.navigate(\'rd-add\')" style="flex:1;padding:13px;border-radius:var(--radius-sm);background:#22C55E;color:#000;font-weight:700;font-size:14px;border:none;cursor:pointer">+ Add Investment</button>'
      +(isActive?'<button onclick="App._rdPreMature(\''+id+'\')" style="flex:1;padding:13px;border-radius:var(--radius-sm);background:#8B5CF6;color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer">Make Pre-mature</button>':'')
      +'</div>';

    body = identCard + chartCard + actionBtns;

  } else if (tab === 'transactions') {

    var latestNum = sorted.length > 0 ? sorted[0].number : 0;

    var rows = sorted.map(function(t){
      var isLatest = t.number === latestNum;
      return '<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)">'
        +'<div style="flex:1">'
        +'<div style="font-size:13px;font-weight:700;color:var(--text)">'+_invFmtDate(t.date)+'</div>'
        +'<div style="font-size:11px;color:var(--text-dim);margin-top:1px">'+formatINR(t.amount)+' · '+t.mode.replace('_',' ')+'</div>'
        +'</div>'
        +'<div style="display:flex;align-items:center;gap:6px">'
        +'<span style="font-size:12px;font-weight:700;color:var(--text-dim)">Installment #'+t.number+'</span>'
        +(isLatest?'<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:#8B5CF622;color:#8B5CF6">Latest</span>':'<svg width="16" height="16" viewBox="0 0 24 24" fill="#22C55E"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>')

        +'</div>';
    }).join('');

    var summary = '<div style="display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid rgba(255,255,255,.08);margin-top:4px">'

      +'</div>';

    body = '<div style="margin:0 16px 12px;background:var(--card);border-radius:var(--radius);padding:16px">'

  } else {

    body = '<div style="margin:0 16px 14px">'

      +'</div>';
  }

  return '<div class="screen-wrap" style="padding-bottom:32px">'
    + header
    +'<div style="display:flex;margin:0 16px 14px;background:var(--card);border-radius:var(--radius)">'+tabs+'</div>'

    +'</div>';

/* ─── CASH INVESTMENT MODULE ────────────────────────── */
function _cashAll() { return INV_PORTFOLIO.cash_investment || []; }
function _cashFunds(filter) {
  var all = _cashAll();
  if (filter === 'active')  return all.filter(function(c){ return c.status === 'active'; });
  if (filter === 'closed')  return all.filter(function(c){ return c.status === 'closed'; });
  return all;
}
function _cashFund(id) { return _cashAll().find(function(c){ return c.id === id; }) || {}; }
function _cashInvestments(id) { return (INV_TRANSACTIONS[id] && INV_TRANSACTIONS[id].investments) || []; }
function _cashWithdrawals(id) { return (INV_TRANSACTIONS[id] && INV_TRANSACTIONS[id].withdrawals) || []; }
function _cashTotalInvested(id) {
  return _cashInvestments(id).reduce(function(s,t){ return s + (t.amount||0); }, 0);
}
function _cashTotalWithdrawn(id) {
  return _cashWithdrawals(id).reduce(function(s,t){ return s + (t.amount||0); }, 0);
}
function _cashCurrentValue(id) {
  return Math.max(0, _cashTotalInvested(id) - _cashTotalWithdrawn(id));
}
function _cashColor() { return '#10B981'; }
function _cashGrowthChart(c, period) {
  var inv = _cashTotalInvested(c.id) || c.invested || 0;
  var cur = _cashCurrentValue(c.id) || c.current || inv;
  var startDate = new Date(c.invested_on||'2024-01-01');
  var now = new Date();
  var totalDays = Math.max(1, (now - startDate) / 86400000);
  var maxDays = period==='1M'?30:period==='3M'?90:period==='6M'?180:period==='1Y'?365:totalDays;
  maxDays = Math.min(maxDays, totalDays);
  var pts = 25;
  var points = [];
  for (var i=0;i<pts;i++) {
    var d=(i/(pts-1))*maxDays;
    var pct=d/totalDays;
    points.push(Math.round(inv * 0.75 + (cur - inv * 0.75) * pct));
  }
  var min=Math.min.apply(null,points)*0.97, max=cur*1.03;
  if (max<=min) max=min+1;
  var w=320,h=90;
  var coords=points.map(function(v,i){
    var x=(i/(pts-1))*w;
    var y=h-((v-min)/(max-min))*(h-16)-8;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var d2='M'+coords[0];
  for(var j=0;j<coords.length-1;j++){
    var cp=coords[j].split(','),np=coords[j+1].split(',');
    var mx=((+cp[0]+(+np[0]))/2).toFixed(1);
    var my=((+cp[1]+(+np[1]))/2).toFixed(1);
    d2+=' Q'+cp[0]+','+cp[1]+' '+mx+','+my;
  }
  d2+=' L'+coords[coords.length-1];
  var area=d2+' L'+w+','+h+' L0,'+h+' Z';
  var gl=[0.25,0.5,0.75].map(function(f){var y=(h*f+8).toFixed(1);return '<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>';}).join('');
  var lx=coords[coords.length-1].split(',')[0],ly=coords[coords.length-1].split(',')[1];
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'
    +'<defs><linearGradient id="cashg'+period+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#10B981" stop-opacity="0.4"/><stop offset="100%" stop-color="#10B981" stop-opacity="0.03"/></linearGradient></defs>'
    +gl
    +'<path d="'+area+'" fill="url(#cashg'+period+')"/>'
    +'<path d="'+d2+'" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+lx+'" cy="'+ly+'" r="4" fill="#10B981" stroke="#0f0f1a" stroke-width="2"/>'
    +'</svg>';
}

/* ─── EPF MODULE ─────────────────────────────────────── */
var EPF_COLOR = '#60A5FA';
function _epfAll() { return INV_PORTFOLIO.epf || []; }
function _epfFunds(filter) {
  var all = _epfAll();
  if (filter === 'active')   return all.filter(function(e){ return e.status === 'active'; });
  if (filter === 'inactive') return all.filter(function(e){ return e.status === 'inactive'; });
  return all;
}
function _epfFund(id) { return _epfAll().find(function(e){ return e.id === id; }) || {}; }
function _epfWithdrawals(id) { return (INV_TRANSACTIONS[id] && INV_TRANSACTIONS[id].withdrawals) || []; }
function _epfCurrentBalance(id) {
  var e = _epfFund(id);
  return e.current || e.invested || 0;
}
function _epfEmployeeShare(id) { return Math.round(_epfCurrentBalance(id) * 0.5); }
function _epfEmployerShare(id) { return Math.round(_epfCurrentBalance(id) * 0.5); }
function _epfGrowthChart(e, period) {
  var inv = e.invested || 0;
  var cur = _epfCurrentBalance(e.id) || inv;
  var startDate = new Date('2022-04-01');
  var now = new Date();
  var totalDays = Math.max(1, (now - startDate) / 86400000);
  var maxDays = period==='1M'?30:period==='3M'?90:period==='6M'?180:period==='1Y'?365:totalDays;
  maxDays = Math.min(maxDays, totalDays);
  var pts=25, points=[];
  for(var i=0;i<pts;i++){ var d=(i/(pts-1))*maxDays,pct=d/totalDays; points.push(Math.round(inv+(cur-inv)*pct)); }
  var min=inv*0.96,max=cur*1.04,w=320,h=90;
  var coords=points.map(function(v,i){ var x=(i/(pts-1))*w,y=h-((v-min)/(max-min+0.01))*(h-12)-6; return x.toFixed(1)+','+y.toFixed(1); });
  var d2='M'+coords[0];
  for(var j=0;j<coords.length-1;j++){ var cp=coords[j].split(','),np=coords[j+1].split(','),mx=((+cp[0]+(+np[0]))/2).toFixed(1),my=((+cp[1]+(+np[1]))/2).toFixed(1); d2+=' Q'+cp[0]+','+cp[1]+' '+mx+','+my; }
  d2+=' L'+coords[coords.length-1];
  var area=d2+' L'+w+','+h+' L0,'+h+' Z';
  var gl=[0.25,0.5,0.75].map(function(f){var y=(h*f+6).toFixed(1);return '<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>';}).join('');
  var lx=coords[coords.length-1].split(',')[0],ly=coords[coords.length-1].split(',')[1];
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'
    +'<defs><linearGradient id="epfg'+period+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+EPF_COLOR+'" stop-opacity="0.4"/><stop offset="100%" stop-color="'+EPF_COLOR+'" stop-opacity="0.03"/></linearGradient></defs>'
    +gl+'<path d="'+area+'" fill="url(#epfg'+period+')"/>'
    +'<path d="'+d2+'" fill="none" stroke="'+EPF_COLOR+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+lx+'" cy="'+ly+'" r="4" fill="'+EPF_COLOR+'" stroke="#0f0f1a" stroke-width="2"/></svg>';
}

function renderEPFList() {
  var filter = State.epfFilter || 'all';
  var search  = (State.epfSearch || '').toLowerCase();
  var all = _epfAll();
  var totalBal = all.reduce(function(s,e){ return s + _epfCurrentBalance(e.id); }, 0);
  var totalEmp = all.reduce(function(s,e){ return s + _epfEmployeeShare(e.id); }, 0);
  var totalEr  = all.reduce(function(s,e){ return s + _epfEmployerShare(e.id); }, 0);
  var counts = { all:all.length, active:all.filter(function(e){return e.status==='active';}).length, inactive:all.filter(function(e){return e.status==='inactive';}).length };
  var filtered = _epfFunds(filter);
  if (search) filtered = filtered.filter(function(e){ return (e.name||'').toLowerCase().indexOf(search)>=0||(e.uan||'').indexOf(search)>=0; });

    +'<div class="icon-btn" onclick="App.navigate(\'investment-dashboard\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg></div>'

    +'</div>'

    +'<div style="display:flex;justify-content:space-between;margin-bottom:4px">'
    +'<div><div style="font-size:11px;color:var(--text-dim)">Total Balance</div><div style="font-size:22px;font-weight:800;color:var(--text)">'+formatINR(totalBal)+'</div></div>'

}

function renderEPFDetail() {

    body='<div style="margin:0 16px 14px">'

/* ─── PPF MODULE ─────────────────────────────────────── */
var PPF_COLOR = '#EC4899';
function _ppfAll() { return INV_PORTFOLIO.ppf || []; }
function _ppfFunds(filter) {
  var all = _ppfAll();
  if (filter === 'active')  return all.filter(function(p){ return p.status === 'active'; });
  if (filter === 'closed')  return all.filter(function(p){ return p.status === 'closed'; });
  return all;
}
function _ppfFund(id) { return _ppfAll().find(function(p){ return p.id === id; }) || {}; }
function _ppfContributions(id) { return (INV_TRANSACTIONS[id] && INV_TRANSACTIONS[id].contributions) || []; }
function _ppfTotalInvested(id) {
  return _ppfContributions(id).reduce(function(s,t){ return s + (t.amount||0); }, 0);
}
function _ppfInterestEarned(id) {
  var p  = _ppfFund(id);
  var inv = _ppfTotalInvested(id) || p.invested || 0;
  var ret = p.return_pct || 6.71;
  return Math.round(inv * ret / 100);
}
function _ppfCurrentValue(id) {
  return _ppfTotalInvested(id) + _ppfInterestEarned(id);
}
function _ppfGrowthChart(p, period) {
  var inv = _ppfTotalInvested(p.id) || p.invested || 0;
  var cur = _ppfCurrentValue(p.id) || p.current || inv;
  var startDate = new Date(p.invested_on || '2023-04-01');
  var now = new Date();
  var totalDays = Math.max(1, (now - startDate) / 86400000);
  var maxDays = period==='1M'?30:period==='3M'?90:period==='6M'?180:period==='1Y'?365:totalDays;
  maxDays = Math.min(maxDays, totalDays);
  var pts = 25, points = [];
  for (var i=0;i<pts;i++) {
    var d=(i/(pts-1))*maxDays, pct=d/totalDays;
    points.push(Math.round(inv+(cur-inv)*pct));
  }
  var min=inv*0.97, max=cur*1.03, w=320, h=90;
  var coords=points.map(function(v,i){
    var x=(i/(pts-1))*w;
    var y=h-((v-min)/(max-min+0.01))*(h-12)-6;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var d2='M'+coords[0];
  for(var j=0;j<coords.length-1;j++){
    var cp=coords[j].split(','),np=coords[j+1].split(',');
    var mx=((+cp[0]+(+np[0]))/2).toFixed(1), my=((+cp[1]+(+np[1]))/2).toFixed(1);
    d2+=' Q'+cp[0]+','+cp[1]+' '+mx+','+my;
  }
  d2+=' L'+coords[coords.length-1];
  var area=d2+' L'+w+','+h+' L0,'+h+' Z';
  var gl=[0.25,0.5,0.75].map(function(f){var y=(h*f+6).toFixed(1);return '<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>';}).join('');
  var lx=coords[coords.length-1].split(',')[0], ly=coords[coords.length-1].split(',')[1];
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'
    +'<defs><linearGradient id="ppfg'+period+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+PPF_COLOR+'" stop-opacity="0.4"/><stop offset="100%" stop-color="'+PPF_COLOR+'" stop-opacity="0.03"/></linearGradient></defs>'
    +gl
    +'<path d="'+area+'" fill="url(#ppfg'+period+')"/>'
    +'<path d="'+d2+'" fill="none" stroke="'+PPF_COLOR+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+lx+'" cy="'+ly+'" r="4" fill="'+PPF_COLOR+'" stroke="#0f0f1a" stroke-width="2"/>'
    +'</svg>';
}

          +'</div>'
          +'</div>';
      }).join('');

  return '<div class="screen-wrap" style="padding-bottom:32px">'
    +'<div class="form-header">'
    +'<div class="icon-btn" onclick="App.navigate(\'investment-dashboard\')"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg></div>'
    +'<div class="form-header-title">PPF</div>'
    +'<div class="icon-btn" onclick="App.navigate(\'add-ppf\')"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></div>'

/* ─── NPS MODULE ─────────────────────────────────────── */
function _npsAll() { return INV_PORTFOLIO.nps || []; }
function _npsFunds(filter) {
  var all = _npsAll();
  if (filter === 'active')  return all.filter(function(n){ return n.status === 'active'; });
  if (filter === 'closed')  return all.filter(function(n){ return n.status === 'closed'; });
  return all;
}
function _npsFund(id) { return _npsAll().find(function(n){ return n.id === id; }) || {}; }
function _npsInvestments(id) { return (INV_TRANSACTIONS[id] && INV_TRANSACTIONS[id].investments) || []; }
function _npsTotalInvested(id) {
  return _npsInvestments(id).reduce(function(s,t){ return s + (t.amount||0); }, 0);
}
function _npsCurrentValue(id) {
  var n = _npsFund(id);
  var inv = _npsTotalInvested(id);
  var ret = n.return_pct || 11.2;
  return Math.round(inv * (1 + ret/100));
}
function _npsGain(id) { return _npsCurrentValue(id) - _npsTotalInvested(id); }
function _npsGainPct(id) {
  var inv = _npsTotalInvested(id);
  return inv > 0 ? (_npsGain(id) / inv * 100) : 0;
}
function _npsColor() { return '#0EA5E9'; }
function _npsGrowthChart(n, period) {
  var inv = _npsTotalInvested(n.id) || n.invested || 0;
  var cur = _npsCurrentValue(n.id) || n.current || inv;
  var startDate = new Date(n.invested_on||'2023-04-01');
  var now = new Date();
  var totalDays = Math.max(1, (now - startDate) / 86400000);
  var maxDays = period==='1M'?30:period==='3M'?90:period==='6M'?180:period==='1Y'?365:totalDays;
  maxDays = Math.min(maxDays, totalDays);
  var pts = 25;
  var points = [];
  for (var i=0;i<pts;i++) {
    var d=(i/(pts-1))*maxDays;
    var pct=d/totalDays;
    points.push(Math.round(inv+(cur-inv)*pct));
  }
  var min=inv*0.97,max=cur*1.03;
  var w=320,h=90;
  var coords=points.map(function(v,i){
    var x=(i/(pts-1))*w;
    var y=h-((v-min)/(max-min+0.01))*(h-12)-6;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var d2='M'+coords[0];
  for(var j=0;j<coords.length-1;j++){
    var cp=coords[j].split(','),np=coords[j+1].split(',');
    var mx=((+cp[0]+(+np[0]))/2).toFixed(1);
    var my=((+cp[1]+(+np[1]))/2).toFixed(1);
    d2+=' Q'+cp[0]+','+cp[1]+' '+mx+','+my;
  }
  d2+=' L'+coords[coords.length-1];
  var area=d2+' L'+w+','+h+' L0,'+h+' Z';
  var gl=[0.25,0.5,0.75].map(function(f){var y=(h*f+6).toFixed(1);return '<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>';}).join('');
  var lx=coords[coords.length-1].split(',')[0],ly=coords[coords.length-1].split(',')[1];
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'
    +'<defs><linearGradient id="npsg'+period+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.4"/><stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.03"/></linearGradient></defs>'
    +gl
    +'<path d="'+area+'" fill="url(#npsg'+period+')"/>'
    +'<path d="'+d2+'" fill="none" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+lx+'" cy="'+ly+'" r="4" fill="#0EA5E9" stroke="#0f0f1a" stroke-width="2"/>'
    +'</svg>';
}

/* ─── BONDS MODULE ──────────────────────────────────── */
function _bondsAll() { return INV_PORTFOLIO.bonds || []; }
function _bondsFunds(filter) {
  var bonds = _bondsAll();
  if (filter === 'active')   return bonds.filter(function(b){ return b.status === 'active'; });
  if (filter === 'matured')  return bonds.filter(function(b){ return b.status === 'matured'; });
  if (filter === 'sold')     return bonds.filter(function(b){ return b.status === 'sold'; });
  return bonds;
}
function _bondFund(id) { return _bondsAll().find(function(b){ return b.id === id; }) || {}; }
function _bondPurchases(id) { return (INV_TRANSACTIONS[id] && INV_TRANSACTIONS[id].purchases) || []; }
function _bondSells(id) { return (INV_TRANSACTIONS[id] && INV_TRANSACTIONS[id].sells) || []; }
function _bondTotalQty(id) {
  var bought = _bondPurchases(id).reduce(function(s,t){ return s + (t.qty||0); }, 0);
  var sold   = _bondSells(id).reduce(function(s,t){ return s + (t.qty||0); }, 0);
  return bought - sold;
}
function _bondTotalInvested(id) {
  return _bondPurchases(id).reduce(function(s,t){ return s + (t.total_amount||0); }, 0);
}
function _bondAvgPrice(id) {
  var qty = _bondPurchases(id).reduce(function(s,t){ return s + (t.qty||0); }, 0);
  var amt = _bondTotalInvested(id);
  return qty > 0 ? (amt/qty) : 0;
}
function _bondCurrentValue(id) {
  var b = _bondFund(id);
  var qty = _bondTotalQty(id);
  return qty * (b.current_price || b.purchase_price || 0);
}
function _bondGainAmt(id) { return _bondCurrentValue(id) - _bondTotalInvested(id); }
function _bondGainPct(id) {
  var inv = _bondTotalInvested(id);
  return inv > 0 ? (_bondGainAmt(id) / inv * 100) : 0;
}
function _bondColor(id) {
  var map = { b1:'#F97316', b2:'#7C3AED' };
  return map[id] || '#F97316';
}
function _bondInitials(name) {
  return (name||'B').split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
}
function _bondDaysRemaining(maturityDate) {
  var mat = new Date(maturityDate), now = new Date();
  return Math.max(0, Math.ceil((mat - now) / (1000*86400)));
}
function _bondYearsMonthsLeft(maturityDate) {
  var mat = new Date(maturityDate), now = new Date();
  var totalMonths = Math.max(0, (mat.getFullYear()-now.getFullYear())*12 + (mat.getMonth()-now.getMonth()));
  var years = Math.floor(totalMonths/12);
  var months = totalMonths % 12;
  return years + 'Y ' + months + 'M';
}
function _bondCalcYTM(couponRate, faceValue, currentPrice, investedOn, maturityDate) {
  var now = new Date();
  var mat = new Date(maturityDate);
  var years = Math.max(0.01, (mat - now) / (1000*86400*365));
  var coupon = couponRate/100 * faceValue;
  var ytm = (coupon + (faceValue - currentPrice) / years) / ((faceValue + currentPrice) / 2);
  return Math.max(0, ytm * 100);
}
function _bondGrowthChart(b, period) {
  var inv = _bondTotalInvested(b.id) || b.invested || 0;
  var cur = _bondCurrentValue(b.id) || b.current || inv;
  var startDate = new Date(b.invested_on);
  var endDate   = new Date(b.maturity_date);
  var totalDays = Math.max(1, (endDate - startDate) / 86400000);
  var maxDays = period === '1M' ? 30 : period === '3M' ? 90 : period === '6M' ? 180 : period === '1Y' ? 365 : totalDays;
  maxDays = Math.min(maxDays, totalDays);
  var pts = 25;
  var points = [];
  for (var i = 0; i < pts; i++) {
    var d = (i / (pts-1)) * maxDays;
    var pct = d / totalDays;
    points.push(Math.round(inv + (cur - inv) * pct * 1.2));
  }
  var min = inv * 0.99, max = Math.max.apply(null, points) * 1.01;
  var w = 320, h = 90;
  var coords = points.map(function(v, i) {
    var x = (i / (pts-1)) * w;
    var y = h - ((v-min)/(max-min+0.01)) * (h-12) - 6;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var d2 = 'M'+coords[0];
  for (var j=0; j<coords.length-1; j++) {
    var cp = coords[j].split(','), np = coords[j+1].split(',');
    var mx = ((+cp[0]+(+np[0]))/2).toFixed(1);
    var my = ((+cp[1]+(+np[1]))/2).toFixed(1);
    d2 += ' Q'+cp[0]+','+cp[1]+' '+mx+','+my;
  }
  d2 += ' L'+coords[coords.length-1];
  var area = d2+' L'+w+','+h+' L0,'+h+' Z';
  var gl = [0.25,0.5,0.75].map(function(f){ var y=(h*f+6).toFixed(1); return '<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>'; }).join('');
  var lx = coords[coords.length-1].split(',')[0], ly = coords[coords.length-1].split(',')[1];
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'
    +'<defs><linearGradient id="bdg'+period+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F97316" stop-opacity="0.4"/><stop offset="100%" stop-color="#F97316" stop-opacity="0.03"/></linearGradient></defs>'
    +gl
    +'<path d="'+area+'" fill="url(#bdg'+period+')"/>'
    +'<path d="'+d2+'" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+lx+'" cy="'+ly+'" r="4" fill="#F97316" stroke="#0f0f1a" stroke-width="2"/>'
    +'</svg>';
}

function renderBondDetail() {
  var id  = (State.params && State.params.id) || 'b1';
  var b   = _bondFund(id);
  if (!b.id) return '<div class="screen-wrap"><div style="padding:40px;text-align:center;color:var(--text-dim)">Bond not found</div></div>';
  var tab      = State.bondDetailTab || 'overview';
  var color    = _bondColor(id);
  var initials = _bondInitials(b.name);
  var isActive = b.status === 'active';
  var inv      = _bondTotalInvested(id) || b.invested || 0;
  var cur      = _bondCurrentValue(id)  || b.current  || 0;
  var gain     = cur - inv;
  var gainPct  = inv > 0 ? (gain/inv*100) : 0;
  var gainColor= gain >= 0 ? '#22C55E' : '#FF4D6A';
  var ytm      = _bondCalcYTM(b.coupon_rate, b.face_value, b.current_price, b.invested_on, b.maturity_date);
  var daysLeft = _bondDaysRemaining(b.maturity_date);
  var ymleft   = _bondYearsMonthsLeft(b.maturity_date);
  var period   = State.bondChartPeriod || '1Y';
  var statusBg = isActive ? '#16A34A22' : '#FBBF2422';
  var statusColor = isActive ? '#22C55E' : '#FBBF24';

  var tabs = ['overview','transactions','notes'].map(function(t){
    return '<div style="flex:1;text-align:center;padding:10px 0;font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid '+(tab===t?color:'transparent')+';color:'+(tab===t?color:'var(--text-dim)')+'" onclick="State.bondDetailTab=\''+t+'\';App.render()">'+t.charAt(0).toUpperCase()+t.slice(1)+'</div>';

    +'<div class="form-header-title">'+b.name+'</div>'
    +'<div style="width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-dim)"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div>'
    +'</div>';

  var body = '';

    var identCard = '<div style="margin:0 16px 14px;background:var(--card);border-radius:var(--radius);padding:18px">'

      +'<div style="width:52px;height:52px;border-radius:14px;background:'+color+'22;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:'+color+'">'+initials+'</div>'
      +'<div style="flex:1">'
      +'<div style="font-size:16px;font-weight:800;color:var(--text)">'+b.name+'</div>'
      +'<div style="font-size:12px;color:var(--text-dim);margin-top:2px">'+b.type+(b.sub_type?' · '+b.sub_type:'')+'</div>'
      +'</div>'
      +'<div style="background:'+statusBg+';color:'+statusColor+';font-size:12px;font-weight:700;padding:4px 12px;border-radius:12px">'+b.status.charAt(0).toUpperCase()+b.status.slice(1)+'</div>'
      +'</div>'
      +'<div style="display:flex;justify-content:space-between;padding:14px 0;border-top:1px solid rgba(255,255,255,.07);margin-bottom:14px">'
      +'<div><div style="font-size:11px;color:var(--text-dim)">Invested</div><div style="font-size:24px;font-weight:800;color:var(--text)">'+formatINR(inv)+'</div></div>'
      +'<div style="text-align:right"><div style="font-size:11px;color:var(--text-dim)">Coupon Rate</div><div style="font-size:24px;font-weight:800;color:'+color+'">'+b.coupon_rate+'%</div></div>'
      +'</div>'
      +[
        ['Invested On',       _invFmtDate(b.invested_on)],
        ['Maturity Date',     _invFmtDate(b.maturity_date)+(isActive?' <span style="font-size:10px;color:'+color+';font-weight:700">('+ymleft+' to maturity)</span>':'')],
        ['Bond Type',         b.type],
        ['Face Value',        formatINR(b.face_value)+' per unit'],
        ['Qty / Units',       '<span style="font-weight:700;color:var(--text)">'+b.qty+'</span>'],
        ['Purchase Price',    formatINR(b.purchase_price)+' per unit'],
        ['Coupon Rate',       '<span style="color:'+color+';font-weight:700">'+b.coupon_rate+'% p.a.</span>'],
        ['YTM (Approx)',      '<span style="color:#38BDF8;font-weight:700">'+ytm.toFixed(2)+'%</span>'],
        ['Credit Rating',     '<span style="background:#F97316;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px">'+b.credit_rating+'</span>'],
        ['ISIN',              '<span style="color:var(--text-dim);font-size:12px">'+b.isin+'</span>'],
        ['Current Value',     '<span style="color:var(--text);font-weight:700">'+formatINR(Math.round(cur))+'</span>'],
        ['Gain / Loss',       '<span style="color:'+gainColor+';font-weight:700">'+(gain>=0?'+':'')+formatINR(Math.round(gain))+' ('+(gainPct>=0?'+':'')+gainPct.toFixed(2)+'%)</span>'],
      ].map(function(row){
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.05)">'

    var periodBtns = ['1M','3M','6M','1Y','ALL'].map(function(p){

    }).join('');
    var chartCard = '<div style="margin:0 16px 14px;background:var(--card);border-radius:var(--radius);padding:16px">'

      +'<div style="display:flex;gap:4px">'+periodBtns+'</div>'

      +'<div style="display:flex;justify-content:space-between;margin-top:8px">'
      +'<div style="font-size:11px;color:var(--text-dim)">'+_invFmtDate(b.invested_on)+'</div>'
      +'<div style="font-size:11px;color:var(--text-dim)">'+_invFmtDate(b.maturity_date)+'</div>'

    var actionBtns = '<div style="margin:0 16px 20px;display:flex;gap:10px">'
      +'<button onclick="State.params={id:\''+id+'\'};App.navigate(\'add-bond-investment\')" style="flex:1;padding:13px;border-radius:var(--radius-sm);background:#22C55E;color:#000;font-weight:700;font-size:14px;border:none;cursor:pointer">+ Add Investment</button>'
      +(isActive?'<button onclick="App._bondSellConfirm(\''+id+'\')" style="flex:1;padding:13px;border-radius:var(--radius-sm);background:#F97316;color:#fff;font-weight:700;font-size:14px;border:none;cursor:pointer">Sell Bond</button>':'')
      +'</div>';

    body = identCard + chartCard + actionBtns;

  } else if (tab === 'transactions') {
    var purchases = _bondPurchases(id);
    var sells     = _bondSells(id);
    var allTx = purchases.map(function(t){ return Object.assign({},t,{tx_type:'purchase'}); })
      .concat(sells.map(function(t){ return Object.assign({},t,{tx_type:'sell'}); }));
    allTx.sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
    var latestId = allTx.length > 0 ? allTx[0].id : null;

    var txRows = allTx.map(function(t){
      var isLatest = t.id === latestId;
      var isPurchase = t.tx_type === 'purchase';
      var amtColor = isPurchase ? '#F97316' : '#22C55E';
      return '<div style="padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)">'
        +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">'
        +'<div style="font-size:13px;font-weight:700;color:var(--text)">'+_invFmtDate(t.date)+'</div>'
        +'<div style="display:flex;align-items:center;gap:6px">'
        +(isLatest?'<span style="font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:'+color+'22;color:'+color+'">Latest</span>':'')
        +'<span style="font-size:13px;font-weight:700;color:'+amtColor+'">'+(isPurchase?'Purchased':'Sold')+'</span>'
        +'</div>'
        +'</div>'
        +'<div style="font-size:12px;color:var(--text-dim)">Qty: <b style="color:var(--text)">'+t.qty+'</b> · Price: <b style="color:var(--text)">'+formatINR(t.purchase_price||t.sell_price||0)+'</b> · Coupon: <b style="color:'+color+'">'+t.coupon_rate+'%</b></div>'
        +'<div style="font-size:12px;color:var(--text-dim);margin-top:2px">Total: <b style="color:var(--text)">'+formatINR(t.total_amount||0)+'</b>'+(t.ref_id?' · Ref: '+t.ref_id:'')+'</div>'
        +'</div>';
    }).join('');

    var avgPrice = _bondAvgPrice(id);
    var summary = '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 0;border-top:1px solid rgba(255,255,255,.08);margin-top:4px">'
      +'<div><div style="font-size:11px;color:var(--text-dim)">Total Invested</div><div style="font-size:14px;font-weight:700;color:var(--text)">'+formatINR(inv)+'</div></div>'
      +'<div style="text-align:center"><div style="font-size:11px;color:var(--text-dim)">Avg. Purchase Price</div><div style="font-size:14px;font-weight:700;color:var(--text)">'+formatINR(Math.round(avgPrice))+'</div></div>'
      +'<div style="text-align:right"><div style="font-size:11px;color:var(--text-dim)">Current Value</div><div style="font-size:14px;font-weight:700;color:'+(gain>=0?'#22C55E':'#FF4D6A')+'">'+formatINR(Math.round(cur))+' ('+(gainPct>=0?'+':'')+gainPct.toFixed(2)+'%)</div></div>'
      +'</div>';

    body = '<div style="margin:0 16px 12px;background:var(--card);border-radius:var(--radius);padding:16px">'
      +'<div style="font-size:13px;font-weight:700;color:'+color+';margin-bottom:8px">Bond Transactions</div>'
      +(txRows||'<div style="padding:20px 0;text-align:center;color:var(--text-dim)">No transactions yet</div>')
      + summary
      +'</div>'
      +'<div style="margin:0 16px 20px">'
      +'<button onclick="State.params={id:\''+id+'\'};App.navigate(\'add-bond-investment\')" style="width:100%;padding:13px;border-radius:var(--radius-sm);background:rgba(249,115,22,.15);color:#F97316;border:1px solid rgba(249,115,22,.3);font-weight:700;font-size:14px;cursor:pointer">+ Add Investment</button>'
      +'</div>';

  } else {
    // Notes tab
    var notes = INV_NOTES[id] || [];
    var nf = State.bondNoteFilter || 'all';
    var nfBtns = ['all','research','ideas','updates','private'].map(function(t){
      return '<div style="padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;'+(nf===t?'background:'+color+';color:#fff;':'color:var(--text-dim);background:rgba(255,255,255,.07);')+'" onclick="State.bondNoteFilter=\''+t+'\';App.render()">'+t.charAt(0).toUpperCase()+t.slice(1)+'</div>';
    }).join('');
    var typeColors = { research:'#38BDF8', ideas:'#A78BFA', updates:'#34D399', private:'#FB923C' };
    var visNotes = nf==='all' ? notes : notes.filter(function(n){ return n.type===nf; });
    var ncards = visNotes.map(function(n){
      var tc = typeColors[n.type]||'#9CA3AF';
      return '<div style="background:rgba(255,255,255,.04);border-radius:10px;padding:12px;margin-bottom:10px;border-left:3px solid '+tc+'">'
        +'<div style="display:flex;justify-content:space-between">'
        +'<div style="flex:1">'
        +'<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;background:'+tc+'22;color:'+tc+'">'+n.type.charAt(0).toUpperCase()+n.type.slice(1)+'</span>'
        +'<div style="font-size:13px;font-weight:700;color:var(--text);margin-top:4px">'+escapeHtml(n.title)+'</div>'
        +'<div style="font-size:11px;color:var(--text-dim);margin-top:2px">'+n.date+'</div>'
        +'<div style="font-size:13px;color:var(--text-dim);margin-top:6px;line-height:1.5">'+escapeHtml(n.text)+'</div>'
        +'</div>'
        +'<div style="display:flex;gap:8px;margin-left:10px">'
        +'<div onclick="App._bondEditNote(\''+id+'\',\''+n.id+'\')" style="cursor:pointer;color:var(--text-dim)"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.21c.39-.39.39-1.02 0-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></div>'
        +'<div onclick="App._bondDeleteNote(\''+id+'\',\''+n.id+'\')" style="cursor:pointer;color:#EF4444"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19c0 1.1.9 2 2 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></div>'
        +'</div></div></div>';
    }).join('');

    body = '<div style="margin:0 16px 14px">'
      +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
      +'<div style="font-size:15px;font-weight:700;color:var(--text)">Notes ('+notes.length+')</div>'
      +'<button onclick="App._bondAddNote(\''+id+'\')" style="padding:8px 14px;border-radius:10px;background:'+color+';color:#fff;font-size:13px;font-weight:700;border:none;cursor:pointer">+ Add Note</button>'
      +'</div>'
      +'<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none">'+nfBtns+'</div>'
      +(ncards||'<div style="padding:30px;text-align:center;color:var(--text-dim)">No notes yet</div>')
      +'</div>';
  }

  return '<div class="screen-wrap" style="padding-bottom:32px">'
    + header
    +'<div style="display:flex;margin:0 16px 14px;background:var(--card);border-radius:var(--radius)">'+tabs+'</div>'
    + body
    +'</div>';

function renderAddBond() {

    + fr('Purchase Price (per unit)', '<input type="number" id="bond-price" placeholder="e.g. 960" style="'+ins+'" oninput="App._bondRecalcForm()">')

    +'</div>'
    +'</div>';

/* ─── CORPORATE DEPOSIT MODULE ──────────────────────── */
function _cdAll() { return INV_PORTFOLIO.corporate_deposits || []; }
function _cdFunds(filter) {
  var cds = _cdAll();
  if (filter === 'active')  return cds.filter(function(c){ return c.status === 'active'; });
  if (filter === 'matured') return cds.filter(function(c){ return c.status === 'matured'; });
  if (filter === 'closed')  return cds.filter(function(c){ return c.status === 'closed'; });
  return cds;
}
function _cdFund(id) { return _cdAll().find(function(c){ return c.id === id; }) || {}; }
function _cdCalcMaturity(principal, rate, tenureMonths, type) {
  var years = tenureMonths / 12;
  if (type === 'Non-Cumulative') return principal + principal * (rate/100) * years;
  return principal * Math.pow(1 + (rate/100)/4, 4*years);
}
function _cdCalcAccruedInterest(principal, rate, investedOn, type) {
  var start = new Date(investedOn);
  var now   = new Date();
  var days  = Math.max(0, (now - start) / (1000 * 86400));
  var years = days / 365;
  if (type === 'Non-Cumulative') return principal * (rate/100) * years;
  return principal * Math.pow(1 + (rate/100)/4, 4*years) - principal;
}
function _cdDaysRemaining(maturityDate) {
  var mat = new Date(maturityDate);
  var now = new Date();
  return Math.max(0, Math.ceil((mat - now) / (1000 * 86400)));
}
function _cdCompanyColor(id) {
  var map = { cd1:'#7C3AED', cd2:'#0EA5E9', cd3:'#F97316' };
  return map[id] || '#A855F7';
}
function _cdCompanyInitials(company) {
  return (company||'CD').split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
}
function _cdGrowthChart(f, period) {
  var months = f.tenure_months || 36;
  var chartMonths = period === '1M' ? 1 : period === '3M' ? 3 : period === '6M' ? 6 : period === '1Y' ? 12 : months;
  chartMonths = Math.min(chartMonths, months);
  var pts = Math.min(chartMonths + 1, 25);
  var points = [];
  for (var i = 0; i < pts; i++) {
    var t = (i / (pts-1)) * (chartMonths/12);
    var v = f.invested * Math.pow(1 + (f.interest_rate/100)/4, 4*t);
    points.push(v);
  }
  var min = points[0], max = points[points.length-1];
  var w = 320, h = 100;
  var coords = points.map(function(v, i) {
    var x = (i / (pts-1)) * w;
    var y = h - ((v-min) / (max-min+0.01)) * (h-14) - 7;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var d = 'M'+coords[0];
  for (var j=0;j<coords.length-1;j++) {
    var cx = coords[j], nx = coords[j+1];
    var cxp = cx.split(','), nxp = nx.split(',');
    var mx = ((parseFloat(cxp[0])+parseFloat(nxp[0]))/2).toFixed(1);
    var my1 = cxp[1], my2 = nxp[1];
    d += ' Q'+cxp[0]+','+my1+' '+mx+','+((parseFloat(my1)+parseFloat(my2))/2).toFixed(1);
  }
  d += ' L'+coords[coords.length-1];
  var area = d + ' L'+w+','+h+' L0,'+h+' Z';
  var gridLines = [0.25,0.5,0.75].map(function(f){ var y=(h*f).toFixed(1); return '<line x1="0" y1="'+y+'" x2="'+w+'" y2="'+y+'" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>'; }).join('');
  var lastX = coords[coords.length-1].split(',')[0], lastY = coords[coords.length-1].split(',')[1];
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'
    +'<defs><linearGradient id="cdg'+period+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#A855F7" stop-opacity="0.4"/><stop offset="100%" stop-color="#A855F7" stop-opacity="0.03"/></linearGradient></defs>'
    +gridLines
    +'<path d="'+area+'" fill="url(#cdg'+period+')"/>'
    +'<path d="'+d+'" fill="none" stroke="#A855F7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +'<circle cx="'+lastX+'" cy="'+lastY+'" r="4" fill="#A855F7" stroke="#0f0f1a" stroke-width="2"/>'
    +'</svg>';
}

/* ─── FIXED DEPOSIT MODULE ───────────────────────────── */
function _fdFunds(filter) {
  var fds = (INV_PORTFOLIO.fds || []);
  if (filter === 'active')  return fds.filter(function(f){ return f.status === 'active'; });
  if (filter === 'matured') return fds.filter(function(f){ return f.status === 'matured'; });
  if (filter === 'closed')  return fds.filter(function(f){ return f.status === 'closed'; });
  return fds;
}
function _fdFund(id) { return (INV_PORTFOLIO.fds||[]).find(function(f){ return f.id===id; }) || {}; }
function _fdCalcMaturity(principal, rate, tenureMonths, type) {
  var years = tenureMonths / 12;
  if (type === 'Non-Cumulative') return principal + principal * (rate/100) * years;
  return principal * Math.pow(1 + (rate/100)/4, 4*years);
}
function _fdCalcInterest(principal, rate, tenureMonths, type) {
  return _fdCalcMaturity(principal, rate, tenureMonths, type) - principal;
}
function _fdBankColor(id) {
  var map = { f1:'#0052CC', f2:'#22409A', f3:'#F77F00', f4:'#800020' };
  return map[id] || '#F97316';
}
function _fdBankInitials(bank) {
  return (bank||'FD').split(' ').map(function(w){ return w[0]; }).join('').slice(0,2).toUpperCase();
}
function _fdGrowthChart(f) {
  var months = f.tenure_months || 12;
  var points = [];
  for (var m = 0; m <= months; m++) {
    var val = _fdCalcMaturity(f.invested, f.interest_rate, m, f.interest_type);
    points.push(val);
  }
  var min = points[0], max = points[points.length-1];
  var w = 280, h = 80;
  var coords = points.map(function(v, i) {
    var x = (i / (points.length-1)) * w;
    var y = h - ((v-min)/(max-min+1)) * (h-10) - 5;
    return x.toFixed(1)+','+y.toFixed(1);
  });
  var path = 'M'+coords.join(' L');
  var fill = 'M'+coords[0]+' '+coords.map(function(c){ return 'L'+c; }).join(' ')+' L'+w+','+h+' L0,'+h+' Z';
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="none">'
    +'<defs><linearGradient id="fdg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F97316" stop-opacity="0.35"/><stop offset="100%" stop-color="#F97316" stop-opacity="0.03"/></linearGradient></defs>'
    +'<path d="'+fill+'" fill="url(#fdg)"/>'
    +'<path d="'+path+'" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    +'</svg>';
}

function renderFDList() {

  var allFds = _fdFunds('all');

        return '<div style="background:var(--card);border-radius:var(--radius);margin:0 16px 12px;padding:16px;cursor:pointer;border:1px solid rgba(255,255,255,0.06)" onclick="State.params={id:\''+f.id+'\'};State.fdDetailTab=\'overview\';App.navigate(\'fd-detail\')">'

function renderFDAddTransaction() {

  var payoutOpts = ['On Maturity','Monthly','Quarterly','Annually'].map(function(p){
    return '<option value="'+p+'">'+p+'</option>';

  var renewalOpts = ['<option value="no">No (Close on maturity)</option>','<option value="yes">Yes (Auto-renew at prevailing rate)</option>'].join('');

  var formBody = '';
  if (mode === 'investment') {
    formBody = secHdr('FD Details')

      + fr('Payout', '<select id="fd-payout" style="'+selStyle+'">'+payoutOpts+'</select>')

      + secHdr('Reference')
      + fr('Reference / FD Certificate No.', '<input type="text" id="fd-ref" placeholder="e.g. HDFC-FD-2024-001" style="'+ins+'">')

function getAccountGroups(accounts) {
  const groups = {};
  accounts.forEach(a => {
    let key = a.account_type;
    if (key === 'wallet') key = 'cash';
    if (!groups[key]) groups[key] = { total: 0, count: 0, accounts: [] };
    groups[key].total += a.balance;
    groups[key].count += 1;
    groups[key].accounts.push(a);
  });
  return groups;
}

function renderWealth() {
  var accts   = State.data.accounts || DEMO.accounts;
  var visible = accts.filter(function(a){ return a.visible !== false; });

  // — Accounts —
  var bankAccts = visible.filter(function(a){ return a.account_type==='bank'; });
  var cashAccts = visible.filter(function(a){ return a.account_type==='cash'||a.account_type==='wallet'; });
  var upiAccts  = visible.filter(function(a){ return a.account_type==='upi'; });
  var bankTotal = bankAccts.reduce(function(s,a){ return s+a.balance; },0);
  var cashTotal = cashAccts.reduce(function(s,a){ return s+a.balance; },0);
  var upiTotal  = upiAccts.reduce(function(s,a){ return s+a.balance; },0);

  // — Investments —
  var invs       = State.data.investments || DEMO.investments || [];
  var invTotal   = invs.reduce(function(s,i){ return s+(i.current||0); },0);
  var invInvested= invs.reduce(function(s,i){ return s+(i.invested||0); },0);
  var invGain    = invTotal - invInvested;

  // — Property / Rentals —
  var rentals    = DEMO.rentals || [];
  var rentalVal  = rentals.reduce(function(s,r){ return s+(r.market_value||0); },0);
  var rentalInc  = rentals.reduce(function(s,r){ return s+(r.monthly_rent||0); },0);

  // — Other Assets —
  var otherAssets = DEMO.otherAssets || [];
  var otherTotal  = otherAssets.reduce(function(s,x){ return s+(x.value||0); },0);

  // — Liabilities —
  var loans       = DEMO.loans || [];
  var loanTotal   = loans.reduce(function(s,l){ return s+(l.outstanding||0); },0);
  var cards       = DEMO.creditCards || [];
  var ccTotal     = cards.reduce(function(s,c){ return s+c.outstanding; },0);
  var lendBorrow  = DEMO.lendBorrow || [];
  var borrowedAmt = lendBorrow.filter(function(x){ return x.type==='borrowed'; }).reduce(function(s,x){ return s+(x.remaining||x.amount||0); },0);
  var lentAmt     = lendBorrow.filter(function(x){ return x.type==='lent'&&x.status!=='settled'; }).reduce(function(s,x){ return s+(x.remaining||x.amount||0); },0);

  // — Net Worth —
  var totalAssets = bankTotal + cashTotal + invTotal + rentalVal + otherTotal + lentAmt;
  var totalLiab   = loanTotal + ccTotal + borrowedAmt;
  var netWorth    = totalAssets - totalLiab;
  var _dash       = State.data.dashboard || DEMO.dashboard;
  var growthPct   = _dash.net_worth_delta_pct ?? 3.8;
  var growing     = growthPct >= 0;

  // — Health Score —
  var savingsRate   = _dash.monthly_income > 0 ? (_dash.monthly_income - _dash.monthly_expenses) / _dash.monthly_income * 100 : 0;
  var debtRatio     = totalAssets > 0 ? totalLiab / totalAssets * 100 : 100;
  var invAlloc      = totalAssets > 0 ? invTotal / totalAssets * 100 : 0;
  var healthScore   = Math.min(100, Math.round(
    Math.min(savingsRate, 50) / 50 * 35 +
    Math.max(0, 100 - debtRatio) / 100 * 40 +
    Math.min(invAlloc, 25) / 25 * 25
  ));
  var healthLabel   = healthScore >= 80 ? 'Excellent 🟢' : healthScore >= 60 ? 'Good 🟡' : healthScore >= 40 ? 'Fair 🟠' : 'Needs Attention 🔴';
  var healthColor   = healthScore >= 80 ? '#22C55E' : healthScore >= 60 ? '#60A5FA' : healthScore >= 40 ? '#F59E0B' : '#EF4444';

  // — Inline SVG sparkline (net worth trend 6 months) —
  var sparkPoints = [52,48,56,50,60,58,65];
  var svgPath = sparkPoints.map(function(v,i){ return (i===0?'M':'L')+(i*20)+','+(70-v); }).join(' ');
  var sparkline = '<svg width="120" height="40" viewBox="0 0 120 70" preserveAspectRatio="none">'
    +'<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="rgba(108,71,255,0.4)"/><stop offset="100%" stop-color="rgba(108,71,255,0)"/></linearGradient></defs>'

    +'</svg>';

  // — Donut chart for asset allocation —
  var donutSegments = [

      offset += dash;
      return svg;
    }).join('');

    +'<div class="ws-title">⚠️ LIABILITIES (What You Owe)</div>'
    +'<div class="ws-view-all" onclick="App.navigate(\'rebalance\')">Details →</div>'
    +'</div>'
    +'<div class="wealth-cat-grid">'+liabCards.map(function(c){
        return '<div class="wealth-cat-card" onclick="'+c.fn+'">'
          +'<div class="wealth-cat-icon">'+c.icon+'</div>'
          +'<div class="wealth-cat-name">'+c.name+'</div>'
          +'<div class="wealth-cat-val" style="color:#EF4444">'+formatINR(c.val)+'</div>'
          +'</div>';

  // Analytics — Asset Allocation donut + legend
  html += '<div class="ws-head" style="margin-top:4px"><div class="ws-title">📊 ASSET ALLOCATION</div></div>'

    +'<div style="flex:1">'
    +donutSegments.map(function(seg){
        var pct = Math.round(seg.value/donutTotal*100);
        return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
          +'<div style="display:flex;align-items:center;gap:6px">'
          +'<div style="width:10px;height:10px;border-radius:50%;background:'+seg.color+'"></div>'
          +'<span style="color:var(--text-dim);font-size:12px">'+seg.label+'</span>'
          +'</div>'
          +'<div style="text-align:right">'
          +'<div style="color:var(--text);font-size:13px;font-weight:700">'+pct+'%</div>'
          +'<div style="color:var(--text-dim);font-size:11px">'+formatINR(seg.value)+'</div>'
          +'</div>'
          +'</div>';
      }).join('')
    +'</div>'
    +'</div>'
    +'</div>';

  // Financial Health Score
  html += '<div class="ws-head"><div class="ws-title">❤️ FINANCIAL HEALTH</div></div>'
    +'<div style="margin:0 20px 20px;background:var(--card);border-radius:var(--radius);padding:16px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    +'<div><div style="color:var(--text);font-size:22px;font-weight:800">'+healthScore+'<span style="font-size:14px;color:var(--text-dim)">/100</span></div>'
    +'<div style="color:'+healthColor+';font-size:13px;font-weight:700;margin-top:2px">'+healthLabel+'</div></div>'
    +'<div style="width:70px;height:70px;border-radius:50%;background:conic-gradient('+healthColor+' '+healthScore+'%, rgba(255,255,255,0.08) 0%);display:flex;align-items:center;justify-content:center">'
    +'<div style="width:54px;height:54px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:'+healthColor+';font-size:16px;font-weight:800">'+healthScore+'</div>'
    +'</div>'
    +'</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px">'
    +[
      {label:'Savings Rate', val: Math.min(savingsRate,50)/50, pct: savingsRate.toFixed(1)+'%', color:'#22C55E'},
      {label:'Debt Ratio',   val: Math.max(0,100-debtRatio)/100, pct: debtRatio.toFixed(1)+'%', color:'#60A5FA'},
      {label:'Inv. Allocation', val: Math.min(invAlloc,25)/25, pct: invAlloc.toFixed(1)+'%', color:'#F59E0B'},
    ].map(function(r){
      return '<div><div style="display:flex;justify-content:space-between;margin-bottom:4px">'
        +'<span style="color:var(--text-dim);font-size:12px">'+r.label+'</span>'
        +'<span style="color:var(--text);font-size:12px;font-weight:600">'+r.pct+'</span></div>'
        +'<div class="health-bar-bg"><div class="health-bar-fill" style="width:'+Math.round(r.val*100)+'%;background:'+r.color+'"></div></div>'
        +'</div>';
    }).join('')
    +'</div>'
    +'</div>';

  // AI Smart Insights
  html += '<div class="ws-head"><div class="ws-title">🤖 SMART INSIGHTS</div></div>'
    +'<div style="margin:0 20px 20px;background:var(--primary-dim);border-radius:var(--radius);padding:16px;border:1px solid rgba(108,71,255,0.3)">'
    +insights.map(function(ins){
        return '<div class="wealth-insight">'
          +'<div class="wealth-insight-dot" style="background:'+ins.dot+'"></div>'
          +'<div class="wealth-insight-text">'+ins.text+'</div>'
          +'</div>';
      }).join('')
    +'</div>';

  // Loans detail rows
  if (loans.length > 0) {
    html += '<div class="ws-head"><div class="ws-title">💳 ACTIVE LOANS</div></div>'
      +'<div class="acct-group-list" style="margin:0 20px 20px">'
      +loans.map(function(l){
          var paid = Math.round(l.paid_months/l.tenure_months*100);
          return '<div class="acct-group-row" onclick="App.navigate(\'loans-emi\')">'
            +'<div class="acct-group-icon" style="background:rgba(239,68,68,0.15)"><svg width="22" height="22" viewBox="0 0 24 24" fill="#EF4444"><path d="M11.5 1L2 6v2h19V6L11.5 1zM3 22h18v-2H3v2zm0-4h18v-8H3v8z"/></svg></div>'
            +'<div class="acct-group-info">'
            +'<div class="acct-group-name">'+escapeHtml(l.name)+'</div>'
            +'<div class="acct-group-sub">'+escapeHtml(l.lender)+' · EMI '+formatINR(l.emi)+'/mo · '+paid+'% paid</div>'
            +'</div>'
            +'<div><div class="acct-group-bal" style="color:#EF4444">'+formatINR(l.outstanding)+'</div>'
            +'<div style="color:var(--text-dim);font-size:11px;text-align:right">'+l.interest_rate+'% p.a.</div></div>'
            +'<svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text-dim)" style="margin-left:6px;flex-shrink:0"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>'
            +'</div>';
        }).join('')
      +'</div>';
  }

  // Account groups quick nav
  html += '<div class="ws-head"><div class="ws-title">⚡ QUICK ACTIONS</div></div>'
    +'<div class="adv-grid" style="margin-bottom:20px">'
    +[
      {icon:'➕',label:'Add Account',  fn:"App.navigate('add-account')"},
      {icon:'📊',label:'Transactions', fn:"App.goTab('transactions')"},
      {icon:'📅',label:'Reminders',   fn:"App.navigate('reminders')"},
      {icon:'📤',label:'Export Data', fn:"App.exportAllAccounts()"},
    ].map(function(f){
      return '<div class="adv-card" onclick="'+f.fn+'">'
        +'<div class="adv-card-icon" style="background:rgba(108,71,255,0.2);font-size:18px">'+f.icon+'</div>'
        +'<div class="adv-card-label">'+f.label+'</div>'
        +'</div>';
    }).join('')
    +'</div>';

  // Security footer
  html += '<div style="margin:0 20px 0;padding:14px 16px;background:rgba(34,197,94,0.08);border-radius:var(--radius-sm);border:1px solid rgba(34,197,94,0.2);display:flex;gap:12px;align-items:center">'
    +'<svg width="22" height="22" viewBox="0 0 24 24" fill="#22C55E"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>'
    +'<div><div style="color:#22C55E;font-size:13px;font-weight:700">Bank-Grade Security</div>'
    +'<div style="color:var(--text-dim);font-size:12px;margin-top:2px">All financial data is encrypted end-to-end.</div>'
    +'</div>'
    +'</div>';

  html += '</div>';
  return html;
}
