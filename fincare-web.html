const App = {

  /* ── Router ─────────────────────────────────── */
  navigate(screen, params = {}) {
    State.screen = screen;
    State.params = params;
    this.render();
  },

  goTab(tab) {
    State.tab    = tab;
    State.screen = tab;
    State.params = {};
    State.addTxType = null;
    // Update tab bar highlight
    document.querySelectorAll('.tab-item').forEach(el => {
      el.classList.toggle('active', el.dataset.tab === tab);
    });
    this.render();
  },

  /* ── Auth ────────────────────────────────────── */
  async login() {
    const email = document.getElementById('login-email')?.value || '';
    const pass  = document.getElementById('login-pass')?.value  || '';
    if (!email || !pass) { this.showToast('Please fill in all fields'); return; }

    // Show loading
    document.getElementById('screen').innerHTML = '<div class="spinner"></div>';

    // Try real API
    const res = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass }),
    }).catch(() => null);

    if (res && res.ok) {
      const data = await res.json();
      State.token = data.token || data.access_token;
      State.user  = data.user || { name: email.split('@')[0] };
      localStorage.setItem('fc_token', State.token);
      localStorage.setItem('fc_user', JSON.stringify(State.user));
    } else {
      // Demo mode
      State.token = 'demo-token';
      State.user  = DEMO.user;
      localStorage.setItem('fc_token', 'demo-token');
      localStorage.setItem('fc_user', JSON.stringify(DEMO.user));
    }

    await loadDashboardData();
    document.getElementById('tab-bar').style.display = 'flex';
    this.goTab('dashboard');
  },

  logout() {
    State.token = null; State.user = null;
    localStorage.removeItem('fc_token');
    localStorage.removeItem('fc_user');
    document.getElementById('tab-bar').style.display = 'none';
    this.navigate('login');
  },

  /* ── Render ──────────────────────────────────── */
  render() {
    const scr = document.getElementById('screen');
    let html = '';
    switch (State.screen) {
      case 'login':            html = renderLogin();            break;
      case 'dashboard':        html = renderDashboard();        break;
      case 'transactions':     html = renderTransactions();     break;
      case 'add-transaction':  html = renderAddTransaction();   break;
      case 'wealth':           html = renderWealth();           break;
      case 'group-list':       html = renderGroupList();        break;
      case 'account-detail':   html = renderAccountDetail();    break;
      case 'add-account':      html = renderAddAccount();       break;
      case 'edit-account':     html = renderAddAccount();       break;
      default:
        html = `<div class="screen-wrap">
          <div class="page-header">
            <div><div class="page-title">${capitalize(State.screen.replace(/-/g,' '))}</div></div>
            <div class="icon-btn" onclick="App.goTab('${State.tab||'dashboard'}')">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
            </div>
          </div>
          <div style="text-align:center;padding:60px 20px">
            <div style="font-size:48px;margin-bottom:16px">🚧</div>
            <div style="color:var(--text);font-size:18px;font-weight:700;margin-bottom:8px">Coming Next</div>
            <div style="color:var(--text-dim);font-size:14px">This screen will be built in the next step.</div>
          </div>
        </div>`;
    }
    scr.innerHTML = html;
  },

  /* ── Account Actions ─────────────────────────── */
  openAccount(id) {
    State.viewAcctId     = id;
    State.acctTxTypeFilter = 'all';
    State.acctTxDateFilter = 'month';
    State.acctSort       = 'date';
    State.acctSearch     = '';
    State.showAcctFilter = false;
    this.navigate('account-detail', { id });
  },

  openGroupList(key) {
    this.navigate('group-list', { group: key });
  },

  openAcctMenu(id) {
    const a = (State.data.accounts || DEMO.accounts).find(x=>x.account_id===id);
    if (!a) return;
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">${a.name}</div>
        ${[
          { icon:'✏️', label:'Edit Account',        fn:`App.navigate('edit-account',{id:'${id}'});` },
          { icon:'🎨', label:'Change Color',         fn:`App.showToast('Select a new color in Edit Account');App.navigate('edit-account',{id:'${id}'});` },
          { icon:'📊', label:'Download Statement',   fn:`App.exportAccount('${id}','csv');` },
          { icon:'📄', label:'Download PDF',         fn:`App.exportAccount('${id}','pdf');` },
          { icon:'📑', label:'Download Excel',       fn:`App.exportAccount('${id}','xlsx');` },
          { icon:'👁️', label:a.visible!==false?'Hide Account':'Show Account', fn:`App.toggleVisibility('${id}');` },
          { icon:'🗑️', label:'Delete Account',       fn:`App.deleteAccount('${id}');`, danger:true },
        ].map(item => `
          <div class="list-row" style="${item.danger?'color:var(--danger)':''}" onclick="${item.fn}this.closest('.modal-overlay').remove()">
            <span style="font-size:20px;margin-right:4px">${item.icon}</span>
            <span style="${item.danger?'color:var(--danger)':'color:var(--text)'};font-size:15px;font-weight:600">${item.label}</span>
          </div>`).join('')}
        <button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
      </div>`;
    document.getElementById('phone-frame').appendChild(overlay);
  },

  toggleVisibility(id) {
    const accts = State.data.accounts || DEMO.accounts;
    const a = accts.find(x=>x.account_id===id);
    if (a) { a.visible = a.visible===false ? true : false; }
    this.showToast(a && a.visible===false ? 'Account hidden' : 'Account visible');
    this.render();
  },

  async saveAccount() {
    const name    = document.getElementById('af-name')?.value?.trim();
    const balance = parseFloat(document.getElementById('af-balance')?.value || '0');
    const type    = State.addAcctType || 'bank';
    const color   = State.acctColor  || '#6C47FF';
    const notes   = document.getElementById('af-notes')?.value?.trim() || '';

    if (!name) { this.showToast('Please enter an account name'); return; }

    const typeMeta = ACCT_TYPES.find(t=>t.key===type)||ACCT_TYPES[0];

    // Build payload
    const payload = {
      name, account_type: type, balance, color, notes,
      institution: document.getElementById('af-bank')?.value?.trim() || '',
      account_number: document.getElementById('af-accno')?.value?.trim() || '',
      ifsc: document.getElementById('af-ifsc')?.value?.trim() || '',
      holder: document.getElementById('af-holder')?.value?.trim() || ((State.user||DEMO.user).name),
      branch: document.getElementById('af-branch')?.value?.trim() || '',
      sub_type: document.getElementById('af-subtype')?.value || typeMeta.label,
      upi_id: document.getElementById('af-upi')?.value?.trim() || '',
      linked_app: document.getElementById('af-upiapp')?.value || '',
      credit_limit: parseFloat(document.getElementById('af-crlimit')?.value||'0') || 0,
      include_in_net_worth: type !== 'wallet' && type !== 'upi',
      visible: true,
      avg_inflow: 0, avg_outflow: 0, tx_count: 0,
    };

    const isEdit = State.screen === 'edit-account';
    const editId = State.params?.id;

    // Try real API
    let ok = false;
    if (isEdit) {
      const r = await fetch(API_BASE + '/accounts/' + editId, {
        method: 'PUT',
        headers: { 'Authorization':'Bearer '+State.token, 'Content-Type':'application/json' },
        body: JSON.stringify(payload),
      }).catch(()=>null);
      ok = r && r.ok;
    } else {
      const r = await fetch(API_BASE + '/accounts', {
        method: 'POST',
        headers: { 'Authorization':'Bearer '+State.token, 'Content-Type':'application/json' },
        body: JSON.stringify(payload),
      }).catch(()=>null);
      ok = r && r.ok;
    }

    // Optimistic local update
    const accts = State.data.accounts || DEMO.accounts;
    if (isEdit) {
      const idx = accts.findIndex(a=>a.account_id===editId);
      if (idx >= 0) Object.assign(accts[idx], payload);
    } else {
      const newAcct = { ...payload, account_id:'a'+Date.now() };
      accts.push(newAcct);
      DEMO.dashboard.total_balance += balance;
    }
    State.data.accounts = accts;

    State.addAcctType = 'bank';
    State.acctColor   = '#6C47FF';
    this.showToast(ok ? 'Account saved!' : `Account ${isEdit?'updated':'added'} (demo mode)`);
    this.goTab('wealth');
  },

  deleteAccount(id) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = e => { if (e.target===overlay) overlay.remove(); };
    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Delete Account?</div>
        <div style="color:var(--text-dim);font-size:14px;margin-bottom:20px">This will permanently remove the account and all linked data. This action cannot be undone.</div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-ghost" style="flex:1" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary" style="flex:2;background:var(--danger)" onclick="App._doDelete('${id}');this.closest('.modal-overlay').remove()">Delete</button>
        </div>
      </div>`;
    document.getElementById('phone-frame').appendChild(overlay);
  },

  async _doDelete(id) {
    await fetch(API_BASE + '/accounts/' + id, {
      method: 'DELETE',
      headers: { 'Authorization':'Bearer '+State.token }
    }).catch(()=>null);
    const accts = State.data.accounts || DEMO.accounts;
    const idx   = accts.findIndex(a=>a.account_id===id);
    if (idx>=0) accts.splice(idx, 1);
    State.data.accounts = accts;
    this.showToast('Account deleted');
    this.goTab('wealth');
  },

  exportAccount(id, format) {
    const a     = (State.data.accounts||DEMO.accounts).find(x=>x.account_id===id);
    const txs   = DEMO.transactions.filter(t=>t.account_id===id||t.to_account_id===id);
    const name  = a ? a.name : 'Account';

    if (format === 'csv') {
      const rows = ['Date,Type,Description,Category,Amount,Balance'];
      let running = a ? a.balance : 0;
      [...txs].sort((x,y)=>new Date(x.date)-new Date(y.date)).forEach(t => {
        const isInc = t._type==='income' || t.to_account_id===id;
        const amt   = isInc ? t.amount : -t.amount;
        rows.push([t.date, t._type, (t.source||t.description||''), t.category, amt, running].join(','));
        running -= amt;
      });
      const blob = new Blob([rows.join('\n')], {type:'text/csv'});
      const url  = URL.createObjectURL(blob);
      const el   = document.createElement('a');
      el.href = url; el.download = `${name}-statement.csv`; el.click();
      URL.revokeObjectURL(url);
      this.showToast(`${name} statement downloaded`);
    } else {
      this.showToast(`${format.toUpperCase()} export — connect to backend for full export`);
    }
  },

  exportAllAccounts() {
    const accts = State.data.accounts || DEMO.accounts;
    const rows  = ['Account,Type,Balance,Institution,Visible'];
    accts.forEach(a => rows.push([a.name, a.account_type, a.balance, a.institution||'', a.visible!==false?'Yes':'No'].join(',')));
    const blob = new Blob([rows.join('\n')], {type:'text/csv'});
    const url  = URL.createObjectURL(blob);
    const el   = document.createElement('a');
    el.href = url; el.download = 'accounts-summary.csv'; el.click();
    URL.revokeObjectURL(url);
    this.showToast('Accounts summary exported');
  },

  /* ── Transaction actions ─────────────────────── */
  openTxDetail(id) {
    const tx = (State.data.transactions || DEMO.transactions).find(t => t.id === id);
    if (!tx) return;
    const isInc  = tx._type === 'income';
    const isTxfr = tx._type === 'transfer';
    const color  = isTxfr ? COLORS.info : isInc ? COLORS.success : COLORS.danger;
    const amtStr = isTxfr ? formatINR(tx.amount) : `${isInc?'+':'-'}${formatINR(tx.amount)}`;
    const accts  = State.data.accounts || DEMO.accounts;
    const acct   = accts.find(a => a.account_id === tx.account_id);

    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">
          <div class="list-icon" style="background:${color}22;width:52px;height:52px;border-radius:26px">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="${color}">${(isTxfr?ICON.swap:isInc?ICON.arrow_dn:ICON.arrow_up).match(/<path[^>]*\/>/g).join('')}</svg>
          </div>
          <div>
            <div style="color:var(--text);font-size:18px;font-weight:700">${amtStr}</div>
            <div style="color:var(--text-dim);font-size:13px">${formatDate(tx.date)}</div>
          </div>
        </div>
        ${[
          ['Type', tx._type.charAt(0).toUpperCase()+tx._type.slice(1)],
          ['Category', tx.category || '—'],
          ['Account', acct ? acct.name : '—'],
          ['Description', tx.source || tx.description || '—'],
          ['Date', tx.date || '—'],
        ].map(([k,v]) => `
          <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)">
            <span style="color:var(--text-dim);font-size:14px">${k}</span>
            <span style="color:var(--text);font-size:14px;font-weight:600">${v}</span>
          </div>`).join('')}
        <button class="btn btn-outline" style="width:100%;margin-top:20px" onclick="this.closest('.modal-overlay').remove()">Close</button>
      </div>`;
    document.getElementById('phone-frame').appendChild(overlay);
  },

  async saveTx() {
    const amount = parseFloat(document.getElementById('tx-amount')?.value || '0');
    if (!amount || amount <= 0) { this.showToast('Please enter a valid amount'); return; }
    const type  = State.addTxType || State.params?.type || 'expense';
    const date  = document.getElementById('tx-date')?.value || new Date().toISOString().slice(0,10);
    const desc  = document.getElementById('tx-desc')?.value || '';
    const notes = document.getElementById('tx-notes')?.value || '';
    const acct  = document.getElementById('tx-account')?.value || document.getElementById('tx-from')?.value || '';
    const cat   = document.getElementById('tx-category')?.value || 'Others';

    const body = { amount, date, description: desc, notes, account_id: acct, category: cat };
    let ok = false;
    if (type === 'income') {
      const r = await apiPost('/income', { ...body, source: desc });
      ok = !!r;
    } else if (type === 'expense') {
      const r = await apiPost('/expenses', body);
      ok = !!r;
    } else {
      const toAcct = document.getElementById('tx-to')?.value || '';
      const r = await apiPost('/transfers', { ...body, from_account_id: acct, to_account_id: toAcct });
      ok = !!r;
    }

    // Add to local demo data regardless (optimistic)
    const newTx = {
      id: 'tx_' + Date.now(), _type: type, amount, date, category: cat,
      source: desc, description: desc, account_id: acct,
    };
    DEMO.transactions.unshift(newTx);
    if (type === 'income')  { DEMO.dashboard.monthly_income   += amount; DEMO.dashboard.total_balance += amount; }
    if (type === 'expense') { DEMO.dashboard.monthly_expenses += amount; DEMO.dashboard.total_balance -= amount; }

    State.addTxType = null;
    this.showToast(ok ? `${type.charAt(0).toUpperCase()+type.slice(1)} saved!` : `${type.charAt(0).toUpperCase()+type.slice(1)} saved (demo mode)`);
    await loadDashboardData();
    this.goTab('transactions');
  },

  /* ── Toast ───────────────────────────────────── */
  showToast(msg, duration = 2500) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), duration);
  },
};

function capitalize(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

/* ══════════════════════════════════════════════════════
   10. INIT
══════════════════════════════════════════════════════ */
(async function init() {
  if (State.token && State.user) {
    // Already logged in — restore session
    await loadDashboardData();
    document.getElementById('tab-bar').style.display = 'flex';
    App.goTab('dashboard');
  } else {
    App.navigate('login');
  }
})();
</script>
</body>
</html>
