/* ─── DASHBOARD ──────────────────────────────────────── */
function renderDashboard() {
  const d   = State.data.dashboard || DEMO.dashboard;
  const acc = State.data.accounts  || DEMO.accounts;
  const rem = State.data.reminders || DEMO.reminders;
  const tx  = State.data.recentTx  || (DEMO.transactions||[]).slice(0,5);
  const u   = State.user || DEMO.user;

  const allTxsD  = State.data.transactions || DEMO.transactions;
  const nowD     = new Date();
  const curMTxsD = allTxsD.filter(t => { const d2 = new Date(t.date); return d2.getMonth() === nowD.getMonth() && d2.getFullYear() === nowD.getFullYear(); });
  // Compute true net worth matching the Wealth tab formula
  const _invD        = (State.data.investments || DEMO.investments || []).reduce((s,i)=>s+(i.current||0),0);
  const _rentalD     = (DEMO.rentals||[]).reduce((s,r)=>s+(r.market_value||0),0);
  const _otherD      = (DEMO.otherAssets||[]).reduce((s,x)=>s+(x.value||0),0);
  const _lentD       = (DEMO.lendBorrow||[]).filter(x=>x.type==='lent'&&x.status!=='settled').reduce((s,x)=>s+(x.remaining||x.amount||0),0);
  const _loansD      = (DEMO.loans||[]).reduce((s,l)=>s+(l.outstanding||0),0);
  const _ccD         = (DEMO.creditCards||[]).reduce((s,c)=>s+c.outstanding,0);
  const _borrowedD   = (DEMO.lendBorrow||[]).filter(x=>x.type==='borrowed').reduce((s,x)=>s+(x.remaining||x.amount||0),0);
  const _bankD       = acc.filter(a=>a.account_type==='bank').reduce((s,a)=>s+a.balance,0);
  const _cashD       = acc.filter(a=>a.account_type==='cash'||a.account_type==='wallet').reduce((s,a)=>s+a.balance,0);
  const totalBalance  = (_bankD + _cashD + _invD + _rentalD + _otherD + _lentD) - (_loansD + _ccD + _borrowedD);
  const monthlyIncome   = curMTxsD.filter(t => t._type === 'income').reduce((s, t) => s + (t.amount || 0), 0) || d.monthly_income || 0;
  const monthlyExpenses = curMTxsD.filter(t => t._type === 'expense').reduce((s, t) => s + (t.amount || 0), 0) || d.monthly_expenses || 0;
  const savings         = monthlyIncome - monthlyExpenses;
  const nwDeltaPct      = d.net_worth_delta_pct  ?? 3.8;
  const nwDeltaAbs      = d.net_worth_delta_abs  ?? 8820;
  const nwUp  = nwDeltaPct >= 0;
  const incDeltaPct = d.income_delta_pct   ?? 5.2;
  const expDeltaPct = d.expense_delta_pct  ?? -2.1;
  const savDeltaPct = d.savings_delta_pct  ?? 18.4;
  const incUp = incDeltaPct >= 0;
  const expUp = expDeltaPct > 0;
  const savUp = savDeltaPct >= 0;

  // Sparkline data (simulate trend)
  const sparkData = [
    totalBalance * 0.72, totalBalance * 0.78, totalBalance * 0.81,

  // Build account groups
  const groups = { bank: {icon:'bank',label:'Bank Accounts',color:COLORS.info,total:0,count:0},

  acc.forEach(a => {

        <div class="list-amount" style="color:${color}">${amtStr}</div>
        <div class="list-date">${formatDate(t.date)}</div>
      </div>
    </div>`;
  }).join('');

  return `

            ${nwUp?'▲ +':'▼ '}${formatINR(Math.abs(nwDeltaAbs))} this month

        </div>
        <div class="sparkline">

/* ─── TRANSACTIONS MODULE ────────────────────────────── */
const TX_CAT_ICONS = {
  'Salary':{'icon':'💼','color':'#22C55E'},'Freelance':{'icon':'💻','color':'#22C55E'},'Freelance Work':{'icon':'💻','color':'#22C55E'},
  'Business Income':{'icon':'🏢','color':'#22C55E'},'Investment Returns':{'icon':'📈','color':'#22C55E'},
  'Rental Income':{'icon':'🏠','color':'#22C55E'},'Gift':{'icon':'🎁','color':'#22C55E'},
  'Food & Dining':{'icon':'🍽️','color':'#F59E0B'},'Food':{'icon':'🍽️','color':'#F59E0B'},
  'Shopping':{'icon':'🛍️','color':'#EF4444'},'Transport':{'icon':'🚗','color':'#3B82F6'},
  'Bills & Utilities':{'icon':'💡','color':'#8B5CF6'},'Health':{'icon':'🏥','color':'#EC4899'},
  'Entertainment':{'icon':'🎬','color':'#06B6D4'},'Housing':{'icon':'🏠','color':'#14B8A6'},
  'Rent':{'icon':'🏠','color':'#14B8A6'},'Education':{'icon':'📚','color':'#6366F1'},
  'Travel':{'icon':'✈️','color':'#F97316'},'Grocery':{'icon':'🛒','color':'#84CC16'},
  'Transfer':{'icon':'🔄','color':'#60A5FA'},'Others':{'icon':'💰','color':'#A0A3BD'},
};
function txCatMeta(cat) { return TX_CAT_ICONS[cat] || {icon:'💰',color:'#A0A3BD'}; }

function renderTransactions() {
  var allTx  = State.data.transactions || DEMO.transactions;
  var accts  = State.data.accounts || DEMO.accounts;
  var filter = State.txFilter || 'all';
  var month  = State.txMonth != null ? State.txMonth : new Date().getMonth();
  var year   = State.txYear  != null ? State.txYear  : new Date().getFullYear();
  var search = (State.txSearch || '').toLowerCase();
  var acctFilter = State.txAccountFilter || 'all';
  var showSearch = State.txShowSearch || false;
  var showAdvFilter = State.txShowAdvFilter || false;
  var txCatFilter = State.txCatFilter || 'all';
  var txMinAmt = State.txMinAmt || '';
  var txMaxAmt = State.txMaxAmt || '';

  // Filter by month/year
  var inPeriod = allTx.filter(function(t) {
    var d = new Date(t.date);
    return d.getMonth() === month && d.getFullYear() === year;
  });

  // Account filter
  if (acctFilter !== 'all') {
    inPeriod = inPeriod.filter(function(t) { return t.account_id === acctFilter; });
  }

  // Summary totals (always from full period, before type filter)
  var totalIncome  = inPeriod.filter(function(t) { return t._type === 'income'; }).reduce(function(s,t) { return s + t.amount; }, 0);
  var totalExpense = inPeriod.filter(function(t) { return t._type === 'expense'; }).reduce(function(s,t) { return s + t.amount; }, 0);
  var netSavings   = totalIncome - totalExpense;
  var incomeCount  = inPeriod.filter(function(t) { return t._type === 'income'; }).length;
  var expCount     = inPeriod.filter(function(t) { return t._type === 'expense'; }).length;
  var txfrCount    = inPeriod.filter(function(t) { return t._type === 'transfer'; }).length;

  // Type filter
  var filtered = filter === 'all' ? inPeriod : inPeriod.filter(function(t) { return t._type === filter; });

  // Category filter
  if (txCatFilter !== 'all') {
    filtered = filtered.filter(function(t) { return (t.category || '') === txCatFilter; });
  }

  // Amount range filter
  if (txMinAmt !== '') filtered = filtered.filter(function(t) { return t.amount >= parseFloat(txMinAmt); });
  if (txMaxAmt !== '') filtered = filtered.filter(function(t) { return t.amount <= parseFloat(txMaxAmt); });

  // Search filter
  if (search) {
    filtered = filtered.filter(function(t) {
      return (t.source || '').toLowerCase().indexOf(search) !== -1
          || (t.description || '').toLowerCase().indexOf(search) !== -1
          || (t.category || '').toLowerCase().indexOf(search) !== -1;
    });
  }

  // Group by date
  var grouped = {};
  filtered.forEach(function(t) {
    var dk = t.date ? t.date.slice(0,10) : 'Unknown';
    if (!grouped[dk]) grouped[dk] = [];
    grouped[dk].push(t);
  });
  var dateKeys = Object.keys(grouped).sort(function(a,b) { return b.localeCompare(a); });

  var txRows = dateKeys.map(function(dk) {
    var dayTxs = grouped[dk];
    var dateLabel = (function() {
      var d = new Date(dk); d.setHours(0,0,0,0);
      var today = new Date(); today.setHours(0,0,0,0);
      var diff = Math.round((d - today) / 86400000);
      if (diff === 0)  return 'Today';
      if (diff === -1) return 'Yesterday';
      return d.getDate() + ' ' + MONTHS_FULL[d.getMonth()];
    })();

    var rows = dayTxs.map(function(t) {
      var isInc  = t._type === 'income';
      var isTxfr = t._type === 'transfer';
      var meta   = txCatMeta(t.category);
      var title  = isTxfr ? (t.source || t.payee || 'Transfer') : (t.source || t.description || t.payee || t.category || 'Transaction');
      var acct   = accts.find(function(a) { return a.account_id === t.account_id; });
      var sub    = [t.category, acct ? acct.name : ''].filter(Boolean).join(' \xb7 ');
      var amtColor = isTxfr ? COLORS.info : isInc ? COLORS.success : COLORS.danger;
      var amtStr = isTxfr ? formatINR(t.amount) : (isInc ? '+' : '-') + formatINR(t.amount);
      var timeStr = t.date ? new Date(t.date).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'}) : '';
      return '<div class="tx-row" onclick="App.openTxDetail(\'' + t.id + '\')">'
        + '<div class="tx-row-icon" style="background:' + meta.color + '22;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">'
        + meta.icon
        + '</div>'
        + '<div class="tx-row-body">'
        + '<div class="tx-row-title">' + escapeHtml(title) + '</div>'
        + '<div class="tx-row-sub">' + escapeHtml(sub) + '</div>'
        + '</div>'
        + '<div class="tx-row-right">'
        + '<div class="tx-row-amt" style="color:' + amtColor + '">' + amtStr + '</div>'
        + '<div class="tx-row-date">' + timeStr + '</div>'
        + '</div>'

/* ─── EXPERT VIEW ─────────────────────────────────────── */
function renderExpertView() {
  var allTx  = State.data.transactions || DEMO.transactions || [];
  var period = State.txExpertPeriod || 'month';
  var now    = new Date();
  var month  = State.txMonth != null ? State.txMonth : now.getMonth();
  var year   = State.txYear  != null ? State.txYear  : now.getFullYear();

  var filtered = allTx.filter(function(t) {
    var d = new Date(t.date);
    if (period === 'month')   return d.getMonth()===month && d.getFullYear()===year;
    if (period === 'quarter') return Math.floor(d.getMonth()/3)===Math.floor(month/3) && d.getFullYear()===year;
    if (period === 'year')    return d.getFullYear()===year;
    var w = new Date(now); w.setHours(0,0,0,0); w.setDate(w.getDate()-7);
    var dNorm = new Date(t.date); dNorm.setHours(0,0,0,0);
    return dNorm >= w && dNorm <= now;
  });

  var totalIncome  = filtered.filter(function(t){return t._type==='income';}).reduce(function(s,t){return s+t.amount;},0);
  var totalExpense = filtered.filter(function(t){return t._type==='expense';}).reduce(function(s,t){return s+t.amount;},0);
  var netSavings   = totalIncome - totalExpense;
  var savingsPct   = totalIncome>0 ? Math.round(netSavings/totalIncome*100) : 0;

  var catMap = {};
  filtered.filter(function(t){return t._type==='expense';}).forEach(function(t){
    var c = t.category||'Others';
    catMap[c] = (catMap[c]||0) + t.amount;
  });
  var catArr = Object.keys(catMap).map(function(c){return {cat:c,amt:catMap[c]};}).sort(function(a,b){return b.amt-a.amt;}).slice(0,6);
  var maxCat = catArr.length ? catArr[0].amt : 1;

  var catBars = catArr.map(function(c) {
    var m   = txCatMeta(c.cat);
    var pct = Math.round(c.amt/(totalExpense||1)*100);
    var bw  = Math.round(c.amt/maxCat*100);
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
      +'<div style="font-size:20px;width:28px;text-align:center">'+m.icon+'</div>'
      +'<div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:5px">'
      +'<span style="color:var(--text);font-size:13px;font-weight:600">'+c.cat+'</span>'
      +'<span style="color:var(--text-dim);font-size:12px">'+formatINR(c.amt)+' · '+pct+'%</span></div>'
      +'<div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px"><div style="height:6px;width:'+bw+'%;background:'+m.color+';border-radius:3px"></div></div>'
      +'</div></div>';
  }).join('');

  var months6 = [];
  for (var i=5;i>=0;i--) {
    var mm = (month-i+12)%12;

// --- Donut chart SVG (rotation-based, correct across all browsers) ---
function _invDonut(cats, r, sw) {
  var C = 2 * Math.PI * r;
  var cx = r + sw / 2 + 2, cy = cx, size = cx * 2;
  var circles = cats.map(function(c) {
    if (c.pct <= 0) return '';
    var arc = C * c.pct / 100;
    var rot = (360 * c.cum / 100) - 90;
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none"'
      + ' stroke="' + c.color + '" stroke-width="' + sw + '"'
      + ' stroke-dasharray="' + arc.toFixed(2) + ' ' + (C - arc).toFixed(2) + '"'
      + ' transform="rotate(' + rot.toFixed(1) + ' ' + cx + ' ' + cy + ')"'
      + ' stroke-linecap="butt"/>';
  }).join('');
  return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="flex-shrink:0">'
    + '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="' + sw + '"/>'
    + circles + '</svg>';
}

// --- Category summaries for dashboard ---
function _invCatSummaries() {
  var result = [], cumPct = 0;
  var liveInvs = State.data.investments;
  var catData = {};
  if (liveInvs && liveInvs.length) {
    liveInvs.forEach(function(inv) {
      var k = (inv.type || 'other').toLowerCase().replace(/\s+/g, '_');
      if (!catData[k]) catData[k] = { invested: 0, current: 0, count: 0 };
      catData[k].invested += inv.invested || 0;
      catData[k].current  += inv.current  || 0;
      catData[k].count++;
    });
  } else {
    Object.keys(INV_PORTFOLIO).forEach(function(cat) {
      var items = INV_PORTFOLIO[cat];
      catData[cat] = {
        invested: items.reduce(function(s, i) { return s + (i.invested || 0); }, 0),
        current:  items.reduce(function(s, i) { return s + (i.current  || 0); }, 0),
        count: items.length,
      };
    });
  }
  var totalCur = Object.keys(catData).reduce(function(s, k) { return s + catData[k].current; }, 0);
  Object.keys(catData).forEach(function(cat) {
    var meta = INV_CAT_META[cat] || { icon: '💰', color: '#6C47FF', label: cat, sub: '' };
    var g = catData[cat];
    var pct = totalCur > 0 ? (g.current / totalCur * 100) : 0;
    result.push({ cat: cat, label: meta.label, icon: meta.icon, color: meta.color, sub: meta.sub || '',
      invested: g.invested, current: g.current, count: g.count, gain: g.current - g.invested, pct: pct, cum: cumPct });
    cumPct += pct;
  });
  return result;
}

function _invGetItems(cat) {
  return (INV_PORTFOLIO[cat] || []).map(function(i) { return Object.assign({ category: cat }, i); });
}

function _invFindItem(id) {
  var found = null;
  Object.keys(INV_PORTFOLIO).forEach(function(cat) {
    (INV_PORTFOLIO[cat] || []).forEach(function(i) {
      if (i.id === id) found = Object.assign({ category: cat }, i);
    });
  });
  return found;
}

function _invGainColor(g) { return g >= 0 ? '#10D078' : '#FF4D6A'; }
function _invSign(g) { return g >= 0 ? '+' : ''; }
function _invGainPct(inv, cur) { return inv > 0 ? ((cur - inv) / inv * 100) : 0; }
function _invFmtDate(iso) {
  if (!iso) return '—';
  var months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // Parse date-only strings (YYYY-MM-DD) manually to avoid UTC-vs-local timezone shift
  var datePart = String(iso).split('T')[0];
  var parts = datePart.split('-');
  if (parts.length === 3) {
    return parseInt(parts[2], 10) + ' ' + months[parseInt(parts[1], 10) - 1] + ' ' + parts[0];
  }
  var d = new Date(iso);
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear();
}

var _invBackSVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>';

function _invFmtTime(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  var h = d.getHours(), m = d.getMinutes();
  var ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return _invFmtDate(iso) + ', ' + h + ':' + (m < 10 ? '0' : '') + m + ' ' + ampm;
}

function _invChartSVG(gainPct, period, w, h) {
  // Deterministic bezier chart - seeded by gainPct + period string
  var seed = Math.abs(gainPct * 137 + period.charCodeAt(0) * 31) % 1000;
  function prng(n) { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  var pts = 20;
  var padL = 8, padR = 8, padT = 16, padB = 28;
  var cw = w - padL - padR, ch = h - padT - padB;
  var base = gainPct >= 0 ? 0.62 : 0.38;
  var vals = [];
  for (var i = 0; i < pts; i++) vals.push(base + (prng(i) - 0.5) * 0.28);
  // Trend the last value toward positive or negative
  vals[pts - 1] = gainPct >= 0 ? Math.max(vals[pts - 1], 0.65) : Math.min(vals[pts - 1], 0.35);
  vals[0] = 0.5;
  var xs = vals.map(function(_, i) { return padL + (i / (pts - 1)) * cw; });
  var ys = vals.map(function(v) { return padT + (1 - v) * ch; });
  var color = gainPct >= 0 ? '#10D078' : '#FF4D6A';
  var gradId = 'ig' + Math.abs(gainPct * 10 | 0) + period;
  // Build smooth path using quadratic bezier midpoints
  var d = 'M' + xs[0].toFixed(1) + ',' + ys[0].toFixed(1);
  for (var j = 0; j < pts - 1; j++) {
    var mx = (xs[j] + xs[j + 1]) / 2, my = (ys[j] + ys[j + 1]) / 2;
    d += ' Q' + xs[j].toFixed(1) + ',' + ys[j].toFixed(1) + ' ' + mx.toFixed(1) + ',' + my.toFixed(1);
  }
  d += ' Q' + xs[pts - 2].toFixed(1) + ',' + ys[pts - 2].toFixed(1) + ' ' + xs[pts - 1].toFixed(1) + ',' + ys[pts - 1].toFixed(1);
  var areaD = d + ' L' + xs[pts - 1].toFixed(1) + ',' + (padT + ch) + ' L' + padL + ',' + (padT + ch) + ' Z';
  var gridLines = [0.25, 0.5, 0.75].map(function(f) {
    var y = (padT + f * ch).toFixed(1);
    return '<line x1="' + padL + '" y1="' + y + '" x2="' + (padL + cw) + '" y2="' + y + '" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>';
  }).join('');
  return '<svg width="100%" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">'
    + '<defs>'
    + '<linearGradient id="' + gradId + '" x1="0" y1="0" x2="0" y2="1">'
    + '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.35"/>'
    + '<stop offset="100%" stop-color="' + color + '" stop-opacity="0.02"/>'
    + '</linearGradient></defs>'
    + gridLines
    + '<path d="' + areaD + '" fill="url(#' + gradId + ')"/>'
    + '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle cx="' + xs[pts - 1].toFixed(1) + '" cy="' + ys[pts - 1].toFixed(1) + '" r="4" fill="' + color + '" stroke="#1a1a2e" stroke-width="2"/>'
  + '</svg>';
}

/* ─── INVESTMENT CATEGORY ────────────────────────────── */
function renderInvestmentCategory() {
  var cat    = State.params.cat || 'stocks';
  // Redirect mutual funds and ETFs to dedicated modules
  if (cat === 'mutual_funds')        { setTimeout(function(){ App.navigate('mf-dashboard'); }, 0); return '<div></div>'; }
  if (cat === 'etfs')                { setTimeout(function(){ App.navigate('etf-list');      }, 0); return '<div></div>'; }
  if (cat === 'fds')                 { setTimeout(function(){ App.navigate('fd-list');        }, 0); return '<div></div>'; }
  if (cat === 'corporate_deposits')  { setTimeout(function(){ App.navigate('cd-list');        }, 0); return '<div></div>'; }
  if (cat === 'recurring_deposits')  { setTimeout(function(){ App.navigate('rd-list');        }, 0); return '<div></div>'; }
  if (cat === 'bonds')               { setTimeout(function(){ App.navigate('bonds-list');     }, 0); return '<div></div>'; }
  if (cat === 'nps')                 { setTimeout(function(){ App.navigate('nps-list');                 }, 0); return '<div></div>'; }
  if (cat === 'cash_investment')     { setTimeout(function(){ App.navigate('cash-investment-list');     }, 0); return '<div></div>'; }
  if (cat === 'ppf')                 { setTimeout(function(){ App.navigate('ppf-list');                  }, 0); return '<div></div>'; }
  if (cat === 'epf')                 { setTimeout(function(){ App.navigate('epf-list');                  }, 0); return '<div></div>'; }
  var meta   = INV_CAT_META[cat] || { icon: '💰', color: '#6C47FF', label: cat, sub: '' };
  var items  = _invGetItems(cat);
  var filter = State.invCatFilter || 'all';

  var filtered = filter === 'active' ? items.filter(function(i) { return i.status === 'active'; })
    : filter === 'sold' ? items.filter(function(i) { return i.status === 'sold'; })
    : items;

  var totalInv = items.reduce(function(s, i) { return s + (i.invested || 0); }, 0);
  var totalCur = items.reduce(function(s, i) { return s + (i.current  || 0); }, 0);
  var totalGain = totalCur - totalInv;
  var gainPct = _invGainPct(totalInv, totalCur);
  var gc = _invGainColor(totalGain);

  var filterTabs = ['all', 'active', 'sold'].map(function(f) {
    var active = filter === f;
    return '<div onclick="State.invCatFilter=\'' + f + '\';App.render()" style="flex:1;text-align:center;padding:9px 4px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid ' + (active ? 'var(--primary)' : 'transparent') + ';color:' + (active ? 'var(--primary)' : 'var(--text-dim)') + '">' + f.charAt(0).toUpperCase() + f.slice(1) + '</div>';
  }).join('');

  var rows = filtered.map(function(item) {
    var gain = (item.current || 0) - (item.invested || 0);
    var gp   = _invGainPct(item.invested || 0, item.current || 0);
    var cg   = _invGainColor(gain);
    var sym  = (cat === 'stocks' || cat === 'etfs') ? (item.symbol || item.name).slice(0, 5) : (item.name || '').slice(0, 2).toUpperCase();
    var sub = '';
    if (cat === 'stocks' || cat === 'etfs') sub = (item.exchange || '') + ' · Qty: ' + (item.qty || '—');
    else if (cat === 'mutual_funds')         sub = (item.type || '') + ' · NAV: ₹' + (item.nav || '—');
    else if (cat === 'fds')                  sub = (item.bank || '') + ' · ' + (item.interest_rate || '—') + '% p.a.';
    else if (cat === 'gold')                 sub = (item.platform || '') + ' · ' + (item.grams || '—') + 'g';
    else                                     sub = formatINR(item.invested || 0) + ' invested';

    return '<div onclick="App.navigate(\'investment-detail\',{id:\'' + item.id + '\',cat:\'' + cat + '\'})"'
      + ' style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer">'
      + '<div style="width:42px;height:42px;border-radius:10px;background:' + meta.color + '18;border:1px solid ' + meta.color + '28;display:flex;align-items:center;justify-content:center;color:' + meta.color + ';font-size:10px;font-weight:900;flex-shrink:0;letter-spacing:0.2px;text-align:center">' + sym + '</div>'
      + '<div style="flex:1;min-width:0">'
        + '<div style="color:var(--text);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(item.name) + '</div>'
        + '<div style="color:var(--text-dim);font-size:11px;margin-top:2px">' + sub + '</div>'
      + '</div>'
      + '<div style="text-align:right;flex-shrink:0">'
        + '<div style="color:var(--text);font-size:13px;font-weight:800;margin-bottom:2px">' + formatINR(item.current || 0) + '</div>'
        + '<div style="color:' + cg + ';font-size:11px;font-weight:700">' + _invSign(gain) + gp.toFixed(2) + '%</div>'
      + '</div>'
    + '</div>';
  }).join('');

  return '<div class="screen-wrap" style="padding-bottom:32px">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;padding:52px 20px 12px">'
      + '<div class="icon-btn" onclick="App.navigate(\'investment-dashboard\')">' + _invBackSVG + '</div>'
      + '<div style="text-align:center">'
        + '<div style="color:var(--text);font-size:19px;font-weight:800">' + meta.icon + ' ' + meta.label + '</div>'
        + '<div style="color:var(--text-dim);font-size:11px;margin-top:2px">' + items.length + ' holding' + (items.length !== 1 ? 's' : '') + ' · ' + meta.sub + '</div>'
      + '</div>'
      + '<div onclick="App.navigate(\'investment-type-select\')" style="width:42px;height:42px;border-radius:21px;background:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer">' + _invPlusSVG + '</div>'
    + '</div>'
    // Summary card
    + '<div style="margin:0 20px 14px;background:var(--card);border-radius:var(--radius);padding:14px 16px;border:1px solid var(--border)">'
      + '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">'
        + '<div><div style="color:var(--text-dim);font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px">Invested</div><div style="color:var(--text);font-size:14px;font-weight:800">' + formatINR(totalInv) + '</div></div>'
        + '<div><div style="color:var(--text-dim);font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px">Current</div><div style="color:var(--text);font-size:14px;font-weight:800">' + formatINR(totalCur) + '</div></div>'
        + '<div><div style="color:var(--text-dim);font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px">' + (totalGain >= 0 ? 'Gain' : 'Loss') + '</div>'
          + '<div style="color:' + gc + ';font-size:14px;font-weight:800">' + _invSign(totalGain) + formatINR(Math.abs(totalGain)) + '</div>'
          + '<div style="color:' + gc + ';font-size:10px;font-weight:700">' + _invSign(gainPct) + gainPct.toFixed(2) + '%</div>'
        + '</div>'
      + '</div>'
    + '</div>'
    // Filter tabs
    + '<div style="display:flex;margin:0 20px 14px;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border)">' + filterTabs + '</div>'
    // List
    + '<div style="padding:0 20px">'
      + '<div style="background:var(--card);border-radius:var(--radius);padding:0 14px;border:1px solid var(--border)">'
        + (rows || '<div style="color:var(--text-dim);font-size:14px;text-align:center;padding:32px 0">No investments found.</div>')
      + '</div>'
    + '</div>'
  + '</div>';
}

}

/* ─── INVESTMENT DETAIL ──────────────────────────────── */
function renderInvestmentDetail() {
  var id   = State.params.id;
  var cat  = State.params.cat;
  var item = _invFindItem(id);
  if (!item) return '<div class="screen-wrap"><div style="text-align:center;padding:60px;color:var(--text-dim)">Investment not found.</div></div>';

  var meta    = INV_CAT_META[item.category || cat] || { icon: '💰', color: '#6C47FF', label: 'Investment', sub: '' };
  var tab     = State.invDetailTab || 'overview';
  var gain    = (item.current || 0) - (item.invested || 0);
  var gainPct = _invGainPct(item.invested || 0, item.current || 0);
  var gc      = _invGainColor(gain);
  var isStock = (item.category === 'stocks' || item.category === 'etfs');
  var sym     = isStock ? (item.symbol || (item.name || '').slice(0, 3).toUpperCase()) : (item.name || '').slice(0, 2).toUpperCase();
  var initials = (item.name || '').split(' ').slice(0, 2).map(function(w) { return w[0] || ''; }).join('').toUpperCase();

  var tabBar = ['overview','transactions','notes'].map(function(t) {
    var a = tab === t;
    var lbl = t === 'overview' ? 'Overview' : t === 'transactions' ? 'Transactions' : 'Notes';
    return '<div onclick="State.invDetailTab=\'' + t + '\';App.render()" style="flex:1;text-align:center;padding:11px 4px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid ' + (a ? '#7C5CFC' : 'transparent') + ';color:' + (a ? '#7C5CFC' : 'var(--text-dim)') + ';transition:all 0.2s">' + lbl + '</div>';
  }).join('');

  function detailRow(lbl, val, vc) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.05)">'
      + '<div style="color:var(--text-dim);font-size:13px">' + lbl + '</div>'
      + '<div style="color:' + (vc || 'var(--text)') + ';font-size:13px;font-weight:700">' + val + '</div>'
    + '</div>';
  }

  var content = '';

  /* ══ OVERVIEW TAB ══ */
  if (tab === 'overview') {
    var period = State.invChartPeriod || '1Y';
    var periods = ['1D','1M','3M','6M','1Y','ALL'];
    var periodBar = periods.map(function(p) {
      var a = p === period;
      return '<div onclick="State.invChartPeriod=\'' + p + '\';App.render()" style="flex:1;text-align:center;padding:6px 2px;font-size:11px;font-weight:700;border-radius:6px;cursor:pointer;background:' + (a ? '#7C5CFC' : 'transparent') + ';color:' + (a ? '#fff' : 'var(--text-dim)') + ';transition:all 0.2s">' + p + '</div>';
    }).join('');

    var chartW = 320, chartH = 110;
    var chartSVG = _invChartSVG(gainPct, period, chartW, chartH);

    var detailRows = [];
    if (item.qty)           detailRows.push(detailRow('Shares', item.qty + ' shares'));
    if (item.buy_price)     detailRows.push(detailRow('Avg Buy Price', '₹' + item.buy_price.toLocaleString('en-IN')));
    if (item.current_price) detailRows.push(detailRow('Current Price', '₹' + item.current_price.toLocaleString('en-IN'), gc));
    if (item.nav)           detailRows.push(detailRow('NAV', '₹' + item.nav));
    if (item.units)         detailRows.push(detailRow('Units', item.units.toFixed(3)));
    if (item.sip_amt)       detailRows.push(detailRow('SIP Amount', formatINR(item.sip_amt) + '/mo'));
    if (item.interest_rate) detailRows.push(detailRow('Interest Rate', item.interest_rate + '% p.a.'));
    if (item.tenure)        detailRows.push(detailRow('Tenure', item.tenure));
    if (item.maturity_date) detailRows.push(detailRow('Maturity Date', _invFmtDate(item.maturity_date)));
    if (item.grams)         detailRows.push(detailRow('Weight', item.grams + 'g'));
    if (item.equity_pct)    detailRows.push(detailRow('Equity Allocation', item.equity_pct + '%'));
    if (item.pran)          detailRows.push(detailRow('PRAN', item.pran));
    if (item.uan)           detailRows.push(detailRow('UAN', item.uan));
    // Derive "Invested On" from first buy transaction, falling back to opening_year
    var txDataOv = INV_TRANSACTIONS[id];
    var firstBuyDate = txDataOv && txDataOv.buys && txDataOv.buys.length > 0 ? txDataOv.buys[0].date : null;
    if (firstBuyDate) detailRows.push(detailRow('Invested On', _invFmtDate(firstBuyDate)));
    else if (item.opening_year) detailRows.push(detailRow('Opened', String(item.opening_year)));
    detailRows.push(detailRow('Last Updated', _invFmtDate(new Date().toISOString().slice(0, 10))));

    content = '<div style="padding:0 16px">'
      // 3-col metrics
      + '<div style="display:flex;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:14px;overflow:hidden">'
        + _invMetric('Total Invested', formatINR(item.invested || 0), 'var(--text)', '')
        + '<div style="width:1px;background:var(--border);align-self:stretch;margin:10px 0"></div>'
        + _invMetric('Current Value', formatINR(item.current || 0), 'var(--text)', '')
        + '<div style="width:1px;background:var(--border);align-self:stretch;margin:10px 0"></div>'
        + _invMetric('Gain / Loss', _invSign(gain) + formatINR(Math.abs(gain)), gc, _invSign(gainPct) + gainPct.toFixed(2) + '%')
      + '</div>'
      // Detail rows card
      + '<div style="background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);padding:0 14px;margin-bottom:14px">'
        + detailRows.join('')
      + '</div>'
      // Performance chart
      + '<div style="background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);padding:16px 14px;margin-bottom:14px">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
          + '<div style="color:var(--text);font-size:13px;font-weight:700">Performance</div>'
          + '<div style="color:' + gc + ';font-size:12px;font-weight:700">' + _invSign(gainPct) + gainPct.toFixed(2) + '% (' + period + ')</div>'
        + '</div>'
        + '<div style="width:100%;overflow:hidden">' + chartSVG + '</div>'
        + '<div style="display:flex;gap:4px;margin-top:10px;background:rgba(255,255,255,0.04);border-radius:8px;padding:4px">' + periodBar + '</div>'
      + '</div>'
      // Action buttons
      + '<div style="display:flex;gap:10px;margin-bottom:8px">'
        + '<button onclick="App.navigate(\'investment-buy\',{type:\'' + (item.category || cat) + '\',editId:\'' + item.id + '\'})" class="btn" style="flex:1;padding:14px;background:#10D078;color:#fff;font-size:14px;font-weight:800;border-radius:var(--radius-sm)">Buy More</button>'
        + '<button onclick="App.navigate(\'investment-sell\',{id:\'' + item.id + '\',cat:\'' + (item.category || cat) + '\'})" class="btn" style="flex:1;padding:14px;background:#FF4D6A;color:#fff;font-size:14px;font-weight:800;border-radius:var(--radius-sm)">Sell</button>'
      + '</div>'
    + '</div>';

  /* ══ TRANSACTIONS TAB ══ */
  } else if (tab === 'transactions') {
    var txData  = INV_TRANSACTIONS[id] || { buys: [], sells: [] };
    var buys    = txData.buys  || [];
    var sells   = txData.sells || [];

    var txCard = function(tx, isBuy) {
      var tc = isBuy ? '#10D078' : '#FF4D6A';
      var pl = tx.realized_pl;
      var plColor = (pl !== undefined) ? _invGainColor(pl) : '#fff';
      var isSIP = !!tx.sip;
      var qtyDisplay = isSIP
        ? 'Units: <span style="color:var(--text);font-weight:700">' + (tx.units || '—') + '</span>'
        : 'Qty: <span style="color:var(--text);font-weight:700">' + (tx.qty || '—') + '</span>';
      var priceLabel = isSIP ? 'NAV' : (isBuy ? 'Buy Price' : 'Sell Price');
      var priceVal   = tx.price ? '₹' + tx.price.toLocaleString('en-IN') : (tx.nav ? '₹' + tx.nav : '—');
      var chargesVal = tx.total_charges ? '₹' + tx.total_charges.toFixed(2) : (isSIP ? '₹0.00' : '—');
      return '<div style="background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:10px;overflow:hidden">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.05)">'
          + '<div style="color:var(--text);font-size:13px;font-weight:700">' + _invFmtDate(tx.date) + '</div>'
          + '<div style="color:var(--text-dim);font-size:12px;font-weight:600">' + qtyDisplay + '</div>'
        + '</div>'
        + '<div style="display:flex;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.05)">'
          + _invTxCell(priceLabel, priceVal)
          + '<div style="width:1px;background:var(--border)"></div>'
          + _invTxCell('Amount', tx.amount ? formatINR(tx.amount) : '—')
          + '<div style="width:1px;background:var(--border)"></div>'
          + _invTxCell('Charges', chargesVal)
        + '</div>'
        + (pl !== undefined ? '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;background:' + (pl >= 0 ? 'rgba(16,208,120,0.06)' : 'rgba(255,77,106,0.06)') + '">'
          + '<div style="color:var(--text-dim);font-size:12px;font-weight:600">Realized P&amp;L</div>'
          + '<div style="color:' + plColor + ';font-size:13px;font-weight:800">' + _invSign(pl) + formatINR(Math.abs(pl)) + '</div>'
        + '</div>' : '')
      + '</div>';
    };

    var buyCards  = buys.map(function(tx)  { return txCard(tx, true);  }).join('');
    var sellCards = sells.map(function(tx) { return txCard(tx, false); }).join('');

    var totalBuyAmt  = buys.reduce(function(s, t)  { return s + (t.amount || 0); }, 0);
    var totalBuyQty  = buys.reduce(function(s, t)  { return s + (t.qty || t.units || 0); }, 0);
    var avgBuyPrice  = totalBuyQty > 0 ? totalBuyAmt / totalBuyQty : 0;
    var isMFItem     = (item.category === 'mutual_funds');
    var qtyLabel     = isMFItem ? 'Total Units' : 'Total Shares';
    var avgPriceLabel = isMFItem ? 'Avg NAV' : 'Avg Buy Price';

    var totalSellQty = sells.reduce(function(s, t) { return s + (t.qty || t.units || 0); }, 0);
    var totalSellAmt = sells.reduce(function(s, t) { return s + (t.amount|| 0); }, 0);
    var totalRealPL  = sells.reduce(function(s, t) { return s + (t.realized_pl || 0); }, 0);
    var realPLPct    = totalSellAmt > 0 ? (totalRealPL / (totalSellAmt - totalRealPL) * 100) : 0;

    content = '<div style="padding:0 16px">'
      // Buy Transactions
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
        + '<div style="color:var(--text);font-size:14px;font-weight:800">Buy Transactions</div>'
        + '<div style="color:var(--text-dim);font-size:12px">' + buys.length + ' transaction' + (buys.length !== 1 ? 's' : '') + '</div>'
      + '</div>'
      + (buyCards || '<div style="color:var(--text-dim);font-size:13px;text-align:center;padding:20px;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:10px">No buy transactions</div>')
      // Buy summary
      + (buys.length ? '<div style="display:flex;background:rgba(16,208,120,0.06);border:1px solid rgba(16,208,120,0.15);border-radius:var(--radius-sm);padding:12px 0;margin-bottom:20px">'
          + _invTxCell(qtyLabel, totalBuyQty > 0 ? (isMFItem ? totalBuyQty.toFixed(3) + ' units' : totalBuyQty + ' qty') : '—')
          + '<div style="width:1px;background:rgba(255,255,255,0.08)"></div>'
          + _invTxCell(avgPriceLabel, avgBuyPrice > 0 ? '₹' + avgBuyPrice.toFixed(2) : '—')
          + '<div style="width:1px;background:rgba(255,255,255,0.08)"></div>'
          + _invTxCell('Total Invested', formatINR(totalBuyAmt))
        + '</div>' : '')
      // Sell Transactions
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">'
        + '<div style="color:var(--text);font-size:14px;font-weight:800">Sell Transactions</div>'
        + '<div style="color:var(--text-dim);font-size:12px">' + sells.length + ' transaction' + (sells.length !== 1 ? 's' : '') + '</div>'
      + '</div>'
      + (sellCards || '<div style="color:var(--text-dim);font-size:13px;text-align:center;padding:20px;background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);margin-bottom:10px">No sell transactions</div>')
      // Sell summary
      + (sells.length ? '<div style="display:flex;background:rgba(255,77,106,0.06);border:1px solid rgba(255,77,106,0.15);border-radius:var(--radius-sm);padding:12px 0;margin-bottom:16px">'
          + _invTxCell('Total Sold', totalSellQty + ' qty')
          + '<div style="width:1px;background:rgba(255,255,255,0.08)"></div>'
          + _invTxCell('Total Value', formatINR(totalSellAmt))
          + '<div style="width:1px;background:rgba(255,255,255,0.08)"></div>'
          + _invTxCell('Realized P&L %', (totalRealPL >= 0 ? '+' : '') + realPLPct.toFixed(1) + '%')
        + '</div>' : '')
      + '<button onclick="App.navigate(\'investment-buy\',{type:\'' + (item.category || cat) + '\',editId:\'' + item.id + '\'})" class="btn btn-primary" style="width:100%;padding:14px;font-size:14px;font-weight:800;border-radius:var(--radius-sm);margin-bottom:8px">+ Add Buy Transaction</button>'
    + '</div>';

  /* ══ NOTES TAB ══ */
  } else {
    var nFilter = State.invNoteFilter || 'all';
    var noteTypeMeta = {
      all:      { color:'#7C5CFC', icon:'📋', label:'All' },
      research: { color:'#38BDF8', icon:'🔬', label:'Research' },
      updates:  { color:'#10D078', icon:'📢', label:'Updates' },
      ideas:    { color:'#FBBF24', icon:'💡', label:'Ideas' },
      private:  { color:'#EC4899', icon:'🔒', label:'Private' },
    };
    var chips = ['all','research','updates','ideas','private'].map(function(nt) {
      var a = nFilter === nt; var m = noteTypeMeta[nt];
      return '<div onclick="State.invNoteFilter=\'' + nt + '\';App.render()" style="padding:5px 14px;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;background:' + (a ? m.color : 'transparent') + ';color:' + (a ? '#fff' : 'var(--text-dim)') + ';border:1.5px solid ' + (a ? m.color : 'rgba(255,255,255,0.12)') + '">' + m.label + '</div>';
    }).join('');

    var allNotes     = INV_NOTES[id] || [];
    var filteredNotes = nFilter === 'all' ? allNotes : allNotes.filter(function(n) { return n.type === nFilter; });

    var noteCards = filteredNotes.map(function(n) {
      var m = noteTypeMeta[n.type] || noteTypeMeta.research;
      var noteIcons = { research:'🔬', updates:'📢', ideas:'💡', private:'🔒' };
      var noteIcon  = noteIcons[n.type] || '📋';
      return '<div style="background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);padding:14px;margin-bottom:10px">'
        + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">'
          + '<div style="width:36px;height:36px;border-radius:10px;background:' + m.color + '22;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0">' + noteIcon + '</div>'
          + '<div style="flex:1;min-width:0">'
            + '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">'
              + '<span style="padding:2px 10px;border-radius:999px;font-size:10px;font-weight:700;background:' + m.color + '22;color:' + m.color + '">' + (n.type || '').toUpperCase() + '</span>'
              + '<span style="color:var(--text-dim);font-size:11px">' + _invFmtTime(n.date) + '</span>'
            + '</div>'
          + '</div>'
          + '<div style="color:var(--text-dim);font-size:18px;cursor:pointer;padding:2px 6px;line-height:1" onclick="App._editInvNote(\''+id+'\',\''+n.id+'\')">✏️</div>'
        + '</div>'
        + '<div style="color:var(--text);font-size:14px;font-weight:800;margin-bottom:6px">' + escapeHtml(n.title) + '</div>'
        + '<div style="color:var(--text-dim);font-size:13px;line-height:1.6;margin-bottom:12px">' + escapeHtml(n.text) + '</div>'
        + '<div style="display:flex;align-items:center;gap:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,0.06)">'
          + '<span style="color:var(--text-dim);font-size:12px;font-weight:600">🔒 Private</span>'
          + '<div style="flex:1"></div>'
          + '<button onclick="App._editInvNote(\''+id+'\',\''+n.id+'\')" style="background:none;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;padding:2px 8px">✏️ Edit</button>'
          + '<button onclick="App._deleteInvNote(\''+id+'\',\''+n.id+'\')" style="background:none;border:none;color:#FF4D6A;font-size:13px;cursor:pointer;padding:2px 8px">🗑️ Delete</button>'
        + '</div>'
      + '</div>';
    }).join('');

    content = '<div style="padding:0 16px">'
      // Header
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
        + '<div>'
          + '<div style="color:var(--text);font-size:16px;font-weight:800">Notes (' + allNotes.length + ')</div>'
          + '<div style="color:var(--text-dim);font-size:12px;margin-top:2px">All your notes for this investment</div>'
        + '</div>'
        + '<button onclick="App._addInvNote(\''+id+'\')" class="btn" style="padding:8px 14px;background:#7C5CFC22;color:#7C5CFC;border:1.5px solid #7C5CFC44;border-radius:var(--radius-sm);font-size:13px;font-weight:700">⊕ Add Note</button>'
      + '</div>'
      // Filter chips
      + '<div style="display:flex;gap:6px;overflow-x:auto;padding:12px 0;scrollbar-width:none;-ms-overflow-style:none;margin-bottom:6px">' + chips + '</div>'
      // Note cards
      + (noteCards || '<div style="color:var(--text-dim);font-size:13px;text-align:center;padding:32px 0">No notes found.</div>')
      // Security card
      + '<div style="margin-top:4px;background:linear-gradient(135deg,rgba(124,92,252,0.18) 0%,rgba(56,189,248,0.10) 100%);border:1px solid rgba(124,92,252,0.25);border-radius:var(--radius-sm);padding:16px;display:flex;align-items:center;gap:12px">'
        + '<div style="font-size:26px">🛡️</div>'
        + '<div>'
          + '<div style="color:var(--text);font-size:13px;font-weight:700">Your notes are private and secure</div>'
          + '<div style="color:var(--text-dim);font-size:12px;margin-top:3px">Encrypted and visible only to you</div>'
        + '</div>'
      + '</div>'
    + '</div>';
  }

  return '<div class="screen-wrap" style="padding-bottom:32px">'
    // Header
    + '<div style="display:flex;align-items:center;justify-content:space-between;padding:52px 16px 10px">'
      + '<div class="icon-btn" onclick="App.navigate(\'investment-category\',{cat:\'' + (item.category || cat) + '\'})">' + _invBackSVG + '</div>'
      + '<div style="text-align:center;flex:1;padding:0 8px">'
        + '<div style="color:var(--text);font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(item.name) + '</div>'
        + '<div style="color:var(--text-dim);font-size:12px;margin-top:2px">' + (item.symbol ? item.symbol + ' · ' : '') + (item.exchange || meta.label) + '</div>'
      + '</div>'
      + '<div style="width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,' + meta.color + '33,' + meta.color + '11);border:1px solid ' + meta.color + '44;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:' + meta.color + ';flex-shrink:0">' + initials + '</div>'
    + '</div>'
    // Live price strip
    + '<div style="padding:0 16px 12px">'
      + '<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">'
        + '<div style="color:var(--text);font-size:26px;font-weight:900">' + (item.current_price ? '₹' + item.current_price.toLocaleString('en-IN') : formatINR(item.current || 0)) + '</div>'
        + '<div style="color:' + gc + ';font-size:13px;font-weight:700">' + _invSign(gainPct) + gainPct.toFixed(2) + '% today</div>'
        + '<div style="color:var(--text-dim);font-size:12px;font-weight:600;padding:2px 8px;background:rgba(255,255,255,0.06);border-radius:6px">Market Closed</div>'
      + '</div>'
    + '</div>'
    // Tabs
    + '<div style="display:flex;margin:0 16px 14px;background:rgba(255,255,255,0.04);border-radius:var(--radius-sm);border:1px solid var(--border)">' + tabBar + '</div>'
    + content
  + '</div>';
}

/* ─── INVESTMENT BUY ─────────────────────────────────── */
function renderInvestmentBuy() {
  var type    = State.params.type || 'stocks';

  var isStock = (type === 'stocks' || type === 'etfs');
  var isMF    = (type === 'mutual_funds');
  var today   = new Date().toISOString().slice(0, 10);

  var ins = 'flex:1;background:transparent;border:none;color:var(--text);font-size:14px;font-weight:600;outline:none;-webkit-appearance:none;min-width:0;text-align:right';
  var rowStyle = 'display:flex;align-items:center;padding:13px 16px;border-bottom:1px solid rgba(255,255,255,0.06)';

      ? '<div id="' + inputId + '" style="' + ins + '">' + (value || placeholder) + '</div>'
      : '<input type="' + inputType + '" id="' + inputId + '" placeholder="' + placeholder + '" value="' + (value || '') + '" style="' + ins + '" ' + (extra || '') + '/>';
    return '<div style="' + rowStyle + '">'
      + '<div style="' + iconBg + 'background:' + iconBg2 + '">' + iconEmoji + '</div>'
      + '<div style="' + lblStyle + '">' + lbl + '</div>'

        + txRow('📅', 'rgba(124,92,252,0.15)', 'Date', 'ibf-date', 'date', '', today, 'oninput="App._recalcBuy()"', false)
        + txRow('🏢', 'rgba(56,189,248,0.15)', 'Company Name', 'ibf-name', 'text', editItem ? editItem.name : 'e.g. Reliance Industries', editItem ? editItem.name : '', '', false)
        + txRow('🏛️', 'rgba(16,208,120,0.15)', 'Exchange', 'ibf-exchange', 'text', editItem ? (editItem.exchange || 'NSE') : 'NSE', editItem ? (editItem.exchange || 'NSE') : 'NSE', '', false)
        + (isStock ? txRow('📦', 'rgba(251,191,36,0.15)', 'Quantity', 'ibf-qty', 'number', 'e.g. 10', '', 'oninput="App._recalcBuy()"', false) : '')
        + (isStock ? txRow('💰', 'rgba(255,77,106,0.15)', 'Buy Price (₹)', 'ibf-price', 'number', 'e.g. 2520.00', '', 'oninput="App._recalcBuy()"', false) : '')
        + (!isStock ? txRow('💰', 'rgba(255,77,106,0.15)', 'Amount (₹)', 'ibf-amt', 'number', 'e.g. 5000', '', 'oninput="App._recalcBuy()"', false) : '')
        + (isMF ? txRow('📊', 'rgba(139,92,246,0.15)', 'NAV (₹)', 'ibf-nav', 'number', 'e.g. 104.57', '', 'oninput="App._recalcBuy()"', false) : '')
        + '<div style="' + rowStyle + 'background:rgba(16,208,120,0.05)">'
          + '<div style="' + iconBg + 'background:rgba(16,208,120,0.15)">🧮</div>'
          + '<div style="' + lblStyle + '">Total Purchase</div>'
          + '<div id="ibf-amt-disp" style="color:#10D078;font-size:14px;font-weight:800;margin-left:auto">₹0.00</div>'

    + (isStock ? '<div style="margin:0 16px 16px">'

      + '<div style="background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden">'

        + '</div>'
      + '</div>'
    + '</div>' : '')
    // Additional Details
    + '<div style="margin:0 16px 16px">'
      + '<div style="color:var(--text-dim);font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:8px;padding-left:4px">ADDITIONAL DETAILS</div>'
      + '<div style="background:var(--card);border-radius:var(--radius-sm);border:1px solid var(--border);overflow:hidden">'
        + '<div style="' + rowStyle + '">'
          + '<div style="' + iconBg + 'background:rgba(124,92,252,0.15)">📋</div>'
          + '<div style="' + lblStyle + '">Order Type</div>'
          + '<select id="ibf-ordertype" style="background:transparent;border:none;color:var(--text-dim);font-size:13px;outline:none;cursor:pointer">'
            + '<option value="market">Market Order</option>'
            + '<option value="limit">Limit Order</option>'
            + '<option value="sl">SL Order</option>'
          + '</select>'
        + '</div>'
        + txRow('🏦', 'rgba(56,189,248,0.15)', 'Broker Name', 'ibf-broker', 'text', 'e.g. Zerodha', '', '', false)
        + '<div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,0.06)">'
          + '<div style="color:var(--text-dim);font-size:12px;font-weight:600;margin-bottom:8px">Notes (optional)</div>'
          + '<textarea id="ibf-notes" placeholder="Add any notes about this transaction..." style="width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:10px;color:var(--text);font-size:13px;resize:none;height:70px;outline:none;box-sizing:border-box;font-family:inherit"></textarea>'
        + '</div>'
      + '</div>'
    + '</div>'
    // Net amount summary
    + (isStock ? '<div style="margin:0 16px 16px;background:rgba(108,71,255,0.08);border:1px solid rgba(108,71,255,0.2);border-radius:var(--radius-sm);padding:14px 16px;display:flex;justify-content:space-between;align-items:center">'
      + '<div><div style="color:var(--text-dim);font-size:12px;margin-bottom:4px">Net Amount Payable</div><div style="color:var(--text-dim);font-size:11px">Avg Price: <span id="ibf-avg">₹0.00</span></div></div>'
      + '<div id="ibf-net" style="color:#7C5CFC;font-size:20px;font-weight:900">₹0.00</div>'
    + '</div>' : '')
    + '<div style="padding:0 16px">'
      + '<button onclick="App._saveInvBuy(\'' + type + '\')" class="btn btn-primary" style="width:100%;padding:16px;font-size:15px;font-weight:800;border-radius:var(--radius-sm)">Confirm Buy</button>'
    + '</div>'
  + '</div>';
}

/* ─── INVESTMENT SELL ────────────────────────────────── */
function renderInvestmentSell() {
  var id   = State.params.id;
  var cat  = State.params.cat;
  var item = _invFindItem(id) || {};
  var meta = INV_CAT_META[cat || item.category] || { icon: '📉', color: '#FF4D6A', label: 'Investment' };
  var ins  = 'width:100%;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;font-weight:600;box-sizing:border-box;outline:none;-webkit-appearance:none';
  var today = new Date().toISOString().slice(0, 10);

  // Compute weighted avg buy price from actual transactions when available
  var txDataSell = INV_TRANSACTIONS[id];
  var avgBuy = 0;
  if (txDataSell && txDataSell.buys && txDataSell.buys.length > 0) {
    var _tAmt = txDataSell.buys.reduce(function(s, t) { return s + (t.amount || 0); }, 0);
    var _tQty = txDataSell.buys.reduce(function(s, t) { return s + (t.qty || 0); }, 0);
    avgBuy = _tQty > 0 ? _tAmt / _tQty : 0;
  }
  avgBuy = avgBuy || item.buy_price || (item.invested && item.qty ? (item.invested / item.qty) : 0);

  // Compute net available qty (buys - sells from transactions)
  var availQty = item.qty || 0;
  if (txDataSell) {
    var _bQty = (txDataSell.buys  || []).reduce(function(s, t) { return s + (t.qty || 0); }, 0);
    var _sQty = (txDataSell.sells || []).reduce(function(s, t) { return s + (t.qty || 0); }, 0);
    if (_bQty > 0) availQty = _bQty - _sQty;
  }

  function fr(lbl, inp) {
    return '<div style="margin-bottom:14px"><div style="color:var(--text-dim);font-size:12px;font-weight:600;margin-bottom:6px">' + lbl + '</div>' + inp + '</div>';
  }

  return '<div class="screen-wrap" style="padding-bottom:40px">'
    + '<div style="display:flex;align-items:center;gap:16px;padding:52px 20px 20px">'
      + '<div class="icon-btn" onclick="App.navigate(\'investment-detail\',{id:\'' + (id || '') + '\',cat:\'' + (cat || '') + '\'})">' + _invBackSVG + '</div>'
      + '<div><div style="color:var(--text);font-size:20px;font-weight:800">📉 Sell ' + meta.label + '</div>'
        + '<div style="color:var(--text-dim);font-size:12px;margin-top:3px">' + escapeHtml(item.name || 'Investment') + '</div></div>'
    + '</div>'
    + '<div style="padding:0 20px">'

/* ─── MUTUAL FUNDS MODULE ─────────────────────────────── */

function _mfFunds() { return INV_PORTFOLIO.mutual_funds || []; }
function _mfFund(id) { return _mfFunds().find(function(f){ return f.id === id; }) || {}; }
function _mfGain(f) { return (f.current||0) - (f.invested||0); }
function _mfGainPct(f) { return f.invested > 0 ? (_mfGain(f) / f.invested * 100) : 0; }
function _mfGainColor(g) { return g >= 0 ? '#10D078' : '#FF4D6A'; }
function _mfSign(g) { return g >= 0 ? '+' : ''; }

function _mfInitials(name) {
  return (name || '').split(' ').slice(0,2).map(function(w){ return w[0]||''; }).join('').toUpperCase();
}

function _mfNavChart(fund, period) {
  var hist = fund.nav_history || [];
  var sliced = period === '1M' ? hist.slice(-2)
    : period === '3M' ? hist.slice(-4)
    : period === '6M' ? hist.slice(-7)
    : period === '1Y' ? hist
    : hist;
  if (sliced.length < 2) return '';
  var w = 280, h = 80;
  var min = Math.min.apply(null, sliced), max = Math.max.apply(null, sliced);
  var range = max - min || 1;
  var pts = sliced.map(function(v, i) {
    var x = (i / (sliced.length - 1)) * w;
    var y = h - ((v - min) / range) * (h - 10) - 5;
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  var color = (sliced[sliced.length-1] >= sliced[0]) ? '#10D078' : '#FF4D6A';
  var polyline = '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
  var first = pts[0].split(','), last = pts[pts.length-1].split(',');
  var fillPts = pts.join(' ') + ' ' + last[0] + ',' + h + ' 0,' + h;
  var fill = '<polygon points="' + fillPts + '" fill="url(#mfGrad)" opacity="0.3"/>';
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:' + h + 'px">'
    + '<defs><linearGradient id="mfGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="' + color + '" stop-opacity="0.5"/><stop offset="100%" stop-color="' + color + '" stop-opacity="0"/></linearGradient></defs>'
    + fill + polyline
    + '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="4" fill="' + color + '"/>'
    + '</svg>';
}

function renderMFDashboard() {
  var funds  = _mfFunds();
  var totalInv = funds.reduce(function(s, f) { return s + (f.invested||0); }, 0);
  var totalCur = funds.reduce(function(s, f) { return s + (f.current||0); }, 0);
  var totalGain = totalCur - totalInv;
  var gainPct = totalInv > 0 ? (totalGain / totalInv * 100) : 0;
  var gc = _mfGainColor(totalGain);

  // Donut for fund allocation
  var cumPct = 0;
  var donutSlices = funds.map(function(f) {
    var pct = totalCur > 0 ? (f.current / totalCur * 100) : 0;
    var obj = { color: _mfFundColor(f.id), pct: pct, cum: cumPct };
    cumPct += pct;
    return obj;
  });
  var r = 40, sw = 16, C = 2 * Math.PI * r;
  var cx = r + sw / 2 + 2, cy = cx, sz = cx * 2;
  var donutCircles = donutSlices.map(function(c) {
    if (c.pct <= 0) return '';
    var arc = C * c.pct / 100;
    var rot = (360 * c.cum / 100) - 90;
    return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none"'
      + ' stroke="' + c.color + '" stroke-width="' + sw + '"'
      + ' stroke-dasharray="' + arc.toFixed(2) + ' ' + (C - arc).toFixed(2) + '"'
      + ' transform="rotate(' + rot.toFixed(1) + ' ' + cx + ' ' + cy + ')"'
      + ' stroke-linecap="butt"/>';
  }).join('');
  var donutSvg = '<svg width="' + sz + '" height="' + sz + '" viewBox="0 0 ' + sz + ' ' + sz + '" style="flex-shrink:0">'
    + '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="' + sw + '"/>'
    + donutCircles + '</svg>';

  var search = State.mfSearch || '';
  var filtered = search
    ? funds.filter(function(f){ return f.name.toLowerCase().indexOf(search.toLowerCase()) >= 0; })
    : funds;

  var fundRows = filtered.map(function(f) {
    var gain = _mfGain(f), gp = _mfGainPct(f), gc2 = _mfGainColor(gain);
    var col = _mfFundColor(f.id);
    return '<div onclick="App.navigate(\'mf-detail\',{id:\'' + f.id + '\'})" style="display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.05);cursor:pointer">'
      + '<div style="width:44px;height:44px;border-radius:12px;background:' + col + '22;border:1px solid ' + col + '33;display:flex;align-items:center;justify-content:center;color:' + col + ';font-size:11px;font-weight:900;flex-shrink:0;letter-spacing:0">' + _mfInitials(f.name) + '</div>'
      + '<div style="flex:1;min-width:0">'
        + '<div style="color:var(--text);font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + escapeHtml(f.name) + '</div>'
        + '<div style="color:var(--text-dim);font-size:11px;margin-top:2px">' + (f.type||'') + ' · ' + (f.plan||'') + ' · NAV ₹' + (f.nav||0).toFixed(2) + '</div>'
        + '<div style="margin-top:5px;height:2px;border-radius:1px;background:rgba(255,255,255,0.07);overflow:hidden">'
          + '<div style="height:100%;width:' + ((f.current/totalCur)*100).toFixed(1) + '%;background:' + col + ';border-radius:1px"></div>'
        + '</div>'
      + '</div>'
      + '<div style="text-align:right;flex-shrink:0">'
        + '<div style="color:var(--text);font-size:13px;font-weight:800;margin-bottom:2px">' + formatINR(f.current||0) + '</div>'
        + '<div style="color:' + gc2 + ';font-size:11px;font-weight:700">' + _mfSign(gain) + gp.toFixed(2) + '%</div>'
        + '<div style="color:var(--text-dim);font-size:10px;margin-top:1px">SIP ₹' + formatINR(f.sip_amt||0).replace('₹','') + '</div>'
      + '</div>'
      + '<svg width="16" height="16" viewBox="0 0 24 24" fill="var(--text-dim)" style="margin-left:4px;flex-shrink:0"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>'
    + '</div>';
  }).join('');

  var legend = funds.slice(0,4).map(function(f) {
    return '<div style="display:flex;align-items:center;gap:5px">'
      + '<div style="width:7px;height:7px;border-radius:50%;background:' + _mfFundColor(f.id) + ';flex-shrink:0"></div>'
      + '<div style="color:rgba(255,255,255,0.72);font-size:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:90px">' + escapeHtml(f.name.split(' ').slice(0,2).join(' ')) + '</div>'
      + '<div style="color:rgba(255,255,255,0.9);font-size:10px;font-weight:700;margin-left:auto">' + ((f.current/totalCur)*100).toFixed(1) + '%</div>'
    + '</div>';
  }).join('');

  return '<div class="screen-wrap" style="padding-bottom:90px">'
    // Header
    + '<div style="display:flex;align-items:center;justify-content:space-between;padding:52px 20px 12px">'
      + '<div class="icon-btn" onclick="App.navigate(\'investment-dashboard\')">'
        + '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>'
      + '</div>'
      + '<div style="text-align:center">'
        + '<div style="color:var(--text);font-size:19px;font-weight:800">🏦 Mutual Funds</div>'
        + '<div style="color:var(--text-dim);font-size:11px;margin-top:2px">' + funds.length + ' funds · Direct Plans</div>'
      + '</div>'
      + '<div onclick="App.navigate(\'mf-add-transaction\',{mode:\'new\'})" style="width:38px;height:38px;border-radius:19px;background:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer">'
        + '<svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>'
      + '</div>'
    + '</div>'
    // Hero card
    + '<div style="margin:0 20px 16px;background:linear-gradient(135deg,#1E0A5E 0%,#3D1A9E 45%,#6941F0 85%);border-radius:20px;padding:20px;box-shadow:0 12px 40px rgba(105,65,240,0.4);position:relative;overflow:hidden">'
      + '<div style="position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(255,255,255,0.1) 0%,transparent 70%);border-radius:50%;pointer-events:none"></div>'
      + '<div style="color:rgba(255,255,255,0.6);font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px">PORTFOLIO VALUE</div>'
      + '<div style="color:#fff;font-size:30px;font-weight:900;letter-spacing:-1px;margin-bottom:2px">' + formatINR(totalCur) + '</div>'
      + '<div style="color:' + gc + ';font-size:12px;font-weight:700;margin-bottom:16px">' + _mfSign(totalGain) + formatINR(Math.abs(totalGain)) + ' (' + _mfSign(gainPct) + gainPct.toFixed(2) + '%) All time</div>'
      + '<div style="display:flex;align-items:center;gap:16px">'
        + donutSvg
        + '<div style="flex:1;display:flex;flex-direction:column;gap:4px">' + legend + '</div>'
      + '</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.1)">'
        + '<div><div style="color:rgba(255,255,255,0.55);font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px">Invested</div>'
          + '<div style="color:#fff;font-size:14px;font-weight:800">' + formatINR(totalInv) + '</div></div>'
        + '<div><div style="color:rgba(255,255,255,0.55);font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;margin-bottom:3px">' + (totalGain >= 0 ? 'Total Gain' : 'Total Loss') + '</div>'
          + '<div style="color:' + gc + ';font-size:14px;font-weight:800">' + _mfSign(totalGain) + formatINR(Math.abs(totalGain)) + '</div></div>'
      + '</div>'
    + '</div>'
    // Search bar
    + '<div style="margin:0 20px 12px;display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px">'
      + '<svg width="16" height="16" viewBox="0 0 24 24" fill="var(--text-dim)"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>'
      + '<input id="mf-search-inp" type="text" placeholder="Search funds…" value="' + escapeHtml(search) + '"'
        + ' oninput="State.mfSearch=this.value;App.render()"'
        + ' style="flex:1;background:none;border:none;outline:none;color:var(--text);font-size:14px">'
      + (search ? '<div onclick="State.mfSearch=\'\';App.render()" style="color:var(--text-dim);cursor:pointer;font-size:18px;line-height:1">×</div>' : '')
    + '</div>'
    // Fund list
    + '<div style="padding:0 20px">'
      + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">'
        + '<div style="color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:1px">MY FUNDS (' + filtered.length + ')</div>'
        + '<div onclick="App.navigate(\'mf-add-transaction\',{mode:\'new\'})" style="color:var(--primary);font-size:12px;font-weight:700;cursor:pointer">+ Invest</div>'
      + '</div>'
      + '<div style="background:var(--card);border-radius:var(--radius);padding:0 14px;border:1px solid var(--border)">'
        + (fundRows || '<div style="color:var(--text-dim);font-size:14px;text-align:center;padding:32px 0">No funds found.</div>')
      + '</div>'
    + '</div>'
    // Quick action tiles
    + '<div style="padding:16px 20px 0">'
      + '<div style="color:var(--text-dim);font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:10px">QUICK ACTIONS</div>'
      + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'
        + _mfActionTile('💰', 'Lumpsum', "App.navigate('mf-add-transaction',{txType:'purchase'})")

        + _mfActionTile('📤', 'Redeem', "App.navigate('mf-add-transaction',{txType:'redemption'})")
        + _mfActionTile('📊', 'Allocation', "App.navigate('portfolio-allocation')")
      + '</div>'
    + '</div>'
  + '</div>';

function _mfFundColor(id) {
  var map = { m1:'#6C47FF', m2:'#10D078', m3:'#F59E0B', m4:'#EF4444' };
  return map[id] || '#6C47FF';
}

function _mfActionTile(icon, label, fn) {
  return '<div onclick="' + fn + '" style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer">'
    + '<div style="font-size:22px">' + icon + '</div>'
    + '<div style="color:var(--text);font-size:13px;font-weight:700">' + label + '</div>'
  + '</div>';
}

function renderMFDetail() {

  var gain = _mfGain(fund), gp = _mfGainPct(fund), gc = _mfGainColor(gain);
  var col  = _mfFundColor(id);

  var tabs = ['overview','transactions','notes'].map(function(t) {
    var lbl = t === 'overview' ? 'Overview' : t === 'transactions' ? 'Transactions' : 'Notes';
    var active = tab === t;
    return '<div onclick="State.mfDetailTab=\'' + t + '\';App.render()" style="flex:1;text-align:center;padding:10px 4px;font-size:13px;font-weight:700;cursor:pointer;border-bottom:2px solid ' + (active ? col : 'transparent') + ';color:' + (active ? col : 'var(--text-dim)') + '">' + lbl + '</div>';
  }).join('');

  var periodTabs = ['1M','3M','6M','1Y','All'].map(function(p) {
    var active = period === p;
    return '<div onclick="State.mfChartPeriod=\'' + p + '\';App.render()" style="padding:5px 10px;border-radius:6px;background:' + (active ? col : 'transparent') + ';color:' + (active ? '#fff' : 'var(--text-dim)') + ';font-size:12px;font-weight:700;cursor:pointer">' + p + '</div>';
  }).join('');

  var navHistory = fund.nav_history || [];
  var latestNav = navHistory.length ? navHistory[navHistory.length - 1] : (fund.nav || 0);

  var navChange = latestNav - firstNav;
  var navChangePct = firstNav > 0 ? (navChange / firstNav * 100) : 0;

  var bodyHtml = '';

    bodyHtml = _mfDetailOverview(fund, id, gc, col, gain, gp, period, periodTabs, navChange, navChangePct);

    + '</div>'

/* ─── EXCHANGE TRADED FUNDS (ETF) MODULE ─────────────── */

function _etfFunds() { return INV_PORTFOLIO.etfs || []; }
function _etfFund(id) { return _etfFunds().find(function(f){ return f.id === id; }) || {}; }
function _etfGain(f) { return (f.current || 0) - (f.invested || 0); }
function _etfGainPct(f) { return f.invested > 0 ? (_etfGain(f) / f.invested * 100) : 0; }
function _etfColor(g) { return g >= 0 ? '#10D078' : '#FF4D6A'; }
function _etfSign(g)  { return g >= 0 ? '+' : ''; }
function _etfInitials(name) {
  return (name || '').split(' ').slice(0, 2).map(function(w){ return w[0] || ''; }).join('').toUpperCase();
}
function _etfFundColor(id) {
  var map = { e1:'#38BDF8', e2:'#818CF8', e3:'#34D399', e4:'#FB923C', e5:'#A78BFA', e6:'#F472B6' };
  return map[id] || '#38BDF8';
}

function _etfNavChart(fund, period) {
  var hist = fund.nav_history || [];
  var sliced = period === '1D' ? hist.slice(-2)
    : period === '1M'  ? hist.slice(-2)
    : period === '3M'  ? hist.slice(-4)
    : period === '6M'  ? hist.slice(-7)
    : period === '1Y'  ? hist
    : period === '3Y'  ? hist
    : period === '5Y'  ? hist
    : hist;
  if (sliced.length < 2) return '';
  var w = 300, h = 90;
  var min = Math.min.apply(null, sliced), max = Math.max.apply(null, sliced);
  var range = max - min || 1;
  var pts = sliced.map(function(v, i) {
    var x = (i / (sliced.length - 1)) * w;
    var y = h - ((v - min) / range) * (h - 12) - 6;
    return x.toFixed(1) + ',' + y.toFixed(1);
  });
  var color = sliced[sliced.length - 1] >= sliced[0] ? '#10D078' : '#FF4D6A';
  var last  = pts[pts.length - 1].split(',');
  var fillPts = pts.join(' ') + ' ' + last[0] + ',' + h + ' 0,' + h;
  return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" style="width:100%;height:' + h + 'px">'
    + '<defs><linearGradient id="etfGrad" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0%" stop-color="' + color + '" stop-opacity="0.4"/>'
      + '<stop offset="100%" stop-color="' + color + '" stop-opacity="0"/>'
    + '</linearGradient></defs>'
    + '<polygon points="' + fillPts + '" fill="url(#etfGrad)"/>'
    + '<polyline points="' + pts.join(' ') + '" fill="none" stroke="' + color + '" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="4" fill="' + color + '"/>'
    + '</svg>';
}
