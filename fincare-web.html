<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Fincare — Personal Finance</title>
  <meta name="theme-color" content="#08082A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <style>
    /* ───────────────────────────────────────────────────────
       CSS TOKENS  (mirror React-Native T object)
    ─────────────────────────────────────────────────────── */
    :root {
      --bg:         #08082A;
      --card:       #12123A;
      --card2:      #1A1A48;
      --primary:    #6C47FF;
      --primary-dim:rgba(108,71,255,0.18);
      --success:    #22C55E;
      --success-dim:rgba(34,197,94,0.15);
      --danger:     #EF4444;
      --danger-dim: rgba(239,68,68,0.15);
      --info:       #60A5FA;
      --info-dim:   rgba(96,165,250,0.15);
      --warn:       #F59E0B;
      --warn-dim:   rgba(245,158,11,0.15);
      --text:       #FFFFFF;
      --text-dim:   #A0A3BD;
      --border:     rgba(255,255,255,0.07);
      --grad-from:  #5B2FBF;
      --grad-to:    #7C5CE7;
      --radius:     18px;
      --radius-sm:  12px;
      --shadow:     0 4px 24px rgba(0,0,0,0.45);
    }

    /* ───────────────────────────────────────────────────────
       RESET & BASE
    ─────────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #04041A;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    /* ───────────────────────────────────────────────────────
       PHONE CHROME  (desktop: centered phone frame)
    ─────────────────────────────────────────────────────── */
    #phone-frame {
      position: relative;
      margin: 0 auto;
      width: 100%;
      max-width: 430px;
      height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    @media (min-width: 500px) {
      body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
      #phone-frame {
        height: 92dvh;
        max-height: 900px;
        border-radius: 40px;
        box-shadow: 0 0 0 10px #1a1a1a, 0 40px 80px rgba(0,0,0,0.7);
        overflow: hidden;
      }
    }

    /* ───────────────────────────────────────────────────────
       SCREEN CONTAINER
    ─────────────────────────────────────────────────────── */
    #screen {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }
    #screen::-webkit-scrollbar { display: none; }

    /* ───────────────────────────────────────────────────────
       BOTTOM NAV TAB BAR
    ─────────────────────────────────────────────────────── */
    #tab-bar {
      height: 68px;
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: stretch;
      flex-shrink: 0;
      padding-bottom: env(safe-area-inset-bottom, 0);
    }
    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      color: var(--text-dim);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.3px;
      transition: color 0.2s;
      -webkit-tap-highlight-color: transparent;
      padding: 8px 0;
    }
    .tab-item.active { color: var(--primary); }
    .tab-icon-wrap {
      width: 32px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 10px;
      transition: background 0.2s;
    }
    .tab-item.active .tab-icon-wrap { background: var(--primary-dim); }
    .tab-icon { width: 22px; height: 22px; }

    /* ───────────────────────────────────────────────────────
       COMMON UI PRIMITIVES
    ─────────────────────────────────────────────────────── */

    /* Screen wrapper */
    .screen-wrap {
      min-height: 100%;
      padding-bottom: 24px;
      animation: fadeIn 0.25s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    /* Section */
    .section { margin-bottom: 22px; }

    /* Section header */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; margin-bottom: 12px;
    }
    .section-title { color: var(--text); font-size: 17px; font-weight: 700; }
    .view-all { color: var(--primary); font-size: 13px; font-weight: 600; cursor: pointer; }
    .view-all:hover { opacity: 0.8; }

    /* Card */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
    }

    /* Pill / Badge */
    .pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 10px; border-radius: 999px;
      font-size: 11px; font-weight: 700;
    }
    .pill-success { background: var(--success-dim); color: var(--success); }
    .pill-danger  { background: var(--danger-dim);  color: var(--danger);  }
    .pill-info    { background: var(--info-dim);    color: var(--info);    }
    .pill-warn    { background: var(--warn-dim);    color: var(--warn);    }
    .pill-primary { background: var(--primary-dim); color: var(--primary); }
    .pill-dim     { background: rgba(255,255,255,0.08); color: var(--text-dim); }

    /* Button */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      border: none; cursor: pointer; font-weight: 700;
      border-radius: var(--radius-sm); transition: opacity 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { transform: scale(0.97); opacity: 0.9; }
    .btn-primary {
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      color: #fff; padding: 14px 24px; font-size: 15px;
    }
    .btn-outline {
      background: transparent; border: 1.5px solid var(--primary);
      color: var(--primary); padding: 12px 20px; font-size: 14px;
    }
    .btn-ghost {
      background: var(--card); color: var(--text);
      padding: 10px 16px; font-size: 13px;
    }

    /* Icon button */
    .icon-btn {
      width: 40px; height: 40px; border-radius: 20px;
      background: var(--card); border: none; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--text); transition: background 0.2s, transform 0.1s;
      flex-shrink: 0;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { transform: scale(0.93); }

    /* Progress bar */
    .progress-wrap { background: rgba(255,255,255,0.1); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; transition: width 0.5s ease; }

    /* Divider */
    .divider { border: none; border-top: 1px solid var(--border); margin: 0; }

    /* List row */
    .list-row {
      display: flex; align-items: center; padding: 14px 16px; gap: 12px; cursor: pointer;
      transition: background 0.15s;
    }
    .list-row:active { background: rgba(255,255,255,0.04); }
    .list-icon {
      width: 42px; height: 42px; border-radius: 21px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .list-body { flex: 1; min-width: 0; }
    .list-title { color: var(--text); font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-sub   { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
    .list-right { text-align: right; flex-shrink: 0; }
    .list-amount { font-size: 14px; font-weight: 700; }
    .list-date   { color: var(--text-dim); font-size: 11px; margin-top: 2px; }

    /* ───────────────────────────────────────────────────────
       HEADER (screen-specific)
    ─────────────────────────────────────────────────────── */
    .page-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 52px 20px 16px;
    }
    .page-title { color: var(--text); font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
    .page-sub   { color: var(--text-dim); font-size: 13px; margin-top: 3px; }

    /* ───────────────────────────────────────────────────────
       DASHBOARD  –  NET WORTH HERO CARD
    ─────────────────────────────────────────────────────── */
    .hero-card {
      margin: 0 20px 18px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--grad-from) 0%, var(--grad-to) 60%, #9B7AFF 100%);
      padding: 22px;
      box-shadow: 0 8px 32px rgba(108,71,255,0.35);
    }
    .hero-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .hero-label {
      color: rgba(255,255,255,0.78); font-size: 12px; font-weight: 500;
      display: flex; align-items: center; gap: 5px;
    }
    .hero-amount {
      color: #fff; font-size: 32px; font-weight: 800;
      margin: 8px 0 6px; letter-spacing: -1px;
    }
    .hero-delta { font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    .hero-delta-abs { font-size: 12px; font-weight: 600; margin-top: 2px; }
    .hero-stats {
      display: flex; gap: 8px; margin-top: 18px;
      background: rgba(255,255,255,0.10);
      border-radius: 14px; padding: 10px;
    }
    .stat-pill {
      flex: 1; display: flex; align-items: center; gap: 8px; padding: 4px 6px;
    }
    .stat-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .stat-info {}
    .stat-value { color: #fff; font-size: 13px; font-weight: 700; }
    .stat-delta { font-size: 10px; font-weight: 600; margin-top: 1px; }

    /* Mini sparkline SVG */
    .sparkline { flex-shrink: 0; }

    /* ───────────────────────────────────────────────────────
       DASHBOARD  –  QUICK ACTIONS
    ─────────────────────────────────────────────────────── */
    .quick-row {
      display: flex; gap: 10px; padding: 0 20px; margin-bottom: 22px;
    }
    .qa-card {
      flex: 1; background: var(--card); border-radius: var(--radius);
      padding: 18px 10px; display: flex; flex-direction: column;
      align-items: center; gap: 10px; cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      transition: transform 0.15s, opacity 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .qa-card:active { transform: scale(0.96); }
    .qa-icon {
      width: 52px; height: 52px; border-radius: 26px;
      display: flex; align-items: center; justify-content: center;
    }
    .qa-label { color: var(--text); font-size: 12px; font-weight: 600; }

    /* ───────────────────────────────────────────────────────
       DASHBOARD  –  ACCOUNT CARDS (horizontal scroll)
    ─────────────────────────────────────────────────────── */
    .account-scroll {
      display: flex; gap: 12px;
      padding: 0 20px; overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .account-scroll::-webkit-scrollbar { display: none; }
    .acct-card {
      min-width: 154px; background: var(--card); border-radius: var(--radius);
      padding: 16px; cursor: pointer; flex-shrink: 0;
      transition: transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .acct-card:active { transform: scale(0.97); }
    .acct-icon {
      width: 40px; height: 40px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
    }
    .acct-title { color: var(--text); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .acct-amount { font-size: 17px; font-weight: 800; margin-bottom: 4px; }
    .acct-sub { color: var(--text-dim); font-size: 11px; }
    .acct-add {
      border: 1.5px dashed rgba(108,71,255,0.45);
      background: transparent !important;
      align-items: center; justify-content: center;
    }

    /* ───────────────────────────────────────────────────────
       DASHBOARD  –  LIST CARDS (reminders & transactions)
    ─────────────────────────────────────────────────────── */
    .list-card { background: var(--card); margin: 0 20px; border-radius: var(--radius); overflow: hidden; }

    /* ───────────────────────────────────────────────────────
       FILTER PILLS (top of dashboard)
    ─────────────────────────────────────────────────────── */
    .filter-row { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 16px; }
    .filter-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--card); padding: 9px 16px; border-radius: 50px;
      color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .filter-pill:active { opacity: 0.8; }

    /* ───────────────────────────────────────────────────────
       AVATAR / HEADER
    ─────────────────────────────────────────────────────── */
    .dash-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 52px 20px 16px;
    }
    .dash-left { display: flex; align-items: center; gap: 12px; cursor: pointer; flex: 1; min-width: 0; }
    .avatar {
      width: 44px; height: 44px; border-radius: 22px;
      background: var(--primary); display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 18px; font-weight: 700; flex-shrink: 0;
    }
    .dash-title { color: var(--text); font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
    .dash-sub   { color: var(--text-dim); font-size: 13px; margin-top: 3px; }
    .dash-right { display: flex; gap: 10px; }
    .notif-badge {
      position: absolute; top: 4px; right: 4px;
      min-width: 16px; height: 16px; border-radius: 8px;
      background: var(--danger); color: #fff;
      font-size: 9px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
      padding: 0 4px;
      border: 1.5px solid var(--bg);
    }

    /* ───────────────────────────────────────────────────────
       MODAL / OVERLAY
    ─────────────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      display: flex; align-items: flex-end; justify-content: center;
      z-index: 200; animation: overlayIn 0.2s ease;
    }
    @keyframes overlayIn { from { opacity: 0; } to { opacity: 1; } }
    .modal-sheet {
      background: var(--card); border-radius: 24px 24px 0 0;
      padding: 24px; width: 100%; max-width: 430px;
      animation: sheetUp 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      max-height: 85dvh; overflow-y: auto;
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle {
      width: 36px; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.2); margin: 0 auto 20px;
    }
    .modal-title { color: var(--text); font-size: 18px; font-weight: 700; margin-bottom: 20px; }

    /* ───────────────────────────────────────────────────────
       LOGIN SCREEN
    ─────────────────────────────────────────────────────── */
    .login-wrap {
      display: flex; flex-direction: column;
      min-height: 100%; padding: 60px 28px 40px;
    }
    .login-logo {
      text-align: center; margin-bottom: 48px;
    }
    .login-logo-icon {
      width: 72px; height: 72px; border-radius: 22px;
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 8px 32px rgba(108,71,255,0.4);
    }
    .login-app-name {
      color: var(--text); font-size: 28px; font-weight: 800; letter-spacing: -0.5px;
    }
    .login-tagline { color: var(--text-dim); font-size: 14px; margin-top: 6px; }
    .form-group { margin-bottom: 16px; }
    .form-label { color: var(--text-dim); font-size: 12px; font-weight: 600; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase; }
    .form-input {
      width: 100%; background: var(--card); border: 1.5px solid var(--border);
      border-radius: var(--radius-sm); padding: 14px 16px;
      color: var(--text); font-size: 15px;
      outline: none; transition: border-color 0.2s;
    }
    .form-input:focus { border-color: var(--primary); }
    .form-input::placeholder { color: var(--text-dim); }
    .login-btn { width: 100%; margin-top: 8px; border-radius: var(--radius-sm); }
    .login-footer { text-align: center; margin-top: 24px; color: var(--text-dim); font-size: 14px; }
    .login-link { color: var(--primary); font-weight: 600; cursor: pointer; }

    /* ───────────────────────────────────────────────────────
       TOAST NOTIFICATION
    ─────────────────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      background: rgba(30,30,60,0.95); color: #fff;
      padding: 12px 24px; border-radius: 999px;
      font-size: 14px; font-weight: 500; z-index: 300;
      pointer-events: none; opacity: 0; transition: opacity 0.3s;
      white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      max-width: 90%;
    }
    #toast.show { opacity: 1; }

    /* ───────────────────────────────────────────────────────
       LOADING SPINNER
    ─────────────────────────────────────────────────────── */
    .spinner {
      width: 40px; height: 40px; border-radius: 50%;
      border: 3px solid rgba(108,71,255,0.25);
      border-top-color: var(--primary);
      animation: spin 0.7s linear infinite;
      margin: 60px auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ───────────────────────────────────────────────────────
       EMPTY STATE
    ─────────────────────────────────────────────────────── */
    .empty-state {
      text-align: center; padding: 40px 20px; color: var(--text-dim);
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; }
    .empty-title { color: var(--text); font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .empty-sub { font-size: 13px; line-height: 1.5; }

    /* ───────────────────────────────────────────────────────
       SVG ICONS  (inline utility class)
    ─────────────────────────────────────────────────────── */
    svg { display: block; }

    /* ───────────────────────────────────────────────────────
       ACCOUNTS / WEALTH MODULE
    ─────────────────────────────────────────────────────── */

    /* Overview summary hero */
    .wealth-hero {
      margin: 0 20px 20px;
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
    }
    .wealth-hero-total { color: var(--text-dim); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
    .wealth-hero-amount { color: var(--text); font-size: 30px; font-weight: 800; letter-spacing: -1px; margin-bottom: 14px; }
    .wealth-sub-row { display: flex; gap: 0; }
    .wealth-sub-cell { flex: 1; padding: 12px 14px; border-radius: var(--radius-sm); }
    .wealth-sub-label { color: var(--text-dim); font-size: 11px; font-weight: 500; margin-bottom: 4px; }
    .wealth-sub-val { font-size: 16px; font-weight: 700; }

    /* Account group rows */
    .acct-group-list { background: var(--card); margin: 0 20px; border-radius: var(--radius); overflow: hidden; }
    .acct-group-row {
      display: flex; align-items: center; padding: 16px; gap: 14px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .acct-group-row:last-child { border-bottom: none; }
    .acct-group-row:active { background: rgba(255,255,255,0.04); }
    .acct-group-icon {
      width: 44px; height: 44px; border-radius: 22px;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .acct-group-info { flex: 1; min-width: 0; }
    .acct-group-name { color: var(--text); font-size: 15px; font-weight: 600; }
    .acct-group-sub  { color: var(--text-dim); font-size: 12px; margin-top: 2px; }
    .acct-group-bal  { font-size: 16px; font-weight: 700; text-align: right; }

    /* Advanced features grid */
    .adv-grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 20px; }
    .adv-card {
      flex: 0 0 calc(50% - 5px); background: var(--card); border-radius: var(--radius-sm);
      padding: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer;
      transition: opacity 0.15s;
    }
    .adv-card:active { opacity: 0.7; }
    .adv-card-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .adv-card-label { color: var(--text); font-size: 12px; font-weight: 600; line-height: 1.3; }

    /* ─── Account Detail screen ─── */
    .acct-detail-hero {
      margin: 0 20px 18px;
      background: linear-gradient(135deg, var(--grad-from), var(--grad-to));
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 8px 32px rgba(108,71,255,0.35);
    }
    .acct-detail-name  { color: rgba(255,255,255,0.85); font-size: 13px; font-weight: 500; }
    .acct-detail-bank  { color: rgba(255,255,255,0.6); font-size: 12px; margin-top: 2px; }
    .acct-detail-bal   { color: #fff; font-size: 30px; font-weight: 800; margin: 10px 0 4px; letter-spacing: -1px; }
    .acct-detail-badge {
      display: inline-flex; align-items: center; gap: 4px;
      background: rgba(34,197,94,0.2); border: 1px solid rgba(34,197,94,0.4);
      color: var(--success); font-size: 11px; font-weight: 700;
      padding: 3px 10px; border-radius: 999px;
    }

    /* Quick action buttons (Send / Statement / Edit / More) */
    .quick-acts { display: flex; gap: 8px; justify-content: space-between; margin: 0 20px 18px; }
    .quick-act {
      flex: 1; background: var(--card); border-radius: var(--radius-sm);
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      padding: 14px 4px; cursor: pointer;
      transition: background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .quick-act:active { background: var(--card2); }
    .quick-act-icon  { width: 38px; height: 38px; border-radius: 19px; display: flex; align-items: center; justify-content: center; }
    .quick-act-label { color: var(--text); font-size: 11px; font-weight: 600; text-align: center; }

    /* Account info table */
    .info-table { background: var(--card); margin: 0 20px 14px; border-radius: var(--radius); overflow: hidden; }
    .info-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 16px; border-bottom: 1px solid var(--border);
    }

/* ══════════════════════════════════════════════════════
   4. UTILITY FUNCTIONS
══════════════════════════════════════════════════════ */
function daysFromNow(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d.toISOString().split('T')[0];
}

function formatINR(n) {
  if (n == null || isNaN(n)) return '₹0';
  const abs = Math.abs(n);
  let s;
  if (abs >= 1e7)       s = (abs / 1e7).toFixed(2) + ' Cr';
  else if (abs >= 1e5)  s = (abs / 1e5).toFixed(2) + ' L';
  else s = abs.toLocaleString('en-IN');
  return (n < 0 ? '-' : '') + '₹' + s;
}

function formatINRFull(n) {
  if (n == null || isNaN(n)) return '₹0';
  return (n < 0 ? '-' : '') + '₹' + Math.abs(n).toLocaleString('en-IN');
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.getDate() + ' ' + MONTHS[d.getMonth()];
}

function daysUntil(iso) {
  if (!iso) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  const then = new Date(iso); then.setHours(0,0,0,0);
  return Math.ceil((then - now) / 86400000);
}

function dueBadge(days) {
  if (days === null) return '';
  if (days < 0)  return `<span class="pill pill-danger">${Math.abs(days)}d overdue</span>`;
  if (days === 0) return `<span class="pill pill-danger">Due today</span>`;
  if (days <= 2)  return `<span class="pill pill-warn">Due in ${days}d</span>`;
  return `<span class="pill pill-dim">Due in ${days}d</span>`;
}

function userInitial() {
  const name = (State.user || DEMO.user).name || 'U';
  return name.charAt(0).toUpperCase();
}

function greeting() {
  const h = new Date().getHours();
  return h < 12 ? 'Good Morning' : h < 17 ? 'Good Afternoon' : 'Good Evening';
}

function pct(spent, budget) {
  if (!budget) return 0;
  return Math.min(100, Math.round((spent / budget) * 100));
}

function progressColor(p) {
  if (p >= 100) return COLORS.danger;
  if (p >= 80)  return COLORS.warn;
  return COLORS.success;
}

/* ══════════════════════════════════════════════════════
   5. SVG CHART HELPERS
══════════════════════════════════════════════════════ */
function sparklineSVG(data, w, h, color, fill) {
  if (!data || data.length < 2) return '';
  const max = Math.max(...data, 1);
  const min = Math.min(...data, 0);
  const range = max - min || 1;
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  });
  const path = pts.join(' ');
  const fillPath = fill
    ? `M${pts[0]} ${pts.slice(1).map(p => 'L'+p).join(' ')} L${w},${h} L0,${h} Z`
    : '';
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    ${fill ? `<path d="${fillPath}" fill="${color}" fill-opacity="0.15"/>` : ''}
    <polyline points="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function donutSVG(slices, r, size) {
  // slices: [{value, color}]
  const cx = size / 2, cy = size / 2;
  const total = slices.reduce((s, x) => s + x.value, 0) || 1;
  let angle = -90;
  let paths = '';
  slices.forEach(sl => {
    const sweep = (sl.value / total) * 360;
    const startRad = angle * Math.PI / 180;
    const endRad   = (angle + sweep) * Math.PI / 180;
    const x1 = cx + r * Math.cos(startRad);
    const y1 = cy + r * Math.sin(startRad);
    const x2 = cx + r * Math.cos(endRad);
    const y2 = cy + r * Math.sin(endRad);
    const largeArc = sweep > 180 ? 1 : 0;
    paths += `<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc},1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${sl.color}" opacity="0.9"/>`;
    angle += sweep;
  });
  // inner circle cutout
  paths += `<circle cx="${cx}" cy="${cy}" r="${r * 0.58}" fill="var(--card)"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${paths}</svg>`;
}

function barChartSVG(bars, w, h, colors) {
  // bars: [{label, values:[v1,v2]}], colors:[c1,c2]
  if (!bars.length) return '';
  const allVals = bars.flatMap(b => b.values);
  const max = Math.max(...allVals, 1);
  const barW   = (w - (bars.length + 1) * 4) / (bars.length * colors.length);
  const labelH = 20;
  const chartH = h - labelH;
  let svgContent = '';
  bars.forEach((bar, i) => {
    bar.values.forEach((val, j) => {
      const x = 4 + i * (barW * colors.length + 4) + j * barW;
      const bh = (val / max) * (chartH - 8);
      const y  = chartH - bh;
      svgContent += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" fill="${colors[j]}" opacity="0.9"/>`;
    });
    // label
    const labelX = 4 + i * (barW * colors.length + 4) + barW * colors.length / 2;
    svgContent += `<text x="${labelX.toFixed(1)}" y="${h - 3}" text-anchor="middle" font-size="9" fill="var(--text-dim)">${bar.label}</text>`;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${svgContent}</svg>`;
}

/* ══════════════════════════════════════════════════════
   6. API LAYER  (with demo fallback)
══════════════════════════════════════════════════════ */
async function apiGet(path) {
  if (!State.token) return null;
  try {
    const res = await fetch(API_BASE + path, {
      headers: { 'Authorization': 'Bearer ' + State.token }
    });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch { return null; }
}

async function apiPost(path, body) {
  if (!State.token) return null;
  try {
    const res = await fetch(API_BASE + path, {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + State.token, 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(res.status);
    return await res.json();
  } catch { return null; }
}

async function loadDashboardData() {
  // Try real API first, fall back to demo data
  const [dash, accts, rems] = await Promise.all([
    apiGet('/dashboard'),
    apiGet('/accounts'),
    apiGet('/reminders'),
  ]);
  const now = new Date();
  const txArr = await Promise.all([
    apiGet(`/income?month=${now.getMonth()+1}&year=${now.getFullYear()}`),
    apiGet(`/expenses?month=${now.getMonth()+1}&year=${now.getFullYear()}`),
  ]);
  const income = txArr[0] || [];
  const exp    = txArr[1] || [];
  const all = [
    ...income.map(i => ({ ...i, _type: 'income',  id: i.income_id   || i.id })),
    ...exp.map(e    => ({ ...e, _type: 'expense', id: e.expense_id  || e.id })),
  ].sort((a,b) => new Date(b.date) - new Date(a.date)).slice(0, 5);

  State.data.dashboard   = dash  || DEMO.dashboard;
  State.data.accounts    = accts || DEMO.accounts;
  State.data.reminders   = rems  || DEMO.reminders;
  State.data.recentTx    = all.length ? all : DEMO.transactions.slice(0, 5);
}

  const incDeltaPct = d.income_delta_pct   ?? 5.2;
  const expDeltaPct = d.expense_delta_pct  ?? -2.1;
  const savDeltaPct = d.savings_delta_pct  ?? 18.4;
  const incUp = incDeltaPct >= 0;
  const expUp = expDeltaPct > 0;
  const savUp = savDeltaPct >= 0;

  // Sparkline data (simulate trend)
  const sparkData = [
    totalBalance * 0.72, totalBalance * 0.78, totalBalance * 0.81,
    totalBalance * 0.86, totalBalance * 0.91, totalBalance * 0.96, totalBalance
  ];

  // Build account groups
  const groups = { bank: {icon:'bank',label:'Bank Accounts',color:COLORS.info,total:0,count:0},

                   upi:  {icon:'phone',label:'UPI',color:'#7B4FEF',total:0,count:0},
                   ovrd: {icon:'card',label:'Overdraft',color:COLORS.danger,total:0,count:0} };
  acc.forEach(a => {
    const bal = a.balance ?? a.initial_balance ?? 0;
    let key = 'bank';
    if (a.account_type === 'cash' || a.account_type === 'wallet') key = 'cash';
    else if (a.account_type === 'upi') key = 'upi';
    if (bal < 0) key = 'ovrd';
    groups[key].total += bal;
    groups[key].count += 1;

  const acctCards = Object.values(groups).filter(g => g.count > 0);

  // Build reminder rows
  const remHtml = rem.slice(0,4).map((r, i) => {

    const daysLabel = days === null ? '' : days < 0 ? `${Math.abs(days)}d overdue` : days === 0 ? 'Due today' : `Due in ${days}d`;
    const dayColor  = days !== null && days <= 0 ? COLORS.danger : days !== null && days <= 2 ? COLORS.warn : 'var(--text-dim)';
    const amt = r.amount || 0;
    return `
    <div class="list-row" onclick="App.navigate('reminders')" ${i < rem.slice(0,4).length-1 ? 'style="border-bottom:1px solid var(--border)"' : ''}>
      <div class="list-icon" style="background:${typeColor}22">

  // Build recent tx rows
  const txHtml = tx.slice(0,5).map((t, i) => {
    const isInc  = t._type === 'income';
    const isTxfr = t._type === 'transfer';
    const color  = isTxfr ? COLORS.info : isInc ? COLORS.success : COLORS.danger;
    const icon   = isTxfr ? 'swap' : isInc ? 'arrow_dn' : 'arrow_up';
    const title  = isTxfr ? 'Transfer' : (t.source || t.description || t.category || 'Transaction');
    const sub    = t.category || (isInc ? 'Income' : 'Expense');
    const amtStr = isTxfr ? formatINR(t.amount) : `${isInc?'+':'-'}${formatINR(t.amount)}`;
    return `
    <div class="list-row" onclick="App.navigate('transactions')" ${i < tx.slice(0,5).length-1 ? 'style="border-bottom:1px solid var(--border)"' : ''}>
      <div class="list-icon" style="background:${color}22">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="${color}">${ICON[icon].match(/<path[^>]*\/>/g).join('')}</svg>
      </div>
      <div class="list-body">
        <div class="list-title">${title}</div>
        <div class="list-sub">${sub}</div>
      </div>
      <div class="list-right">
        <div class="list-amount" style="color:${color}">${amtStr}</div>
        <div class="list-date">${formatDate(t.date)}</div>
      </div>
    </div>`;

  return `

    <div class="dash-header">
      <div class="dash-left" onclick="App.navigate('more')">
        <div class="avatar">${userInitial()}</div>
        <div>
          <div class="dash-title">Dashboard</div>
          <div class="dash-sub">${greeting()}, ${u.name.split(' ')[0]}! 👋</div>
        </div>
      </div>
      <div class="dash-right">
        <div class="icon-btn pos-rel" onclick="App.navigate('reminders')">
          ${ICON.bell}
          ${rem.length > 0 ? `<div class="notif-badge">${rem.length > 9 ? '9+' : rem.length}</div>` : ''}
        </div>
        <div class="icon-btn" onclick="App.showToast('Dashboard settings coming soon!')">
          ${ICON.settings}
        </div>
      </div>
    </div>

    <!-- Filter row -->
    <div class="filter-row">
      <div class="filter-pill">👥 All Members</div>
      <div class="filter-pill" onclick="App.navigate('reports')">📅 This Month</div>
    </div>

    <!-- Net Worth Hero -->
    <div class="hero-card">
      <div class="hero-top">
        <div style="flex:1">
          <div class="hero-label">Total Net Worth ${ICON.info.replace('currentColor','rgba(255,255,255,0.5)')}</div>
          <div class="hero-amount">${formatINRFull(totalBalance)}</div>
          <div class="hero-delta" style="color:${nwUp?'#9DFFD9':'#FFB4BE'}">
            ${nwUp?'▲':'▼'} ${Math.abs(nwDeltaPct)}% vs last month
          </div>
          <div class="hero-delta-abs" style="color:${nwUp?'#9DFFD9':'#FFB4BE'}">
            ${nwUp?'▲ +':'▼ '}${formatINR(Math.abs(nwDeltaAbs))} this month
          </div>
        </div>
        <div class="sparkline">
          ${sparklineSVG(sparkData, 110, 56, '#FFFFFF', true)}
        </div>
      </div>
      <div class="hero-stats">
        <div class="stat-pill">
          <div class="stat-dot" style="background:${COLORS.success}"></div>
          <div class="stat-info">
            <div class="stat-value">${formatINR(monthlyIncome)}</div>
            <div class="stat-delta" style="color:${incUp?COLORS.success:COLORS.danger}">${incUp?'▲':'▼'} ${Math.abs(incDeltaPct)}%</div>
          </div>
        </div>
        <div class="stat-pill">
          <div class="stat-dot" style="background:${COLORS.danger}"></div>
          <div class="stat-info">
            <div class="stat-value">${formatINR(monthlyExpenses)}</div>
            <div class="stat-delta" style="color:${expUp?COLORS.danger:COLORS.success}">${expUp?'▲':'▼'} ${Math.abs(expDeltaPct)}%</div>
          </div>
        </div>
        <div class="stat-pill">
          <div class="stat-dot" style="background:${COLORS.info}"></div>
          <div class="stat-info">
            <div class="stat-value">${formatINR(savings)}</div>
            <div class="stat-delta" style="color:${savUp?COLORS.success:COLORS.danger}">${savUp?'▲':'▼'} ${Math.abs(savDeltaPct)}%</div>
          </div>

    </div>

    <!-- Quick Actions -->
    <div class="quick-row">
      <div class="qa-card" onclick="App.navigate('add-transaction',{type:'income'})">
        <div class="qa-icon" style="background:${COLORS.success}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
        <div class="qa-label">Income</div>
      </div>
      <div class="qa-card" onclick="App.navigate('add-transaction',{type:'expense'})">
        <div class="qa-icon" style="background:${COLORS.danger}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M19 13H5v-2h14v2z"/></svg>
        </div>
        <div class="qa-label">Expense</div>
      </div>
      <div class="qa-card" onclick="App.navigate('add-transaction',{type:'transfer'})">
        <div class="qa-icon" style="background:${COLORS.info}">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
        </div>
        <div class="qa-label">Transfer</div>
      </div>
    </div>

    <!-- Accounts -->
    <div class="section">
      <div class="section-header">
        <div class="section-title">Accounts</div>
        <div class="view-all" onclick="App.goTab('wealth')">View All</div>
      </div>
      <div class="account-scroll">
        ${acctCards.map(g => `
          <div class="acct-card" onclick="App.goTab('wealth')">
            <div class="acct-icon" style="background:${g.color}22">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="${g.color}">${(ICON[g.icon]||ICON.bank).match(/<path[^>]*\/>/g).join('')}</svg>

          <svg width="28" height="28" viewBox="0 0 24 24" fill="var(--primary)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>

    ${rem.length > 0 ? `

/* ─── TRANSACTIONS ───────────────────────────────────── */
function renderTransactions() {
  const allTx  = DEMO.transactions; // fallback to demo
  const accts  = State.data.accounts || DEMO.accounts;
  const filter = State.txFilter || 'all';
  const month  = State.txMonth ?? new Date().getMonth();
  const year   = State.txYear  ?? new Date().getFullYear();

  // Filter by month/year
  const inPeriod = allTx.filter(t => {
    const d = new Date(t.date);
    return d.getMonth() === month && d.getFullYear() === year;
  });

  // Summary
  const totalIncome  = inPeriod.filter(t => t._type === 'income').reduce((s,t) => s + t.amount, 0);
  const totalExpense = inPeriod.filter(t => t._type === 'expense').reduce((s,t) => s + t.amount, 0);

  // Filtered list
  const filtered = filter === 'all' ? inPeriod
    : inPeriod.filter(t => t._type === filter);

  // Group by date
  const grouped = {};
  filtered.forEach(t => {
    const dk = t.date ? t.date.slice(0,10) : 'Unknown';
    if (!grouped[dk]) grouped[dk] = [];
    grouped[dk].push(t);
  });
  const dateKeys = Object.keys(grouped).sort((a,b) => b.localeCompare(a));

  const txRows = dateKeys.map(dk => {
    const dayTxs = grouped[dk];
    const dateLabel = (() => {
      const d = new Date(dk);
      const today = new Date(); today.setHours(0,0,0,0);
      const diff = Math.round((d - today) / 86400000);
      if (diff === 0)  return 'Today';
      if (diff === -1) return 'Yesterday';
      return d.getDate() + ' ' + MONTHS_FULL[d.getMonth()];
    })();

    const rows = dayTxs.map((t, i) => {
      const isInc  = t._type === 'income';
      const isTxfr = t._type === 'transfer';
      const color  = isTxfr ? COLORS.info : isInc ? COLORS.success : COLORS.danger;
      const iconSvg = isTxfr ? ICON.swap : isInc ? ICON.arrow_dn : ICON.arrow_up;
      const title  = isTxfr ? 'Transfer' : (t.source || t.description || t.category || 'Transaction');
      const acct   = accts.find(a => a.account_id === t.account_id);
      const sub    = [t.category, acct ? acct.name : ''].filter(Boolean).join(' · ');
      const amtStr = isTxfr ? formatINR(t.amount) : `${isInc?'+':'-'}${formatINR(t.amount)}`;
      return `
      <div class="list-row" onclick="App.openTxDetail('${t.id}')" ${i < dayTxs.length-1 ? 'style="border-bottom:1px solid var(--border)"':''}>
        <div class="list-icon" style="background:${color}22">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="${color}">${iconSvg.match(/<path[^>]*\/>/g).join('')}</svg>
        </div>
        <div class="list-body">
          <div class="list-title">${title}</div>
          <div class="list-sub">${sub}</div>
        </div>
        <div class="list-right">
          <div class="list-amount" style="color:${color}">${amtStr}</div>
          <div class="list-date">${t.date ? new Date(t.date).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}) : ''}</div>
        </div>
      </div>`;
    }).join('');

    return `<div class="tx-date-header">${dateLabel}</div><div class="list-card" style="margin:0 20px 10px">${rows}</div>`;
  }).join('');

  const prevMonth = () => {
    let m = month - 1, y = year;
    if (m < 0) { m = 11; y--; }
    State.txMonth = m; State.txYear = y; App.render();
  };
  const nextMonth = () => {
    let m = month + 1, y = year;
    if (m > 11) { m = 0; y++; }
    State.txMonth = m; State.txYear = y; App.render();
  };

  return `
  <div class="screen-wrap" style="padding-bottom:80px">
    <!-- Header -->
    <div class="page-header" style="padding-bottom:10px">
      <div>
        <div class="page-title">Transactions</div>
      </div>
      <div class="icon-btn" onclick="App.navigate('add-transaction',{type:'expense'})">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
      </div>
    </div>

    <!-- Month Navigator -->
    <div class="month-nav">
      <button class="month-btn" onclick="(${prevMonth.toString()})()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      </button>
      <div class="month-label">${MONTHS_FULL[month]} ${year}</div>
      <button class="month-btn" onclick="(${nextMonth.toString()})()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
      </button>
    </div>

    <!-- Summary Cards -->
    <div class="tx-summary">
      <div class="tx-sum-card">
        <div class="tx-sum-label">Income</div>
        <div class="tx-sum-value text-success">${formatINR(totalIncome)}</div>
      </div>
      <div class="tx-sum-card">
        <div class="tx-sum-label">Expenses</div>
        <div class="tx-sum-value text-danger">${formatINR(totalExpense)}</div>
      </div>
    </div>

    <!-- Filter Chips -->
    <div class="chip-bar">
      ${['all','income','expense','transfer'].map(f => `
        <div class="chip ${filter===f?'active':''}" onclick="State.txFilter='${f}';App.render()">
          ${f.charAt(0).toUpperCase()+f.slice(1)}
        </div>`).join('')}
    </div>

    <!-- Grouped Transactions -->
    ${filtered.length === 0
      ? `<div class="empty-state">
          <div class="empty-icon">📭</div>
          <div class="empty-title">No transactions</div>
          <div class="empty-sub">No ${filter==='all'?'':filter} transactions in ${MONTHS_FULL[month]}.</div>
        </div>`
      : txRows}

    <!-- FAB -->
    <button class="fab" onclick="App.navigate('add-transaction',{type:'expense'})">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="white"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </button>
  </div>`;
}

function getAccountGroups(accounts) {
  const groups = {};
  accounts.forEach(a => {
    let key = a.account_type;
    if (key === 'wallet') key = 'wallet';
    if (!groups[key]) groups[key] = { total: 0, count: 0, accounts: [] };
    groups[key].total += a.balance;
    groups[key].count += 1;
    groups[key].accounts.push(a);
  });
  return groups;
}

/* ─── ACCOUNT DETAIL ─────────────────────────────────── */
function renderAccountDetail() {
  const id   = State.viewAcctId || State.params.id;
  const accts = State.data.accounts || DEMO.accounts;
  const a    = accts.find(x => x.account_id === id);
  if (!a) return `<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-title">Account not found</div></div>`;

  const meta    = ACCT_GROUP_META[a.account_type] || ACCT_GROUP_META.bank;
  const acctColor = a.color || meta.color;
  const isLiab  = a.balance < 0;
  const balColor  = isLiab ? '#FFB4BE' : '#9DFFD9';

  // Transactions for this account
  const allTx    = DEMO.transactions;
  const typeF    = State.acctTxTypeFilter || 'all';
  const dateF    = State.acctTxDateFilter || 'month';
  const now      = new Date();
  const acctTxs  = allTx.filter(t => {
    const matchAcct = t.account_id === id || t.to_account_id === id;
    if (!matchAcct) return false;
    const txDate = new Date(t.date);
    if (dateF === 'month') return txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear();
    if (dateF === 'last_month') { const lm = new Date(now.getFullYear(), now.getMonth()-1,1); return txDate.getMonth()===lm.getMonth()&&txDate.getFullYear()===lm.getFullYear(); }
    if (dateF === 'year') return txDate.getFullYear() === now.getFullYear();
    return true;
  }).filter(t => {
    if (typeF === 'all') return true;
    const isCredit = t._type === 'income' || t.to_account_id === id;
    return typeF === 'credit' ? isCredit : !isCredit;
  });

  const sortedTxs = [...acctTxs].sort((a,b) => {
    const s = State.acctSort || 'date';
    if (s === 'amount')   return b.amount - a.amount;
    if (s === 'category') return (a.category||'').localeCompare(b.category||'');
    return new Date(b.date) - new Date(a.date);
  });

  const txRows = sortedTxs.map((t,i) => {
    const isInc  = t._type==='income' || t.to_account_id===id;
    const color  = isInc ? COLORS.success : COLORS.danger;
    const icon   = isInc ? ICON.arrow_dn : ICON.arrow_up;
    const title  = t._type==='transfer' ? (t.to_account_id===id?'Transfer In':'Transfer Out') : (t.source||t.description||t.category||'Transaction');
    const sub    = t.category || (t._type==='transfer'?'Transfer':'');
    const amtStr = `${isInc?'+':'-'}${formatINR(t.amount)}`;
    return `
    <div class="list-row" style="${i<sortedTxs.length-1?'border-bottom:1px solid var(--border)':''}" onclick="App.openTxDetail('${t.id}')">
      <div class="list-icon" style="background:${color}22">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="${color}">${icon.match(/<path[^>]*\/>/g).join('')}</svg>
      </div>
      <div class="list-body">
        <div class="list-title">${title}</div>
        <div class="list-sub">${sub}${t.date?' · '+formatDate(t.date):''}</div>
      </div>
      <div class="list-right">
        <div class="list-amount" style="color:${color}">${amtStr}</div>
        <div class="list-date">${t.date?new Date(t.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):''}</div>
      </div>
    </div>`;
  }).join('');

  // Info rows
  const infoRows = [
    a.account_number ? ['Account Number', a.account_number] : null,
    a.ifsc           ? ['IFSC Code',       a.ifsc]           : null,
    ['Account Holder', a.holder || 'Akshar Mehta'],
    ['Account Type',   (a.sub_type||a.account_type||'').replace(/_/g,' ')],
    a.branch         ? ['Branch',          a.branch]         : null,
    a.upi_id         ? ['UPI ID',          a.upi_id]         : null,
    a.linked_app     ? ['Linked App',      a.linked_app]     : null,
    a.credit_limit   ? ['Credit Limit',    formatINR(a.credit_limit)] : null,
    a.notes          ? ['Notes',           a.notes]          : null,
  ].filter(Boolean);

  const filterPanel = State.showAcctFilter ? `
  <div class="filter-panel">
    <div class="filter-panel-title">
      Filter & Sort
      <span style="cursor:pointer;color:var(--text-dim)" onclick="State.showAcctFilter=false;App.render()">✕</span>
    </div>
    <div class="filter-group-label">Date Range</div>
    <div class="filter-chips-row">
      ${[['month','This Month'],['last_month','Last Month'],['year','This Year'],['all','All Time']].map(([v,l]) => `
        <div class="filter-chip ${State.acctTxDateFilter===v?'active':''}" onclick="State.acctTxDateFilter='${v}';App.render()">${l}</div>`).join('')}
    </div>
    <div class="filter-group-label">Transaction Type</div>
    <div class="filter-chips-row">
      ${[['all','All'],['credit','Credit'],['debit','Debit']].map(([v,l]) => `
        <div class="filter-chip ${State.acctTxTypeFilter===v?'active':''}" onclick="State.acctTxTypeFilter='${v}';App.render()">${l}</div>`).join('')}
    </div>
    <div class="filter-group-label">Sort By</div>
    <div class="filter-chips-row">
      ${[['date','Date'],['amount','Amount'],['category','Category']].map(([v,l]) => `
        <div class="filter-chip ${State.acctSort===v?'active':''}" onclick="State.acctSort='${v}';App.render()">${l}</div>`).join('')}
    </div>
    <div class="filter-btns">
      <button class="btn btn-ghost filter-reset" onclick="State.acctTxTypeFilter='all';State.acctTxDateFilter='month';State.acctSort='date';App.render()">Reset</button>
      <button class="btn btn-primary filter-apply" onclick="State.showAcctFilter=false;App.render()">Apply Filter</button>
    </div>
  </div>` : '';

  return `
  <div class="screen-wrap" style="padding-bottom:32px">
    <!-- Header -->
    <div class="form-header">
      <div class="icon-btn" onclick="App.goTab('wealth')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
      </div>
      <div class="form-header-title">${a.name}</div>
      <div class="icon-btn" onclick="App.openAcctMenu('${a.account_id}')">

      <div class="quick-act" onclick="App.navigate('add-transaction',{type:'transfer',from_id:'${a.account_id}'})">

          <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--info)"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>

        <div class="quick-act-label">Transfer</div>

      <div class="quick-act" onclick="App.exportAccount('${a.account_id}','csv')">

          <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--primary)"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </div>
        <div class="quick-act-label">Edit</div>

    <!-- Account Info -->

      ${infoRows.map(([k,v]) => `
        <div class="info-row">
          <span class="info-label">${k}</span>
          <span class="info-value">${v}</span>
        </div>`).join('')}

    <!-- Action Buttons -->

      <div class="action-btn" onclick="App.navigate('add-transaction',{type:'income',account_id:'${a.account_id}'})">

        <div class="action-btn-label">Add Money</div>
      </div>
      <div class="action-btn" onclick="App.navigate('add-transaction',{type:'transfer',from_id:'${a.account_id}'})">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--primary)"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
        <div class="action-btn-label">Transfer</div>
      </div>
      <div class="action-btn" onclick="App.exportAccount('${a.account_id}','csv')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--primary)"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <div class="action-btn-label">Download Statement</div>
      </div>
    </div>

    <!-- Smart Insights -->
    <div class="section-header"><div class="section-title">Smart Insights</div></div>
    <div class="insight-grid">
      <div class="insight-card">
        <div class="insight-icon" style="background:var(--success-dim)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--success)"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
        </div>
        <div class="insight-label">Avg Monthly Inflow</div>
        <div class="insight-value text-success">${formatINR(a.avg_inflow||0)}</div>
      </div>
      <div class="insight-card">
        <div class="insight-icon" style="background:var(--danger-dim)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--danger)"><path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z"/></svg>
        </div>
        <div class="insight-label">Avg Monthly Outflow</div>
        <div class="insight-value text-danger">${formatINR(a.avg_outflow||0)}</div>
      </div>
      <div class="insight-card">
        <div class="insight-icon" style="background:var(--info-dim)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="var(--info)"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
        </div>
        <div class="insight-label">Total Transactions</div>
        <div class="insight-value">${a.tx_count||acctTxs.length} This Month</div>
      </div>
    </div>

    <!-- Transactions Section -->
    <div class="section-header">
      <div class="section-title">Transactions (${sortedTxs.length})</div>
      <div style="display:flex;gap:8px;align-items:center">
        <div class="view-all" onclick="State.showAcctFilter=!State.showAcctFilter;App.render()">
          ${State.showAcctFilter ? 'Hide Filter' : 'Filter'}
        </div>
      </div>
    </div>

    <!-- Search bar -->
    <div class="search-bar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text-dim)"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input class="search-input" placeholder="Search transactions…" id="acct-search"
        oninput="State.acctSearch=this.value;App.render()" value="${State.acctSearch||''}" />
    </div>

    ${filterPanel}

    <!-- Transaction list -->
    ${sortedTxs.length === 0
      ? `<div class="empty-state" style="padding:24px"><div class="empty-icon">📭</div><div class="empty-title">No transactions</div><div class="empty-sub">No transactions found for this period.</div></div>`
      : `<div class="list-card">${txRows}</div>`
    }
  </div>`;
}

const ACCT_TYPES = [
  { key:'bank',        label:'Bank Account',   icon:'🏦', color:'#3B82F6', desc:'Savings & Current' },
  { key:'overdraft',   label:'Overdraft',       icon:'⚠️', color:'#7C3AED', desc:'Overdraft accounts' },
  { key:'upi',         label:'UPI Account',     icon:'📲', color:'#10B981', desc:'UPI ID linked' },
  { key:'cash',        label:'Cash Account',    icon:'💵', color:'#22C55E', desc:'Physical cash' },
  { key:'credit_card', label:'Credit Card',     icon:'💳', color:'#EF4444', desc:'All credit cards' },
  { key:'investment',  label:'Investment',      icon:'📈', color:'#F59E0B', desc:'Stocks, MF & more' },
];
const COLOR_SWATCHES = ['#6C47FF','#22C55E','#EF4444','#60A5FA','#F59E0B','#10B981','#3B82F6','#EC407A','#7C3AED','#FF7043'];

function renderAddAccount() {
  const isEdit   = State.screen === 'edit-account';
  const editId   = State.params?.id;
  const existing = isEdit ? (DEMO.accounts.find(a=>a.account_id===editId)||{}) : {};
  const type     = State.addAcctType || existing.account_type || 'bank';
  const selColor = State.acctColor || existing.color || '#6C47FF';
  const typeMeta = ACCT_TYPES.find(t=>t.key===type)||ACCT_TYPES[0];

  const bankFields = `
    <div class="form-section-label">Bank Details</div>
    <div class="form-card">
      <div class="form-row">
        <div class="form-row-icon" style="background:#3B82F622"><span style="font-size:16px">🏦</span></div>
        <div style="flex:1">
          <div class="form-row-label">Bank Name *</div>
          <input id="af-bank" class="form-row-value" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="e.g. HDFC Bank, SBI" value="${existing.institution||''}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-row-icon" style="background:#3B82F622"><span style="font-size:16px">👤</span></div>
        <div style="flex:1">
          <div class="form-row-label">Account Holder Name *</div>
          <input id="af-holder" class="form-row-value" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="Full name as on passbook" value="${existing.holder||''}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-row-icon" style="background:#3B82F622"><span style="font-size:16px">🔢</span></div>
        <div style="flex:1">
          <div class="form-row-label">Account Number</div>
          <input id="af-accno" class="form-row-value" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="1234 5678 9012" type="text" inputmode="numeric" value="${existing.account_number||''}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-row-icon" style="background:#3B82F622"><span style="font-size:16px">🏢</span></div>
        <div style="flex:1">
          <div class="form-row-label">IFSC Code</div>
          <input id="af-ifsc" class="form-row-value" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="HDFC0001234" value="${existing.ifsc||''}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-row-icon" style="background:#3B82F622"><span style="font-size:16px">🏗️</span></div>
        <div style="flex:1">
          <div class="form-row-label">Branch (Optional)</div>
          <input id="af-branch" class="form-row-value" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="e.g. Mumbai Main Branch" value="${existing.branch||''}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-row-icon" style="background:#3B82F622"><span style="font-size:16px">🏷️</span></div>
        <div style="flex:1">
          <div class="form-row-label">Account Type</div>
          <select id="af-subtype" style="background:none;border:none;color:var(--text);font-size:14px;font-weight:600;outline:none;cursor:pointer;width:100%;padding:2px 0">
            ${['Savings','Current','Other'].map(s=>`<option value="${s}" ${(existing.sub_type||'Savings')===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>`;

  const upiFields = `
    <div class="form-section-label">UPI Details</div>
    <div class="form-card">
      <div class="form-row">
        <div class="form-row-icon" style="background:#10B98122"><span style="font-size:16px">🏦</span></div>
        <div style="flex:1">
          <div class="form-row-label">Bank Name *</div>
          <input id="af-bank" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="ICICI Bank" value="${existing.institution||''}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-row-icon" style="background:#10B98122"><span style="font-size:16px">@</span></div>
        <div style="flex:1">
          <div class="form-row-label">UPI ID *</div>
          <input id="af-upi" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="yourname@okicici" value="${existing.upi_id||''}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-row-icon" style="background:#10B98122"><span style="font-size:16px">📲</span></div>
        <div style="flex:1">
          <div class="form-row-label">Linked App</div>
          <select id="af-upiapp" style="background:none;border:none;color:var(--text);font-size:14px;font-weight:600;outline:none;cursor:pointer;width:100%;padding:2px 0">
            ${['Google Pay','PhonePe','Paytm','BHIM','Other'].map(s=>`<option value="${s}" ${(existing.linked_app||'Google Pay')===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>`;

  const cashFields = `
    <div class="form-section-label">Cash Details</div>
    <div class="form-card">
      <div class="form-row">
        <div class="form-row-icon" style="background:#22C55E22"><span style="font-size:16px">📍</span></div>
        <div style="flex:1">
          <div class="form-row-label">Location (Optional)</div>
          <input id="af-loc" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="Home, Wallet, Locker…" value="${existing.cash_location||''}" />
        </div>
      </div>
    </div>`;

  const ccFields = `
    <div class="form-section-label">Credit Card Details</div>
    <div class="form-card">
      <div class="form-row">
        <div class="form-row-icon" style="background:#EF444422"><span style="font-size:16px">🏦</span></div>
        <div style="flex:1">
          <div class="form-row-label">Bank Name *</div>
          <input id="af-bank" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="HDFC Bank, ICICI…" value="${existing.institution||''}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-row-icon" style="background:#EF444422"><span style="font-size:16px">💳</span></div>
        <div style="flex:1">
          <div class="form-row-label">Card Number (last 4)</div>
          <input id="af-accno" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="XXXX XXXX XXXX 1234" value="${existing.account_number||''}" maxlength="19" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-row-icon" style="background:#EF444422"><span style="font-size:16px">💰</span></div>
        <div style="flex:1">
          <div class="form-row-label">Credit Limit</div>
          <input id="af-crlimit" type="number" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="300000" value="${existing.credit_limit||''}" inputmode="numeric" />
        </div>
      </div>
    </div>`;

  const invFields = `
    <div class="form-section-label">Investment Details</div>
    <div class="form-card">
      <div class="form-row">
        <div class="form-row-icon" style="background:#F59E0B22"><span style="font-size:16px">🏢</span></div>
        <div style="flex:1">
          <div class="form-row-label">Platform / Broker *</div>
          <input id="af-bank" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="Zerodha, Groww, Kuvera…" value="${existing.institution||''}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-row-icon" style="background:#F59E0B22"><span style="font-size:16px">📊</span></div>
        <div style="flex:1">
          <div class="form-row-label">Investment Type</div>
          <select id="af-subtype" style="background:none;border:none;color:var(--text);font-size:14px;font-weight:600;outline:none;cursor:pointer;width:100%;padding:2px 0">
            ${['Mutual Fund','Stocks','PPF','FD','NPS','Gold','Other'].map(s=>`<option value="${s}" ${(existing.sub_type||'Mutual Fund')===s?'selected':''}>${s}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>`;

  const typeSpecific = {bank:bankFields, upi:upiFields, cash:cashFields, credit_card:ccFields, investment:invFields, overdraft:bankFields}[type] || bankFields;

  return `
  <div class="screen-wrap form-screen">
    <!-- Header -->
    <div class="form-header">
      <div class="icon-btn" onclick="App.goTab('wealth')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
      </div>
      <div class="form-header-title">${isEdit ? 'Edit Account' : 'Add Account'}</div>
      <button class="form-save-btn" onclick="App.saveAccount()">Save</button>
    </div>

    <!-- Account type grid -->
    <div class="form-section-label">Account Types You Can Add</div>
    <div class="acct-type-grid">
      ${ACCT_TYPES.map(t => `
        <div class="acct-type-card ${type===t.key?'active':''}" onclick="State.addAcctType='${t.key}';App.render()">
          <div style="font-size:22px">${t.icon}</div>
          <div class="acct-type-label">${t.label}</div>
          <div style="color:var(--text-dim);font-size:10px;text-align:center">${t.desc}</div>
        </div>`).join('')}
    </div>

    <!-- Account Name + Opening Balance (common) -->
    <div class="form-section-label">Basic Information</div>
    <div class="form-card">
      <div class="form-row">
        <div class="form-row-icon" style="background:${typeMeta.color}22"><span style="font-size:16px">${typeMeta.icon}</span></div>
        <div style="flex:1">
          <div class="form-row-label">Account Name / Nickname *</div>
          <input id="af-name" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="e.g. HDFC Salary A/c" value="${existing.name||''}" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-row-icon" style="background:${typeMeta.color}22"><span style="font-size:16px">💰</span></div>
        <div style="flex:1">
          <div class="form-row-label">Opening Balance (Optional)</div>
          <input id="af-balance" type="number" inputmode="decimal" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="0.00" value="${existing.balance||''}" />
        </div>
      </div>
    </div>

    <!-- Type-specific fields -->
    ${typeSpecific}

    <!-- Notes -->
    <div class="form-section-label">Additional Settings</div>
    <div class="form-card">
      <div class="form-row">
        <div class="form-row-icon" style="background:rgba(255,255,255,0.06)"><span style="font-size:16px">📝</span></div>
        <div style="flex:1">
          <div class="form-row-label">Account Notes (Optional)</div>
          <input id="af-notes" style="background:none;border:none;outline:none;width:100%;color:var(--text);font-size:14px;font-weight:600;padding:2px 0"
            placeholder="e.g. Emergency savings account" value="${existing.notes||''}" />
        </div>
      </div>
    </div>

    <!-- Color picker -->
    <div class="form-section-label">Account Color</div>
    <div class="form-card" style="padding:0">
      <div class="color-swatches">
        ${COLOR_SWATCHES.map(c => `
          <div class="color-swatch ${selColor===c?'selected':''}" style="background:${c}"
            onclick="State.acctColor='${c}';App.render()"></div>`).join('')}
      </div>
    </div>

    ${isEdit ? `
    <!-- Delete -->
    <div style="margin:14px 20px 100px;padding:14px 16px;background:var(--danger-dim);border-radius:var(--radius-sm);border:1px solid rgba(239,68,68,0.25);display:flex;justify-content:space-between;align-items:center;cursor:pointer" onclick="App.deleteAccount('${editId}')">
      <div style="color:var(--danger);font-size:14px;font-weight:700">🗑️ Delete Account</div>
      <div style="color:var(--text-dim);font-size:12px">Remove permanently</div>
    </div>` : `<div style="height:100px"></div>`}

    <!-- Sticky Save -->
    <div class="sticky-save">
      <button class="btn btn-primary" style="width:100%;border-radius:var(--radius-sm);font-size:16px" onclick="App.saveAccount()">
        Save Account
      </button>
    </div>
  </div>`;
}
