/* ─── TRANSACTIONS MODULE ────────────────────────────── */
const TX_CAT_ICONS = {
  'Salary':{'icon':'💼','color':'#22C55E'},'Freelance':{'icon':'💻','color':'#22C55E'},'Freelance Work':{'icon':'💻','color':'#22C55E'},
  'Business Income':{'icon':'🏢','color':'#22C55E'},'Investment Returns':{'icon':'📈','color':'#22C55E'},
  'Rental Income':{'icon':'🏠','color':'#22C55E'},'Gift':{'icon':'🎁','color':'#22C55E'},
  'Food & Dining':{'icon':'🍽️','color':'#F59E0B'},'Food':{'icon':'🍽️','color':'#F59E0B'},
  'Shopping':{'icon':'🛍️','color':'#EF4444'},'Transport':{'icon':'🚗','color':'#3B82F6'},
  'Bills & Utilities':{'icon':'💡','color':'#8B5CF6'},'Health':{'icon':'🏥','color':'#EC4899'},
  'Entertainment':{'icon':'🎬','color':'#06B6D4'},'Housing':{'icon':'🏠','color':'#14B8A6'},
  'Rent':{'icon':'🏠','color':'#14B8A6'},'Education':{'icon':'📚','color':'#6366F1'},
  'Travel':{'icon':'✈️','color':'#F97316'},'Grocery':{'icon':'🛒','color':'#84CC16'},
  'Transfer':{'icon':'🔄','color':'#60A5FA'},'Others':{'icon':'💰','color':'#A0A3BD'},
};
function txCatMeta(cat) { return TX_CAT_ICONS[cat] || {icon:'💰',color:'#A0A3BD'}; }

function renderTransactions() {
  var allTx  = DEMO.transactions;
  var accts  = State.data.accounts || DEMO.accounts;
  var filter = State.txFilter || 'all';
  var month  = State.txMonth != null ? State.txMonth : new Date().getMonth();
  var year   = State.txYear  != null ? State.txYear  : new Date().getFullYear();
  var search = (State.txSearch || '').toLowerCase();
  var acctFilter = State.txAccountFilter || 'all';
  var showSearch = State.txShowSearch || false;

  // Filter by month/year
  var inPeriod = allTx.filter(function(t) {
    var d = new Date(t.date);
    return d.getMonth() === month && d.getFullYear() === year;
  });

  // Account filter
  if (acctFilter !== 'all') {
    inPeriod = inPeriod.filter(function(t) { return t.account_id === acctFilter; });
  }

  // Summary totals (always from full period, before type filter)
  var totalIncome  = inPeriod.filter(function(t) { return t._type === 'income'; }).reduce(function(s,t) { return s + t.amount; }, 0);
  var totalExpense = inPeriod.filter(function(t) { return t._type === 'expense'; }).reduce(function(s,t) { return s + t.amount; }, 0);
  var netSavings   = totalIncome - totalExpense;
  var incomeCount  = inPeriod.filter(function(t) { return t._type === 'income'; }).length;
  var expCount     = inPeriod.filter(function(t) { return t._type === 'expense'; }).length;
  var txfrCount    = inPeriod.filter(function(t) { return t._type === 'transfer'; }).length;

  // Type filter
  var filtered = filter === 'all' ? inPeriod : inPeriod.filter(function(t) { return t._type === filter; });

  // Search filter
  if (search) {
    filtered = filtered.filter(function(t) {
      return (t.source || '').toLowerCase().indexOf(search) !== -1
          || (t.description || '').toLowerCase().indexOf(search) !== -1
          || (t.category || '').toLowerCase().indexOf(search) !== -1;
    });
  }

  // Group by date
  var grouped = {};
  filtered.forEach(function(t) {
    var dk = t.date ? t.date.slice(0,10) : 'Unknown';
    if (!grouped[dk]) grouped[dk] = [];
    grouped[dk].push(t);
  });
  var dateKeys = Object.keys(grouped).sort(function(a,b) { return b.localeCompare(a); });

  var txRows = dateKeys.map(function(dk) {
    var dayTxs = grouped[dk];
    var dateLabel = (function() {
      var d = new Date(dk); d.setHours(0,0,0,0);
      var today = new Date(); today.setHours(0,0,0,0);
      var diff = Math.round((d - today) / 86400000);
      if (diff === 0)  return 'Today';
      if (diff === -1) return 'Yesterday';
      return d.getDate() + ' ' + MONTHS_FULL[d.getMonth()];
    })();

    var rows = dayTxs.map(function(t) {
      var isInc  = t._type === 'income';
      var isTxfr = t._type === 'transfer';
      var meta   = txCatMeta(t.category);
      var title  = isTxfr ? (t.source || t.payee || 'Transfer') : (t.source || t.description || t.payee || t.category || 'Transaction');
      var acct   = accts.find(function(a) { return a.account_id === t.account_id; });
      var sub    = [t.category, acct ? acct.name : ''].filter(Boolean).join(' \xb7 ');
      var amtColor = isTxfr ? COLORS.info : isInc ? COLORS.success : COLORS.danger;
      var amtStr = isTxfr ? formatINR(t.amount) : (isInc ? '+' : '-') + formatINR(t.amount);
      var timeStr = t.date ? new Date(t.date).toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'}) : '';
      return '<div class="tx-row" onclick="App.openTxDetail(\'' + t.id + '\')">'
        + '<div class="tx-row-icon" style="background:' + meta.color + '22;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0">'
        + meta.icon
        + '</div>'
        + '<div class="tx-row-body">'
        + '<div class="tx-row-title">' + title + '</div>'
        + '<div class="tx-row-sub">' + sub + '</div>'
        + '</div>'
        + '<div class="tx-row-right">'
        + '<div class="tx-row-amt" style="color:' + amtColor + '">' + amtStr + '</div>'
        + '<div class="tx-row-date">' + timeStr + '</div>'
        + '</div>'
        + '</div>';
    }).join('');

    var dayTotal = dayTxs.reduce(function(s,t) {
      if (t._type === 'income') return s + t.amount;
      if (t._type === 'expense') return s - t.amount;
      return s;
    }, 0);
    var dayTotalStr = (dayTotal > 0 ? '+' : '') + formatINR(dayTotal);
    var dayTotalColor = dayTotal >= 0 ? COLORS.success : COLORS.danger;
    return '<div class="tx-date-header" style="display:flex;justify-content:space-between;align-items:center">'
         + '<span>' + dateLabel + '</span>'
         + '<span style="font-size:12px;color:' + dayTotalColor + '">' + dayTotalStr + '</span>'
         + '</div>'
         + '<div class="list-card" style="margin:0 20px 10px">' + rows + '</div>';
  }).join('');

  // Account options for filter select
  var acctOptHtml = '<option value="all">All Accounts</option>'
    + accts.map(function(a) {
        return '<option value="' + a.account_id + '"' + (acctFilter === a.account_id ? ' selected' : '') + '>' + a.name + '</option>';
      }).join('');

  // Type tabs HTML
  var tabs = ['all','income','expense','transfer'];
  var tabLabels = {all:'All', income:'Income', expense:'Expense', transfer:'Transfer'};
  var typeTabsHtml = tabs.map(function(f) {

/* ─── EXPERT VIEW ─────────────────────────────────────── */
function renderExpertView() {
  var allTx  = DEMO.transactions || [];
  var period = State.txExpertPeriod || 'month';
  var now    = new Date();
  var month  = State.txMonth != null ? State.txMonth : now.getMonth();
  var year   = State.txYear  != null ? State.txYear  : now.getFullYear();

  var filtered = allTx.filter(function(t) {
    var d = new Date(t.date);
    if (period === 'month')   return d.getMonth()===month && d.getFullYear()===year;
    if (period === 'quarter') return Math.floor(d.getMonth()/3)===Math.floor(month/3) && d.getFullYear()===year;
    if (period === 'year')    return d.getFullYear()===year;
    var w = new Date(now); w.setHours(0,0,0,0); w.setDate(w.getDate()-7);
    var dNorm = new Date(t.date); dNorm.setHours(0,0,0,0);
    return dNorm >= w && dNorm <= now;
  });

  var totalIncome  = filtered.filter(function(t){return t._type==='income';}).reduce(function(s,t){return s+t.amount;},0);
  var totalExpense = filtered.filter(function(t){return t._type==='expense';}).reduce(function(s,t){return s+t.amount;},0);
  var netSavings   = totalIncome - totalExpense;
  var savingsPct   = totalIncome>0 ? Math.round(netSavings/totalIncome*100) : 0;

  var catMap = {};
  filtered.filter(function(t){return t._type==='expense';}).forEach(function(t){
    var c = t.category||'Others';
    catMap[c] = (catMap[c]||0) + t.amount;
  });
  var catArr = Object.keys(catMap).map(function(c){return {cat:c,amt:catMap[c]};}).sort(function(a,b){return b.amt-a.amt;}).slice(0,6);
  var maxCat = catArr.length ? catArr[0].amt : 1;

  var catBars = catArr.map(function(c) {
    var m   = txCatMeta(c.cat);
    var pct = Math.round(c.amt/(totalExpense||1)*100);
    var bw  = Math.round(c.amt/maxCat*100);
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">'
      +'<div style="font-size:20px;width:28px;text-align:center">'+m.icon+'</div>'
      +'<div style="flex:1"><div style="display:flex;justify-content:space-between;margin-bottom:5px">'
      +'<span style="color:var(--text);font-size:13px;font-weight:600">'+c.cat+'</span>'
      +'<span style="color:var(--text-dim);font-size:12px">'+formatINR(c.amt)+' · '+pct+'%</span></div>'
      +'<div style="height:6px;background:rgba(255,255,255,0.08);border-radius:3px"><div style="height:6px;width:'+bw+'%;background:'+m.color+';border-radius:3px"></div></div>'
      +'</div></div>';
  }).join('');

  var months6 = [];
  for (var i=5;i>=0;i--) {
    var mm = (month-i+12)%12;
    var yy = year - (month-i<0?1:0);
    var mi = allTx.filter(function(t){var d=new Date(t.date);return d.getMonth()===mm&&d.getFullYear()===yy&&t._type==='income';}).reduce(function(s,t){return s+t.amount;},0);
    var me = allTx.filter(function(t){var d=new Date(t.date);return d.getMonth()===mm&&d.getFullYear()===yy&&t._type==='expense';}).reduce(function(s,t){return s+t.amount;},0);
    months6.push({m:MONTHS_FULL[mm].slice(0,3),inc:mi,exp:me});
  }
  var maxB = Math.max.apply(null, months6.map(function(x){return Math.max(x.inc,x.exp);})) || 1;
  var barChart = '<div style="display:flex;align-items:flex-end;gap:4px;height:80px">'
    + months6.map(function(m){
        var ih = Math.max(Math.round(m.inc/maxB*72),2);
        var eh = Math.max(Math.round(m.exp/maxB*72),2);
        return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:0"><div style="display:flex;gap:2px;align-items:flex-end;height:72px">'
          +'<div style="width:7px;height:'+ih+'px;background:#22C55E;border-radius:2px 2px 0 0"></div>'
          +'<div style="width:7px;height:'+eh+'px;background:#EF4444;border-radius:2px 2px 0 0"></div>'
          +'</div><div style="color:var(--text-dim);font-size:9px;margin-top:4px">'+m.m+'</div></div>';
      }).join('')
    +'</div>'
    +'<div style="display:flex;gap:16px;justify-content:center;margin-top:10px">'
    +'<div style="display:flex;gap:6px;align-items:center"><div style="width:10px;height:10px;background:#22C55E;border-radius:2px"></div><span style="color:var(--text-dim);font-size:11px">Income</span></div>'
    +'<div style="display:flex;gap:6px;align-items:center"><div style="width:10px;height:10px;background:#EF4444;border-radius:2px"></div><span style="color:var(--text-dim);font-size:11px">Expense</span></div>'
    +'</div>';

  var topCat  = catArr.length ? catArr[0].cat : 'N/A';
  var topAmt  = catArr.length ? formatINR(catArr[0].amt) : '₹0';
  var aiLines = [
    'Savings rate: '+(savingsPct<0?'−'+Math.abs(savingsPct):savingsPct)+'% — '+(savingsPct>=30?'🟢 Excellent! You save more than 30% of income.':savingsPct>=15?'🟡 Good. Try to reach 30%+ for strong financial health.':'🔴 Below target. Reduce discretionary spend.'),
    'Top category: '+topCat+' ('+topAmt+'). '+(catArr.length&&catArr[0].amt>totalExpense*0.4?'⚠️ Over 40% of expenses — consider reducing.':'Within healthy range.'),
    totalExpense>totalIncome?'⚠️ Expenses exceed income this period. Review your budget immediately.':'✅ Cash flow positive — keep it up!',
  ];

  var pTabs = ['week','month','quarter','year'].map(function(p){
    return '<div class="ev-period-tab'+(period===p?' active':'')+'" onclick="State.txExpertPeriod=\''+p+'\';App.render()">'+p.charAt(0).toUpperCase()+p.slice(1)+'</div>';
  }).join('');

  return '<div class="screen-wrap" style="padding-bottom:32px">'

function getAccountGroups(accounts) {
  const groups = {};
  accounts.forEach(a => {
    let key = a.account_type;
    if (key === 'wallet') key = 'cash';
    if (!groups[key]) groups[key] = { total: 0, count: 0, accounts: [] };
    groups[key].total += a.balance;
    groups[key].count += 1;
    groups[key].accounts.push(a);
  });
  return groups;
}

function renderWealth() {
  var accts   = State.data.accounts || DEMO.accounts;
  var visible = accts.filter(function(a){ return a.visible !== false; });

  // — Accounts —
  var bankAccts = visible.filter(function(a){ return a.account_type==='bank'; });
  var cashAccts = visible.filter(function(a){ return a.account_type==='cash'||a.account_type==='wallet'; });
  var upiAccts  = visible.filter(function(a){ return a.account_type==='upi'; });
  var bankTotal = bankAccts.reduce(function(s,a){ return s+a.balance; },0);
  var cashTotal = cashAccts.reduce(function(s,a){ return s+a.balance; },0);
  var upiTotal  = upiAccts.reduce(function(s,a){ return s+a.balance; },0);

  // — Investments —
  var invs       = DEMO.investments || [];
  var invTotal   = invs.reduce(function(s,i){ return s+i.current; },0);
  var invInvested= invs.reduce(function(s,i){ return s+i.invested; },0);
  var invGain    = invTotal - invInvested;

  // — Property / Rentals —
  var rentals    = DEMO.rentals || [];
  var rentalVal  = rentals.reduce(function(s,r){ return s+(r.market_value||0); },0);
  var rentalInc  = rentals.reduce(function(s,r){ return s+(r.monthly_rent||0); },0);

  // — Other Assets —
  var otherAssets = DEMO.otherAssets || [];
  var otherTotal  = otherAssets.reduce(function(s,x){ return s+(x.value||0); },0);

  // — Liabilities —
  var loans       = DEMO.loans || [];

  var cards       = DEMO.creditCards || [];

  var lendBorrow  = DEMO.lendBorrow || [];

  // — Net Worth —
  var totalAssets = bankTotal + cashTotal + invTotal + rentalVal + otherTotal + lentAmt;

  var growthPct   = DEMO.dashboard.net_worth_delta_pct ?? 3.8;

    +'<div class="ws-title">🏦 ACCOUNTS</div>'

    +'<div class="wealth-cat-grid">'+acctCards.map(catCard).join('')+'</div>';

  html += '<div class="ws-head">'
    +'<div class="ws-title">📦 ASSETS (What You Own)</div>'
    +'<div class="ws-view-all" onclick="App.showToast(\'All assets view coming soon!\')">Details →</div>'
    +'</div>'
    +'<div class="wealth-cat-grid">'+assetCards.map(catCard).join('')+'</div>';

  // LIABILITIES section
  html += '<div class="ws-head">'
    +'<div class="ws-title">⚠️ LIABILITIES (What You Owe)</div>'
    +'<div class="ws-view-all" onclick="App.showToast(\'Liabilities detail coming soon!\')">Details →</div>'
    +'</div>'
    +'<div class="wealth-cat-grid">'+liabCards.map(function(c){
        return '<div class="wealth-cat-card" onclick="'+c.fn+'">'
          +'<div class="wealth-cat-icon">'+c.icon+'</div>'
          +'<div class="wealth-cat-name">'+c.name+'</div>'

          +'</div>';

  // Analytics — Asset Allocation donut + legend
  html += '<div class="ws-head" style="margin-top:4px"><div class="ws-title">📊 ASSET ALLOCATION</div></div>'
    +'<div style="margin:0 20px 20px;background:var(--card);border-radius:var(--radius);padding:16px">'
    +'<div style="display:flex;align-items:center;gap:16px">'
    +donutSVG
    +'<div style="flex:1">'
    +donutSegments.map(function(seg){
        var pct = Math.round(seg.value/donutTotal*100);
        return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
          +'<div style="display:flex;align-items:center;gap:6px">'
          +'<div style="width:10px;height:10px;border-radius:50%;background:'+seg.color+'"></div>'
          +'<span style="color:var(--text-dim);font-size:12px">'+seg.label+'</span>'
          +'</div>'
          +'<div style="text-align:right">'
          +'<div style="color:var(--text);font-size:13px;font-weight:700">'+pct+'%</div>'
          +'<div style="color:var(--text-dim);font-size:11px">'+formatINR(seg.value)+'</div>'
          +'</div>'
          +'</div>';
      }).join('')
    +'</div>'
    +'</div>'
    +'</div>';

  // Financial Health Score
  html += '<div class="ws-head"><div class="ws-title">❤️ FINANCIAL HEALTH</div></div>'
    +'<div style="margin:0 20px 20px;background:var(--card);border-radius:var(--radius);padding:16px">'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'
    +'<div><div style="color:var(--text);font-size:22px;font-weight:800">'+healthScore+'<span style="font-size:14px;color:var(--text-dim)">/100</span></div>'
    +'<div style="color:'+healthColor+';font-size:13px;font-weight:700;margin-top:2px">'+healthLabel+'</div></div>'
    +'<div style="width:70px;height:70px;border-radius:50%;background:conic-gradient('+healthColor+' '+healthScore+'%, rgba(255,255,255,0.08) 0%);display:flex;align-items:center;justify-content:center">'
    +'<div style="width:54px;height:54px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;color:'+healthColor+';font-size:16px;font-weight:800">'+healthScore+'</div>'
    +'</div>'
    +'</div>'
    +'<div style="display:flex;flex-direction:column;gap:10px">'
    +[
      {label:'Savings Rate', val: Math.min(savingsRate,50)/50, pct: savingsRate.toFixed(1)+'%', color:'#22C55E'},
      {label:'Debt Ratio',   val: Math.max(0,100-debtRatio)/100, pct: debtRatio.toFixed(1)+'%', color:'#60A5FA'},
      {label:'Inv. Allocation', val: Math.min(invAlloc,25)/25, pct: invAlloc.toFixed(1)+'%', color:'#F59E0B'},
    ].map(function(r){
      return '<div><div style="display:flex;justify-content:space-between;margin-bottom:4px">'
        +'<span style="color:var(--text-dim);font-size:12px">'+r.label+'</span>'
        +'<span style="color:var(--text);font-size:12px;font-weight:600">'+r.pct+'</span></div>'
        +'<div class="health-bar-bg"><div class="health-bar-fill" style="width:'+Math.round(r.val*100)+'%;background:'+r.color+'"></div></div>'
        +'</div>';
    }).join('')
    +'</div>'
    +'</div>';

  // AI Smart Insights
  html += '<div class="ws-head"><div class="ws-title">🤖 SMART INSIGHTS</div></div>'
    +'<div style="margin:0 20px 20px;background:var(--primary-dim);border-radius:var(--radius);padding:16px;border:1px solid rgba(108,71,255,0.3)">'
    +insights.map(function(ins){
        return '<div class="wealth-insight">'
          +'<div class="wealth-insight-dot" style="background:'+ins.dot+'"></div>'
          +'<div class="wealth-insight-text">'+ins.text+'</div>'
          +'</div>';
      }).join('')
    +'</div>';

  // Loans detail rows
  if (loans.length > 0) {
    html += '<div class="ws-head"><div class="ws-title">💳 ACTIVE LOANS</div></div>'
      +'<div class="acct-group-list" style="margin:0 20px 20px">'
      +loans.map(function(l){
          var paid = Math.round(l.paid_months/l.tenure_months*100);
          return '<div class="acct-group-row" onclick="App.showToast(\'Loan detail: \''+l.name+' — \''+formatINR(l.outstanding)+' outstanding\')">'
            +'<div class="acct-group-icon" style="background:rgba(239,68,68,0.15)"><svg width="22" height="22" viewBox="0 0 24 24" fill="#EF4444"><path d="M11.5 1L2 6v2h19V6L11.5 1zM3 22h18v-2H3v2zm0-4h18v-8H3v8z"/></svg></div>'
            +'<div class="acct-group-info">'
            +'<div class="acct-group-name">'+l.name+'</div>'
            +'<div class="acct-group-sub">'+l.lender+' · EMI '+formatINR(l.emi)+'/mo · '+paid+'% paid</div>'
            +'</div>'
            +'<div><div class="acct-group-bal" style="color:#EF4444">'+formatINR(l.outstanding)+'</div>'
            +'<div style="color:var(--text-dim);font-size:11px;text-align:right">'+l.interest_rate+'% p.a.</div></div>'
            +'<svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text-dim)" style="margin-left:6px;flex-shrink:0"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>'
            +'</div>';
        }).join('')
      +'</div>';
  }

  // Account groups quick nav
  html += '<div class="ws-head"><div class="ws-title">⚡ QUICK ACTIONS</div></div>'
    +'<div class="adv-grid" style="margin-bottom:20px">'
    +[
      {icon:'➕',label:'Add Account',  fn:"App.navigate('add-account')"},
      {icon:'📊',label:'Transactions', fn:"App.goTab('transactions')"},
      {icon:'📅',label:'Reminders',   fn:"App.navigate('reminders')"},
      {icon:'📤',label:'Export Data', fn:"App.exportAllAccounts()"},
    ].map(function(f){
      return '<div class="adv-card" onclick="'+f.fn+'">'
        +'<div class="adv-card-icon" style="background:rgba(108,71,255,0.2);font-size:18px">'+f.icon+'</div>'
        +'<div class="adv-card-label">'+f.label+'</div>'
        +'</div>';
    }).join('')
    +'</div>';

  // Security footer
  html += '<div style="margin:0 20px 0;padding:14px 16px;background:rgba(34,197,94,0.08);border-radius:var(--radius-sm);border:1px solid rgba(34,197,94,0.2);display:flex;gap:12px;align-items:center">'
    +'<svg width="22" height="22" viewBox="0 0 24 24" fill="#22C55E"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>'
    +'<div><div style="color:#22C55E;font-size:13px;font-weight:700">Bank-Grade Security</div>'
    +'<div style="color:var(--text-dim);font-size:12px;margin-top:2px">All financial data is encrypted end-to-end.</div>'
    +'</div>'
    +'</div>';

  html += '</div>';
  return html;
}

              </div>

         </div>`
    }

}

/* ─── ACCOUNT DETAIL ─────────────────────────────────── */
function renderAccountDetail() {
  const id   = State.viewAcctId || State.params.id;
  const accts = State.data.accounts || DEMO.accounts;
  const a    = accts.find(x => x.account_id === id);
  if (!a) return `<div class="empty-state"><div class="empty-icon">❌</div><div class="empty-title">Account not found</div></div>`;

  const meta    = ACCT_GROUP_META[a.account_type] || ACCT_GROUP_META.bank;
  const acctColor = a.color || meta.color;
  const isLiab  = a.balance < 0;
  const balColor  = isLiab ? '#FFB4BE' : '#9DFFD9';

  // Transactions for this account
  const allTx    = DEMO.transactions || [];
  const typeF    = State.acctTxTypeFilter || 'all';
  const dateF    = State.acctTxDateFilter || 'month';
  const now      = new Date();
  const acctTxs  = allTx.filter(t => {
    const matchAcct = t.account_id === id || t.to_account_id === id;
    if (!matchAcct) return false;
    const txDate = new Date(t.date);
    if (dateF === 'month') return txDate.getMonth() === now.getMonth() && txDate.getFullYear() === now.getFullYear();
    if (dateF === 'last_month') { const lm = new Date(now.getFullYear(), now.getMonth()-1,1); return txDate.getMonth()===lm.getMonth()&&txDate.getFullYear()===lm.getFullYear(); }
    if (dateF === 'year') return txDate.getFullYear() === now.getFullYear();
    return true;
  }).filter(t => {
    if (typeF === 'all') return true;
    const isCredit = t._type === 'income' || t.to_account_id === id;
    return typeF === 'credit' ? isCredit : !isCredit;
  }).filter(t => {
    if (!State.acctSearch) return true;
    const q = State.acctSearch.toLowerCase();
    return (t.source||'').toLowerCase().includes(q)
        || (t.description||'').toLowerCase().includes(q)
        || (t.category||'').toLowerCase().includes(q)
        || (t.payee||'').toLowerCase().includes(q)
        || (t.notes||'').toLowerCase().includes(q);
  });

  const sortedTxs = [...acctTxs].sort((a,b) => {
    const s = State.acctSort || 'date';
    if (s === 'amount')   return b.amount - a.amount;
    if (s === 'category') return (a.category||'').localeCompare(b.category||'');
    return new Date(b.date) - new Date(a.date);
  });

  const txRows = sortedTxs.map((t,i) => {
    const isInc  = t._type==='income' || t.to_account_id===id;
    const color  = isInc ? COLORS.success : COLORS.danger;
    const icon   = isInc ? ICON.arrow_up : ICON.arrow_dn;
    const title  = t._type==='transfer' ? (t.to_account_id===id?'Transfer In':'Transfer Out') : (t.source||t.description||t.category||'Transaction');
    const sub    = t.category || (t._type==='transfer'?'Transfer':'');
    const amtStr = `${isInc?'+':'-'}${formatINR(t.amount)}`;
    return `
    <div class="list-row" style="${i<sortedTxs.length-1?'border-bottom:1px solid var(--border)':''}" onclick="App.openTxDetail('${t.id}')">
      <div class="list-icon" style="background:${color}22">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="${color}">${(icon.match(/<path[^>]*\/>/g)||[]).join('')}</svg>
      </div>
      <div class="list-body">
        <div class="list-title">${title}</div>
        <div class="list-sub">${sub}${t.date?' · '+formatDate(t.date):''}</div>
      </div>
      <div class="list-right">
        <div class="list-amount" style="color:${color}">${amtStr}</div>
        <div class="list-date">${t.date?new Date(t.date).toLocaleDateString('en-IN',{day:'2-digit',month:'short'}):''}</div>
      </div>
    </div>`;
  }).join('');

  // Info rows
  const infoRows = [
    a.account_number ? ['Account Number', a.account_number] : null,
    a.ifsc           ? ['IFSC Code',       a.ifsc]           : null,
    ['Account Holder', a.holder || 'Akshar Mehta'],
    ['Account Type',   (a.sub_type||a.account_type||'').replace(/_/g,' ')],
    a.branch         ? ['Branch',          a.branch]         : null,
    a.upi_id         ? ['UPI ID',          a.upi_id]         : null,
    a.linked_app     ? ['Linked App',      a.linked_app]     : null,
    a.credit_limit   ? ['Credit Limit',    formatINR(a.credit_limit)] : null,
    a.notes          ? ['Notes',           a.notes]          : null,
  ].filter(Boolean);

  const filterPanel = State.showAcctFilter ? `
  <div class="filter-panel">
    <div class="filter-panel-title">
      Filter & Sort
      <span style="cursor:pointer;color:var(--text-dim)" onclick="State.showAcctFilter=false;App.render()">✕</span>
    </div>
    <div class="filter-group-label">Date Range</div>
    <div class="filter-chips-row">
      ${[['month','This Month'],['last_month','Last Month'],['year','This Year'],['all','All Time']].map(([v,l]) => `
        <div class="filter-chip ${State.acctTxDateFilter===v?'active':''}" onclick="State.acctTxDateFilter='${v}';App.render()">${l}</div>`).join('')}
    </div>
    <div class="filter-group-label">Transaction Type</div>
    <div class="filter-chips-row">
      ${[['all','All'],['credit','Credit'],['debit','Debit']].map(([v,l]) => `
        <div class="filter-chip ${State.acctTxTypeFilter===v?'active':''}" onclick="State.acctTxTypeFilter='${v}';App.render()">${l}</div>`).join('')}
    </div>
    <div class="filter-group-label">Sort By</div>
    <div class="filter-chips-row">
      ${[['date','Date'],['amount','Amount'],['category','Category']].map(([v,l]) => `
        <div class="filter-chip ${State.acctSort===v?'active':''}" onclick="State.acctSort='${v}';App.render()">${l}</div>`).join('')}
    </div>
    <div class="filter-btns">
      <button class="btn btn-ghost filter-reset" onclick="State.acctTxTypeFilter='all';State.acctTxDateFilter='month';State.acctSort='date';App.render()">Reset</button>
      <button class="btn btn-primary filter-apply" onclick="State.showAcctFilter=false;App.render()">Apply Filter</button>
    </div>
  </div>` : '';

  return `
  <div class="screen-wrap" style="padding-bottom:32px">
    <!-- Header -->
    <div class="form-header">
      <div class="icon-btn" onclick="App.goTab('wealth')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>
      </div>
      <div class="form-header-title">${escapeHtml(a.name)}</div>
      <div class="icon-btn" onclick="App.openAcctMenu('${a.account_id}')">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
      </div>
    </div>

    <!-- Hero card -->
    <div class="acct-detail-hero" style="background:linear-gradient(135deg,${acctColor}CC,${acctColor})">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
        <div>
          <div class="acct-detail-name">${escapeHtml(a.institution||a.sub_type||a.account_type)}</div>
          <div class="acct-detail-bank">${escapeHtml(a.sub_type||a.account_type)} Account${a.account_number?' · '+escapeHtml(a.account_number):''}</div>
        </div>
        <div class="acct-detail-badge">✓ Active</div>
      </div>
      <div style="color:rgba(255,255,255,0.7);font-size:13px;margin-top:10px">Current Balance</div>
      <div class="acct-detail-bal" style="color:${isLiab?'#FFB4BE':'#fff'}">${a.balance<0?'-':''}${formatINRFull(Math.abs(a.balance))}</div>
    </div>

    <!-- Quick Actions -->
    <div class="quick-acts">
      <div class="quick-act" onclick="App.navigate('add-transaction',{type:'income',account_id:'${a.account_id}'})">
        <div class="quick-act-icon" style="background:var(--success-dim)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--success)"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        </div>
        <div class="quick-act-label">Add Money</div>
      </div>
      <div class="quick-act" onclick="App.navigate('add-transaction',{type:'transfer',from_id:'${a.account_id}'})">
        <div class="quick-act-icon" style="background:var(--info-dim)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--info)"><path d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"/></svg>
        </div>
        <div class="quick-act-label">Transfer</div>
      </div>
      <div class="quick-act" onclick="App.exportAccount('${a.account_id}','csv')">
        <div class="quick-act-icon" style="background:var(--warn-dim)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--warn)"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        </div>
        <div class="quick-act-label">Statement</div>
      </div>
      <div class="quick-act" onclick="App.navigate('edit-account',{id:'${a.account_id}'})">
        <div class="quick-act-icon" style="background:var(--primary-dim)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--primary)"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
        </div>
        <div class="quick-act-label">Edit</div>
      </div>
    </div>

    <!-- Account Info -->
    <div class="section-header" style="margin-top:4px"><div class="section-title">ACCOUNT INFO</div></div>
    <div class="info-table">
      ${infoRows.map(([k,v]) => `
        <div class="info-row">
          <span class="info-label">${k}</span>
          <span class="info-value">${v}</span>
        </div>`).join('')}
    </div>

    <!-- Action Buttons -->
    <div class="action-btns">
      <div class="action-btn" onclick="App.navigate('add-transaction',{type:'income',account_id:'${a.account_id}'})">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--primary)"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm5 11h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
        <div class="action-btn-label">Add Money</div>

function remCard(r) {
  const meta  = REM_TYPE_META[r.reminder_type] || REM_TYPE_META.custom;
  const days  = daysUntil(r.reminder_date);
  const badge = dueBadge(days);
  const recLabel = r.is_recurring ? capitalize(r.recurrence || '') : 'One-time';
  const autoIcon = r.auto_pay ? '<span style="font-size:10px;background:rgba(34,197,94,0.15);color:#22C55E;padding:2px 7px;border-radius:99px;font-weight:700">AUTO</span>' : '';
  const dayColor = days !== null && days < 0 ? 'var(--danger)' : days === 0 ? 'var(--warn)' : 'var(--text-dim)';
  return `
    <div class="rem-card" onclick="App.openReminderDetail('${r.reminder_id}')">
      <div class="rem-card-left-bar" style="background:${meta.color}"></div>
      <div class="rem-icon" style="background:${meta.color}22">${meta.icon}</div>
      <div class="rem-body">
        <div class="rem-title">${r.title}</div>
        <div class="rem-provider">${r.provider || r.description || ''}</div>
        <div class="rem-badges">${badge}${r.is_recurring ? '<span class="pill pill-dim">'+recLabel+'</span>' : ''}${autoIcon}</div>
      </div>
      <div class="rem-right">
        <div class="rem-amount">${formatINR(r.amount)}</div>
        <div class="rem-status" style="color:${dayColor}">${formatDate(r.reminder_date)}</div>
      </div>
    </div>`;
}

function renderUpcomingTab(rems) {
  const pending = rems.filter(r => !r.is_completed).sort((a,b) => new Date(a.reminder_date) - new Date(b.reminder_date));
  const groups = [
    { key:'overdue',  label:'⚠️ Overdue',    filter: r => daysUntil(r.reminder_date) < 0 },
    { key:'today',    label:'📅 Today',       filter: r => daysUntil(r.reminder_date) === 0 },
    { key:'tomorrow', label:'📆 Tomorrow',    filter: r => daysUntil(r.reminder_date) === 1 },
    { key:'week',     label:'📋 Next 7 Days', filter: r => { const d = daysUntil(r.reminder_date); return d >= 2 && d <= 7; } },
    { key:'month',    label:'🗓️ This Month',  filter: r => { const d = daysUntil(r.reminder_date); return d >= 8 && d <= 30; } },
    { key:'later',    label:'⏳ Later',        filter: r => daysUntil(r.reminder_date) > 30 },
  ];
  const overdue  = pending.filter(r => daysUntil(r.reminder_date) < 0);
  const dueToday = pending.filter(r => daysUntil(r.reminder_date) === 0);
  const thisWeek = pending.filter(r => { const d = daysUntil(r.reminder_date); return d >= 2 && d <= 7; });
  const totalDue = pending.reduce((s,r) => s + r.amount, 0);

  let html = '<div class="rem-summary">';
  html += '<div class="rem-sum-card" style="background:rgba(239,68,68,0.12)"><div class="rem-sum-count" style="color:#EF4444">' + overdue.length + '</div><div class="rem-sum-label">Overdue</div><div class="rem-sum-amt" style="color:#EF4444">' + formatINR(overdue.reduce((s,r)=>s+r.amount,0)) + '</div></div>';
  html += '<div class="rem-sum-card" style="background:rgba(245,158,11,0.12)"><div class="rem-sum-count" style="color:#F59E0B">' + dueToday.length + '</div><div class="rem-sum-label">Due Today</div><div class="rem-sum-amt" style="color:#F59E0B">' + formatINR(dueToday.reduce((s,r)=>s+r.amount,0)) + '</div></div>';
  html += '<div class="rem-sum-card" style="background:rgba(34,197,94,0.12)"><div class="rem-sum-count" style="color:#22C55E">' + thisWeek.length + '</div><div class="rem-sum-label">This Week</div><div class="rem-sum-amt" style="color:#22C55E">' + formatINR(thisWeek.reduce((s,r)=>s+r.amount,0)) + '</div></div>';
  html += '<div class="rem-sum-card" style="background:rgba(108,71,255,0.12)"><div class="rem-sum-count" style="color:var(--primary)">' + pending.length + '</div><div class="rem-sum-label">Total</div><div class="rem-sum-amt" style="color:var(--primary)">' + formatINR(totalDue) + '</div></div>';
  html += '</div>';

  if (overdue.length > 0 || dueToday.length > 0) {
    const urgent = overdue.concat(dueToday);
    const urgentTotal = urgent.reduce((s,r) => s + r.amount, 0);
    html += '<div class="ai-card" onclick="App.openReminderDetail(\'' + urgent[0].reminder_id + '\')">'
      + '<div style="font-size:28px">🤖</div>'
      + '<div class="ai-body">'
      + '<div class="ai-label">AI Suggestion</div>'
      + '<div class="ai-title">You have ' + urgent.length + ' urgent payment' + (urgent.length > 1 ? 's' : '') + ' totalling ' + formatINR(urgentTotal) + '. Pay now to avoid late fees.</div>'
      + '<div class="ai-action">Take Action →</div>'
      + '</div></div>';
  }

  let hasAny = false;
  for (const g of groups) {
    const items = pending.filter(g.filter);
    if (items.length === 0) continue;
    hasAny = true;
    html += '<div class="rem-group-label">' + g.label + '</div>';
    html += items.map(r => remCard(r)).join('');
  }

  if (!hasAny) {
    html += '<div style="text-align:center;padding:60px 20px">'
      + '<div style="font-size:48px;margin-bottom:12px">✅</div>'
      + '<div style="color:var(--text);font-size:17px;font-weight:700;margin-bottom:6px">All Caught Up!</div>'
      + '<div style="color:var(--text-dim);font-size:14px">No upcoming reminders. Tap + to add one.</div>'
      + '</div>';
  }
  return html;
}

function renderCalendarTab(rems) {
  const pending = rems.filter(r => !r.is_completed);
  const year    = State.remCalYear;
  const month   = State.remCalMonth;
  const today   = new Date();
  const daysInMonthCal = new Date(year, month+1, 0).getDate();
  const selDay = (State.remCalDay != null && State.remCalDay <= daysInMonthCal) ? State.remCalDay : null;
  const firstDay    = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const monthName   = new Date(year, month, 1).toLocaleString('default', { month:'long' });

  const dayMap = {};
  for (const r of pending) {
    if (!r.reminder_date) continue;
    const d = new Date(r.reminder_date);
    if (d.getFullYear() === year && d.getMonth() === month) {
      const key = d.getDate();
      if (!dayMap[key]) dayMap[key] = [];
      dayMap[key].push(r);
    }
  }

  let html = '<div class="cal-header">'
    + '<div class="icon-btn" onclick="App.remCalPrev()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div>'
    + '<div class="cal-month-label">' + monthName + ' ' + year + '</div>'
    + '<div class="icon-btn" onclick="App.remCalNext()"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>'
    + '</div>';

  html += '<div class="cal-grid">';
  ['S','M','T','W','T','F','S'].forEach(d => { html += '<div class="cal-day-name">' + d + '</div>'; });
  for (let i = 0; i < firstDay; i++) html += '<div class="cal-day"></div>';
  for (let day = 1; day <= daysInMonth; day++) {
    const isToday = today.getFullYear()===year && today.getMonth()===month && today.getDate()===day;
    const isSel   = selDay === day;
    const dayRems = dayMap[day] || [];
    const dots    = dayRems.slice(0,4).map(r => {
      const c = (REM_TYPE_META[r.reminder_type] || REM_TYPE_META.custom).color;
      return '<div class="cal-dot" style="background:' + c + '"></div>';
    }).join('');
    const cls = ['cal-day', isToday ? 'today':'', isSel ? 'selected':'', dayRems.length ? 'has-rem':''].filter(Boolean).join(' ');
    html += '<div class="' + cls + '" onclick="App.remCalSelectDay(' + day + ')">'
      + '<div class="cal-day-num">' + day + '</div>'
      + '<div class="cal-dots">' + dots + '</div>'
      + '</div>';
  }
  html += '</div>';

  if (selDay && dayMap[selDay] && dayMap[selDay].length > 0) {
    html += '<div style="padding:0 20px"><div style="color:var(--text);font-size:14px;font-weight:700;margin-bottom:10px">'
      + monthName + ' ' + selDay + ', ' + year + ' — ' + dayMap[selDay].length + ' reminder' + (dayMap[selDay].length > 1 ? 's' : '')
      + '</div>' + dayMap[selDay].map(r => remCard(r)).join('') + '</div>';
  } else if (selDay) {
    html += '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:14px">No reminders on ' + monthName + ' ' + selDay + ', ' + year + '</div>';
  } else {
    const monthTotal = pending.filter(r => {
      const d = new Date(r.reminder_date);
      return d.getFullYear() === year && d.getMonth() === month;
    });
    if (monthTotal.length > 0) {
      html += '<div style="padding:0 20px"><div style="color:var(--text-dim);font-size:13px;margin-bottom:10px">'
        + monthTotal.length + ' reminder' + (monthTotal.length > 1 ? 's' : '') + ' this month · '
        + formatINR(monthTotal.reduce((s,r) => s + r.amount, 0)) + ' total</div></div>';
    } else {
      html += '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:14px">Tap a date to see reminders</div>';
    }
  }
  return html;
}

function renderAllTab(rems) {
  let list = rems.filter(r => !r.is_completed);
  if (State.remSearch) {
    const q = State.remSearch.toLowerCase();
    list = list.filter(r => (r.title||'').toLowerCase().includes(q) || (r.provider||'').toLowerCase().includes(q) || (r.description||'').toLowerCase().includes(q));
  }
  if (State.remCatFilter !== 'all') {
    list = list.filter(r => r.reminder_type === State.remCatFilter);
  }
  if (State.remSort === 'date')   list.sort((a,b) => new Date(a.reminder_date) - new Date(b.reminder_date));
  if (State.remSort === 'amount') list.sort((a,b) => b.amount - a.amount);
  if (State.remSort === 'name')   list.sort((a,b) => (a.title||'').localeCompare(b.title||''));

  let html = '<div style="padding:0 20px 12px;position:relative">'
    + '<input id="rem-search" type="text" placeholder="Search reminders..." value="' + State.remSearch + '" oninput="State.remSearch=this.value;App.render()" '
    + 'style="width:100%;padding:10px 16px 10px 40px;border-radius:var(--radius-sm);background:var(--card);border:1px solid var(--border);color:var(--text);font-size:14px;box-sizing:border-box;outline:none">'
    + '<div style="position:absolute;left:32px;top:50%;transform:translateY(-50%);pointer-events:none">'
    + '<svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text-dim)"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>'
    + '</div></div>';

  html += '<div class="rem-cat-bar">';
  for (const cat of REM_CATS) {
    const active = State.remCatFilter === cat.key;
    const meta   = REM_TYPE_META[cat.key];
    const color  = meta ? meta.color : 'var(--primary)';
    html += '<div class="rem-cat' + (active ? ' active' : '') + '" style="' + (active ? 'border-color:' + color + ';color:' + color + ';background:' + color + '22' : '') + '" onclick="State.remCatFilter=\'' + cat.key + '\';App.render()">' + cat.label + '</div>';
  }
  html += '</div>';

  html += '<div style="display:flex;gap:6px;padding:0 20px 14px;align-items:center">'
    + '<div style="color:var(--text-dim);font-size:12px;font-weight:600;margin-right:4px">Sort:</div>';
  ['date','amount','name'].forEach(s => {
    const active = State.remSort === s;
    html += '<div onclick="State.remSort=\'' + s + '\';App.render()" style="padding:5px 12px;border-radius:99px;font-size:12px;font-weight:600;cursor:pointer;' + (active ? 'background:var(--primary-dim);color:var(--primary)' : 'background:var(--card);color:var(--text-dim)') + '">' + capitalize(s) + '</div>';
  });
  html += '<div style="margin-left:auto;color:var(--text-dim);font-size:12px">' + list.length + ' item' + (list.length !== 1 ? 's' : '') + '</div></div>';

  if (list.length === 0) {
    html += '<div style="text-align:center;padding:40px 20px">'
      + '<div style="font-size:40px;margin-bottom:10px">🔍</div>'
      + '<div style="color:var(--text);font-size:15px;font-weight:700;margin-bottom:4px">No results</div>'
      + '<div style="color:var(--text-dim);font-size:13px">Try a different filter or search term.</div>'
      + '</div>';
  } else {
    html += list.map(r => remCard(r)).join('');
  }
  return html;
}

function renderCompletedTab(rems) {
  const done = rems.filter(r => r.is_completed).sort((a,b) => new Date(b.completed_on||b.reminder_date) - new Date(a.completed_on||a.reminder_date));
  if (done.length === 0) {
    return '<div style="text-align:center;padding:60px 20px">'
      + '<div style="font-size:48px;margin-bottom:12px">📋</div>'
      + '<div style="color:var(--text);font-size:17px;font-weight:700;margin-bottom:6px">No Completed Reminders</div>'
      + '<div style="color:var(--text-dim);font-size:14px">Paid reminders will appear here.</div>'
      + '</div>';
  }
  const totalPaid = done.reduce((s,r) => s + (r.paid_amount || r.amount), 0);
  let html = '<div style="padding:0 20px 12px"><div style="background:var(--card);border-radius:var(--radius-sm);padding:14px 16px;display:flex;justify-content:space-between;align-items:center">'
    + '<div><div style="color:var(--text-dim);font-size:11px;font-weight:600">TOTAL PAID</div><div style="color:#22C55E;font-size:20px;font-weight:800">' + formatINR(totalPaid) + '</div></div>'
    + '<div style="text-align:right"><div style="color:var(--text-dim);font-size:11px;font-weight:600">PAYMENTS</div><div style="color:var(--text);font-size:20px;font-weight:800">' + done.length + '</div></div>'
    + '</div></div>';
  html += done.map(r => {
    const meta = REM_TYPE_META[r.reminder_type] || REM_TYPE_META.custom;
    return '<div class="rem-card" style="opacity:0.8" onclick="App.openReminderDetail(\'' + r.reminder_id + '\')">'
      + '<div class="rem-card-left-bar" style="background:#22C55E"></div>'
      + '<div class="rem-icon" style="background:rgba(34,197,94,0.12)">' + meta.icon + '</div>'
      + '<div class="rem-body">'
      + '<div class="rem-title" style="text-decoration:line-through;color:var(--text-dim)">' + r.title + '</div>'
      + '<div class="rem-provider">' + (r.provider || '') + '</div>'
      + '<div class="rem-badges"><span class="pill pill-dim" style="background:rgba(34,197,94,0.15);color:#22C55E">Paid ' + (r.completed_on ? formatDate(r.completed_on) : '') + '</span></div>'
      + '</div>'
      + '<div class="rem-right"><div class="rem-amount">' + formatINR(r.paid_amount || r.amount) + '</div><div class="rem-status" style="color:#22C55E">✓ Done</div></div>'
      + '</div>';
  }).join('');
  return html;
}

function renderReminders() {
  const rems = State.data.reminders || DEMO.reminders;
  const tab  = State.remTab;
  const tabs = [
    { key:'upcoming',  label:'Upcoming' },
    { key:'calendar',  label:'Calendar' },
    { key:'all',       label:'All' },
    { key:'completed', label:'Done' },
  ];
  const overdueCount = rems.filter(r => !r.is_completed && daysUntil(r.reminder_date) < 0).length;

  let html = '<div class="screen-wrap">'
    + '<div class="page-header">'
    + '<div><div class="page-title">Reminders</div><div class="page-sub">' + rems.filter(r=>!r.is_completed).length + ' pending</div></div>'
    + '<div class="icon-btn" onclick="App.navigate(\'add-reminder\')">'
    + '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>'
    + '</div></div>'
    + '<div class="rem-tab-bar">';
  tabs.forEach(t => {
    const active = tab === t.key;
    const badge  = t.key === 'upcoming' && overdueCount > 0
      ? '<span style="background:#EF4444;color:#fff;border-radius:99px;font-size:10px;font-weight:700;padding:1px 5px;margin-left:4px">' + overdueCount + '</span>'
      : '';
    html += '<div class="rem-tab' + (active ? ' active' : '') + '" onclick="State.remTab=\'' + t.key + '\';App.render()">' + t.label + badge + '</div>';
  });
  html += '</div>';

  if (tab === 'upcoming')  html += renderUpcomingTab(rems);
  if (tab === 'calendar')  html += renderCalendarTab(rems);
  if (tab === 'all')       html += renderAllTab(rems);
  if (tab === 'completed') html += renderCompletedTab(rems);

  html += '</div>';
  return html;
}

function renderAddReminder() {
  const isEdit = State.screen === 'edit-reminder';
  const editId = State.params && State.params.id;
  const rems   = State.data.reminders || DEMO.reminders;
  const existing = isEdit ? rems.find(r => r.reminder_id === editId) : null;

  if (isEdit && !existing) {
    State.remForm = null;
    App.showToast('Reminder not found');
    App.navigate('reminders');
    return '<div class="screen-wrap"></div>';
  }
  if (!State.remForm) {
    State.remForm = existing ? {
      id:         editId,
      title:      existing.title,
      amount:     existing.amount,
      type:       existing.reminder_type,
      date:       existing.reminder_date,
      recurring:  existing.is_recurring,
      recurrence: existing.recurrence || 'monthly',
      endType:    'never',
      alertDays:  existing.alert_days || [1],
      notes:      existing.description || '',
      autoPay:    existing.auto_pay || false,
      account:    existing.account_id || '',
      provider:   existing.provider || '',
      priority:   existing.priority || 'medium',

      title:'', amount:'', type:'bill',
      date: new Date().toISOString().split('T')[0],
      recurring: false, recurrence:'monthly', endType:'never', alertDays:[1],

    return '<div onclick="State.remForm.priority=\'' + p + '\';App.render()" style="flex:1;text-align:center;padding:8px;border-radius:var(--radius-sm);border:2px solid ' + (active ? c : 'var(--border)') + ';background:' + (active ? c+'22' : 'var(--card)') + ';cursor:pointer;font-size:13px;font-weight:600;color:' + (active ? c : 'var(--text-dim)') + '">' + capitalize(p) + '</div>';
  }).join('');

  const recHtml = recurrenceOpts.map(function(r) {

  const recurThumb = rf.recurring ? '22px' : '2px';

    + '</div>'

    + '<div style="width:36px"></div>'

    + '<div class="form-group"><label class="form-label">Provider / Institution</label>'

function renderReminderDetail() {
  const id   = State.remDetailId || (State.params && State.params.id);
  const rems = State.data.reminders || DEMO.reminders;
  const r    = rems.find(x => x.reminder_id === id);
  if (!r) {
    return '<div class="screen-wrap"><div class="page-header"><div class="icon-btn" onclick="App.navigate(\'reminders\')">'
      + '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg></div>'
      + '<div class="page-title">Not Found</div></div></div>';
  }

  const meta  = REM_TYPE_META[r.reminder_type] || REM_TYPE_META.custom;
  const days  = daysUntil(r.reminder_date);
  const badge = dueBadge(days);
  const accts = State.data.accounts || DEMO.accounts;
  const acct  = accts.find(a => a.account_id === r.account_id);
  const history = rems.filter(x => x.title === r.title && x.is_completed && x.reminder_id !== r.reminder_id).slice(0,5);
  const totalPaid = history.reduce((s,x) => s + (x.paid_amount || x.amount), 0);

  const dueLabel = days === null ? '' : days < 0 ? ' (' + Math.abs(days) + 'd overdue)' : days === 0 ? ' (Today)' : ' (in ' + days + 'd)';
  const prioIcon = r.priority === 'high' ? '🔴' : r.priority === 'medium' ? '🟡' : '🟢';
  const statusTxt = r.is_completed ? '✅ Completed' : (days !== null && days < 0 ? '⚠️ Overdue' : '⏳ Pending');

  const infoRows = [
    ['Reminder Type', meta.icon + ' ' + meta.label],
    ['Due Date', formatDate(r.reminder_date) + dueLabel],
    ['Amount', formatINRFull(r.amount)],
    ['Provider', r.provider || r.description || '—'],
    ['Linked Account', acct ? acct.name : '—'],
    ['Recurrence', r.is_recurring ? capitalize(r.recurrence || 'monthly') : 'One-time'],
    ['Auto-Pay', r.auto_pay ? '✅ Enabled' : '❌ Off'],
    ['Priority', prioIcon + ' ' + capitalize(r.priority || 'medium')],
    ['Status', statusTxt],
  ];

  const quickActions = [];
  if (!r.is_completed) {
    quickActions.push({ icon:'✅', label:'Mark Paid', color:'#22C55E', fn:'App.markReminderPaid(\'' + r.reminder_id + '\')' });
    quickActions.push({ icon:'⏰', label:'Snooze',    color:'#F59E0B', fn:'App.snoozeReminder(\'' + r.reminder_id + '\')' });
  }
  quickActions.push({ icon:'✏️',  label:'Edit',      color:'var(--primary)', fn:'App.navigate(\'edit-reminder\',{id:\'' + r.reminder_id + '\'})' });
  quickActions.push({ icon:'📋',  label:'Duplicate', color:'#60A5FA',        fn:'App.duplicateReminder(\'' + r.reminder_id + '\')' });
  quickActions.push({ icon:'🗑️',  label:'Delete',    color:'var(--danger)',  fn:'App.deleteReminder(\'' + r.reminder_id + '\')' });

  const quickHtml = quickActions.map(function(a) {
    return '<div class="rem-quick-btn" onclick="' + a.fn + '">'
      + '<div class="rem-quick-icon" style="background:' + a.color + '22;font-size:18px">' + a.icon + '</div>'
      + '<div class="rem-quick-label">' + a.label + '</div>'
      + '</div>';
  }).join('');

  const analyticsHtml = history.length > 0 ? (
    '<div class="rem-analytics-row">'
    + '<div class="rem-analytics-card"><div class="rem-analytics-val" style="color:#22C55E">' + formatINR(totalPaid) + '</div><div class="rem-analytics-lbl">Total Paid</div></div>'
    + '<div class="rem-analytics-card"><div class="rem-analytics-val">' + history.length + '</div><div class="rem-analytics-lbl">Times Paid</div></div>'
    + '<div class="rem-analytics-card"><div class="rem-analytics-val">' + formatINR(Math.round(totalPaid / history.length)) + '</div><div class="rem-analytics-lbl">Avg Amount</div></div>'
    + '</div>'
  ) : '';

  const infoHtml = '<div style="margin:0 20px 16px;background:var(--card);border-radius:var(--radius);overflow:hidden">'
    + infoRows.map(function(row, i) {
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:13px 16px;' + (i < infoRows.length - 1 ? 'border-bottom:1px solid var(--border)' : '') + '">'
        + '<span style="color:var(--text-dim);font-size:13px">' + row[0] + '</span>'
        + '<span style="color:var(--text);font-size:13px;font-weight:600;text-align:right;max-width:180px">' + row[1] + '</span>'
        + '</div>';
    }).join('')
    + '</div>';

  const notesHtml = r.description ? (
    '<div style="margin:0 20px 16px;background:var(--card);border-radius:var(--radius);padding:14px 16px">'
    + '<div style="color:var(--text-dim);font-size:12px;font-weight:600;margin-bottom:6px">NOTES</div>'
    + '<div style="color:var(--text);font-size:14px;line-height:1.5">' + r.description + '</div>'
    + '</div>'
  ) : '';

  const historyHtml = history.length > 0 ? (
    '<div style="margin:0 20px 24px">'
    + '<div style="color:var(--text-dim);font-size:12px;font-weight:700;letter-spacing:0.5px;margin-bottom:10px">PAYMENT HISTORY</div>'
    + history.map(function(h) {
      return '<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)">'
        + '<div><div style="color:var(--text);font-size:13px;font-weight:600">' + formatDate(h.completed_on || h.reminder_date) + '</div>'
        + '<div style="color:var(--text-dim);font-size:11px;margin-top:2px">Paid</div></div>'
        + '<div style="color:#22C55E;font-size:14px;font-weight:700">' + formatINR(h.paid_amount || h.amount) + '</div>'
        + '</div>';
    }).join('')
    + '</div>'
  ) : '';

  return '<div class="screen-wrap">'
    + '<div class="page-header">'
    + '<div class="icon-btn" onclick="App.navigate(\'reminders\')">'
    + '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M19 11H7.83l4.88-4.88c.39-.39.39-1.03 0-1.42-.39-.39-1.02-.39-1.41 0l-6.59 6.59c-.39.39-.39 1.02 0 1.41l6.59 6.59c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L7.83 13H19c.55 0 1-.45 1-1s-.45-1-1-1z"/></svg>'
    + '</div>'
    + '<div class="page-title">Detail</div>'
    + '<div class="icon-btn" onclick="App.navigate(\'edit-reminder\',{id:\'' + r.reminder_id + '\'})">'
    + '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>'
    + '</div></div>'
    + '<div class="rem-detail-hero" style="background:linear-gradient(135deg,' + meta.color + 'dd,' + meta.color + '88)">'
    + '<div style="display:flex;align-items:center;justify-content:space-between"><div style="font-size:36px">' + meta.icon + '</div><div>' + badge + '</div></div>'
    + '<div class="rem-detail-amount">' + formatINRFull(r.amount) + '</div>'
    + '<div style="color:#fff;font-size:17px;font-weight:700">' + r.title + '</div>'
    + '<div class="rem-detail-provider">' + (r.provider || r.description || meta.label) + '</div>'
    + '</div>'
    + '<div class="rem-quick-strip">' + quickHtml + '</div>'
    + analyticsHtml
    + infoHtml
    + notesHtml
    + historyHtml
    + '</div>';
}

function renderInsightsOverview() {
  var ins  = DEMO.insights.overview;
  var cf6m = DEMO.insights.cashflow6m;
  var acc  = State.data.accounts || DEMO.accounts;
  var income  = ins.monthly_income   || 125000;
  var expense = ins.monthly_expenses || 75000;
  var savings = income - expense;
  var savRate = income ? Math.round((savings / income) * 100) : 0;
  var vs_inc  = ins.vs_last_income  ?? 5.2;
  var vs_exp  = ins.vs_last_expense ?? -2.1;
  var sparkData = cf6m.map(function(m) { return m.income - m.expense; });
  var grpTotals = {bank:0,cash:0,upi:0,cc:0};
  var grpCounts = {bank:0,cash:0,upi:0,cc:0};
  acc.forEach(function(a) {
    var bal = a.balance || a.initial_balance || 0;
    var key = 'bank';
    if (a.account_type === 'cash' || a.account_type === 'wallet') key = 'cash';
    else if (a.account_type === 'upi') key = 'upi';
    else if (a.account_type === 'credit_card') key = 'cc';
    grpTotals[key] += bal; grpCounts[key] += 1;
  });
  var quickInsights = [
    { dot: COLORS.danger,  text: 'You spent <b>' + Math.abs(vs_exp) + '% ' + (vs_exp > 0 ? 'more' : 'less') + '</b> on Food this month.' },
    { dot: COLORS.success, text: 'Your savings rate is <b>' + savRate + '%</b> this month.' },
    { dot: COLORS.info,    text: 'You can save <b>' + formatINR(Math.round(expense * 0.15)) + '</b> with better planning.' },
  ];
  var acctRows = [
    { label:'Bank Accounts',  color:COLORS.info,    total:grpTotals.bank, count:grpCounts.bank },
    { label:'Cash & Wallets', color:COLORS.success, total:grpTotals.cash, count:grpCounts.cash },
    { label:'UPI Accounts',   color:'#7B4FEF',      total:grpTotals.upi,  count:grpCounts.upi  },
    { label:'Credit Cards',   color:COLORS.danger,  total:grpTotals.cc,   count:grpCounts.cc   },
  ].filter(function(r) { return r.count > 0; });
  var html = '';
  html += '<div class="card" style="margin:0 20px 16px">'
    + '<div style="color:var(--primary);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px">This Month Overview</div>'
    + '<div style="display:flex;justify-content:space-between;margin-bottom:4px">'
    + '<span style="color:var(--text-dim);font-size:12px;font-weight:600">Income</span>'
    + '<span style="color:var(--text-dim);font-size:12px;font-weight:600">Expenses</span>'
    + '<span style="color:var(--text-dim);font-size:12px;font-weight:600">Savings</span>'
    + '</div>'
    + '<div style="display:flex;justify-content:space-between">'
    + '<span style="color:var(--success);font-size:18px;font-weight:800">' + formatINR(income) + '</span>'
    + '<span style="color:var(--danger);font-size:18px;font-weight:800">' + formatINR(expense) + '</span>'
    + '<span style="color:' + (savings < 0 ? 'var(--danger)' : 'var(--info)') + ';font-size:18px;font-weight:800">' + formatINR(savings) + '</span>'
    + '</div>'
    + '</div>';
  html += '<div class="card" style="margin:0 20px 16px">'
    + '<div style="display:flex;align-items:flex-start;justify-content:space-between">'
    + '<div>'
    + '<div style="color:var(--text-dim);font-size:12px;font-weight:600">Net Cash Flow</div>'
    + '<div style="color:var(--text-dim);font-size:11px;margin-top:2px">This Month</div>'
    + '<div style="color:var(--text);font-size:28px;font-weight:800;margin:6px 0 4px">' + formatINRFull(savings) + '</div>'
    + '<div style="color:var(--success);font-size:12px;font-weight:700">▲ ' + savRate + '% vs last month</div>'
    + '</div>'
    + '<div>' + sparklineSVG(sparkData, 110, 56, COLORS.success, true) + '</div>'
    + '</div>'
    + '</div>';
  html += '<div class="section-header"><div class="section-title">Quick Insights</div>'
    + '<div class="view-all" onclick="State.insightsTab=\'spending\';App.render()">View All</div></div>'
    + '<div class="list-card" style="margin:0 20px 22px">';
  quickInsights.forEach(function(q) {
    html += '<div class="ins-quick-item"><div class="ins-quick-dot" style="background:' + q.dot + '"></div>'
      + '<div class="ins-quick-text">' + q.text + '</div></div>';
  });
  html += '</div>';
  html += '<div class="section-header"><div class="section-title">Accounts Summary</div>'
    + '<div class="view-all" onclick="App.goTab(\'wealth\')">View All</div></div>'
    + '<div class="list-card" style="margin:0 20px 22px">';
  acctRows.forEach(function(r) {
    var amtColor = r.total < 0 ? COLORS.danger : 'var(--text)';
    html += '<div class="ins-acct-row" onclick="App.goTab(\'wealth\')">'
      + '<div style="width:36px;height:36px;border-radius:10px;background:' + r.color + '22;display:flex;align-items:center;justify-content:center;flex-shrink:0">'
      + '<svg width="18" height="18" viewBox="0 0 24 24" fill="' + r.color + '"><path d="M11.5 1L2 6v2h19V6L11.5 1zM3 22h18v-2H3v2zm0-4h18v-8H3v8z"/></svg></div>'
      + '<div style="flex:1;min-width:0"><div style="color:var(--text);font-size:14px;font-weight:700">' + r.label + '</div>'
      + '<div style="color:var(--text-dim);font-size:12px;margin-top:2px">' + r.count + ' ' + (r.count === 1 ? 'Account' : 'Accounts') + '</div></div>'
      + '<div style="text-align:right"><div style="color:' + amtColor + ';font-size:14px;font-weight:800">' + (r.total < 0 ? '-' : '') + formatINR(Math.abs(r.total)) + '</div></div>'
      + '<div style="color:var(--text-dim);margin-left:4px"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div>'
      + '</div>';
  });
  html += '</div>';
  return html;
}

function renderInsightsTrends() {
  var period   = State.insightsTrendPeriod || 'month';

  var curInv   = invData[invData.length-1];  var prevInv  = invData[invData.length-2];

  var html = '';
  html += '<div class="ins-period-row">';

    html += '<div class="ins-period-chip' + (period === p.key ? ' active' : '') + '" onclick="State.insightsTrendPeriod=\'' + p.key + '\';App.render()">' + p.label + '</div>';
  });
  html += '</div>';
  var trends = [
    {label:'Income Trend',     sub:'Total (' + MONTHS[new Date().getMonth()] + ')', total:curInc, pct:incPct, data:incData, color:COLORS.success, nav:"App.goTab('transactions')"},
    {label:'Expense Trend',    sub:'Total (' + MONTHS[new Date().getMonth()] + ')', total:curExp, pct:expPct, data:expData, color:COLORS.danger,  nav:"App.goTab('transactions')"},
    {label:'Investment Trend', sub:'Total (' + MONTHS[new Date().getMonth()] + ')', total:curInv, pct:invPct, data:invData, color:COLORS.info,    nav:"App.goTab('wealth')"},
  ];
  trends.forEach(function(t) {
    var up   = t.pct >= 0;

      + '<div class="ins-trend-header"><div>'
      + '<div class="ins-trend-label">' + t.label + '</div>'
      + '<div style="color:var(--text-dim);font-size:11px">' + t.sub + '</div>'
      + '</div><div class="ins-trend-view-all" onclick="' + t.nav + '">View All</div></div>'
      + '<div class="ins-trend-total">' + formatINRFull(t.total) + '</div>'
      + '<div class="ins-trend-delta" style="color:' + deltaColor + '">' + (up ? '▲' : '▼') + ' ' + Math.abs(t.pct) + '% vs last month</div>'
      + '<div style="margin-top:12px">' + sparklineSVG(t.data, 350, 60, t.color, true) + '</div>'
      + '</div>';
  });
  return html;
}

function renderInsightsCalendar() {
  var month  = State.insightsCalMonth != null ? State.insightsCalMonth : new Date().getMonth();
  var year   = State.insightsCalYear  != null ? State.insightsCalYear  : new Date().getFullYear();
  var today  = new Date();
  var maxDays = new Date(year, month+1, 0).getDate();
  var selDay  = (State.insightsCalDay != null && State.insightsCalDay <= maxDays)
    ? State.insightsCalDay
    : (month === today.getMonth() && year === today.getFullYear() ? today.getDate() : null);
  var allTx  = DEMO.transactions;
  var allRem = State.data.reminders || DEMO.reminders;
  var eventMap = {};
  allTx.forEach(function(t) {
    if (!t.date) return;
    var d = new Date(t.date);
    if (d.getMonth() !== month || d.getFullYear() !== year) return;
    var day = d.getDate();
    if (!eventMap[day]) eventMap[day] = [];
    var meta = txCatMeta(t.category);
    var isInc = t._type === 'income', isTx = t._type === 'transfer';
    eventMap[day].push({
      type: t._type || 'expense',
      icon: meta.icon,
      color: isTx ? COLORS.info : isInc ? COLORS.success : COLORS.danger,
      title: t.source || t.description || t.category || 'Transaction',
      sub: (isInc ? '+' : '-') + formatINR(t.amount),
      amtColor: isTx ? COLORS.info : isInc ? COLORS.success : COLORS.danger,
    });
  });
  allRem.forEach(function(r) {
    var ds = r.reminder_date || r.due_date;
    if (!ds) return;
    var d = new Date(ds);
    if (d.getMonth() !== month || d.getFullYear() !== year) return;
    var day = d.getDate();
    if (!eventMap[day]) eventMap[day] = [];
    eventMap[day].push({
      type:'reminder', color:COLORS.warn,
      icon:{bill:'📅',loan_emi:'🏠',credit_card:'💳',investment:'📈'}[r.reminder_type] || '🔔',
      title:r.title, sub:formatINR(r.amount), amtColor:COLORS.warn,
    });
  });
  var firstDay    = new Date(year, month, 1).getDay();
  var daysInMonth = new Date(year, month+1, 0).getDate();
  var dayNames    = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var html = '';
  html += '<div class="cal-header" style="padding:0 20px;margin-bottom:12px">'
    + '<div class="icon-btn" onclick="var m=State.insightsCalMonth-1,y=State.insightsCalYear;if(m<0){m=11;y--;}State.insightsCalMonth=m;State.insightsCalYear=y;State.insightsCalDay=1;App.render()">'
    + '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></div>'
    + '<div class="cal-month-label">' + MONTHS[month] + ' ' + year + '</div>'
    + '<div class="icon-btn" onclick="var m=State.insightsCalMonth+1,y=State.insightsCalYear;if(m>11){m=0;y++;}State.insightsCalMonth=m;State.insightsCalYear=y;State.insightsCalDay=1;App.render()">'
    + '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></div></div>';
  html += '<div class="ins-cal-grid">';
  dayNames.forEach(function(d) { html += '<div class="ins-cal-day-name">' + d + '</div>'; });
  for (var i = 0; i < firstDay; i++) html += '<div></div>';
  for (var day = 1; day <= daysInMonth; day++) {
    var isToday  = (year === today.getFullYear() && month === today.getMonth() && day === today.getDate());
    var isSel    = day === selDay;
    var hasEvt   = !!eventMap[day];
    var cls = 'ins-cal-day' + (isToday ? ' today' : '') + (isSel ? ' selected' : '') + (hasEvt ? ' has-event' : '');
    html += '<div class="' + cls + '" onclick="State.insightsCalDay=' + day + ';App.render()">'
      + '<div class="ins-cal-day-num">' + day + '</div>';
    if (hasEvt) {
      html += '<div class="ins-cal-dots">';
      eventMap[day].slice(0,3).forEach(function(e) {
        html += '<div class="ins-cal-dot" style="background:' + (isSel ? 'rgba(255,255,255,0.8)' : e.color) + '"></div>';
      });
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div>';
  var selEvents = eventMap[selDay] || [];
  html += '<div style="padding:0 20px;margin-bottom:12px">'
    + '<div style="color:var(--text);font-size:15px;font-weight:700;margin-bottom:12px">'
    + selDay + ' ' + MONTHS[month] + ' ' + year + '</div>';
  if (selEvents.length === 0) {
    html += '<div style="text-align:center;padding:24px;color:var(--text-dim);font-size:13px">No events on this day</div>';
  } else {
    html += '<div class="list-card">';
    selEvents.forEach(function(e,i) {
      html += '<div class="list-row" onclick="App.goTab(\'transactions\')" ' + (i < selEvents.length-1 ? 'style="border-bottom:1px solid var(--border)"' : '') + '>'
        + '<div class="list-icon" style="background:' + e.color + '22;font-size:20px;display:flex;align-items:center;justify-content:center">' + e.icon + '</div>'
        + '<div class="list-body"><div class="list-title">' + e.title + '</div>'
        + '<div class="list-sub">' + (e.type === 'income' ? 'Income' : e.type === 'reminder' ? 'Reminder' : 'Expense') + '</div></div>'
        + '<div class="list-right"><div class="list-amount" style="color:' + e.amtColor + '">' + e.sub + '</div></div>'
        + '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  html += '<button class="fab" onclick="App.navigate(\'add-transaction\',{type:\'expense\'})">'
    + '<svg width="24" height="24" viewBox="0 0 24 24" fill="white"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>';
  return html;
}

  /* ── Auth ────────────────────────────────────── */
  async login() {
    const email = document.getElementById('login-email')?.value || '';
    const pass  = document.getElementById('login-pass')?.value  || '';
    if (!email || !pass) { this.showToast('Please fill in all fields'); return; }

    // Show loading
    document.getElementById('screen').innerHTML = '<div class="spinner"></div>';

    // Try real API
    const res = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password: pass }),
    }).catch(() => null);

    if (res && res.ok) {
      const data = await res.json();
      State.token = data.token || data.access_token;
      State.user  = data.user || { name: email.split('@')[0] };
      localStorage.setItem('fc_token', State.token);
      localStorage.setItem('fc_user', JSON.stringify(State.user));
    } else {
      // Demo mode
      State.token = 'demo-token';
      State.user  = { ...DEMO.user };
      localStorage.setItem('fc_token', 'demo-token');
      localStorage.setItem('fc_user', JSON.stringify(DEMO.user));
    }

    await loadDashboardData();
    document.getElementById('tab-bar').style.display = 'flex';
    this.goTab('dashboard');
  },

  logout() {
    State.token = null; State.user = null;
    State.data  = { accounts:null, reminders:null, recentTx:null, dashboard:null,
                    transactions:null, budgets:null, investments:null, creditCards:null,
                    loans:null, income:null, expenses:null };
    // Reset all UI state
    State.addTxType   = null; State.txEditData = null; State.txIsEdit = false;
    State.txShowSearch = false; State.txSearch = ''; State.txAccountFilter = 'all';
    State.txMonth = new Date().getMonth(); State.txYear = new Date().getFullYear();
    State.remForm = null; State.remTab = 'upcoming'; State.remCatFilter = 'all';
    State.remSearch = ''; State.remSort = 'date'; State.remCalDay = null;
    State.insightsTab = 'overview'; State.insightsPeriod = 'month';
    State.insightsTrendPeriod = 'month'; State.insightsCalDay = null;
    State.viewAcctId = null; State.acctTxTypeFilter = 'all';
    State.acctTxDateFilter = 'month'; State.acctSort = 'date';

  async saveAccount() {
    const name    = document.getElementById('af-name')?.value?.trim();
    const balance = parseFloat(document.getElementById('af-balance')?.value || '0');
    const type    = State.addAcctType || 'bank';
    const color   = State.acctColor  || '#6C47FF';
    const notes   = document.getElementById('af-notes')?.value?.trim() || '';

    if (!name) { this.showToast('Please enter an account name'); return; }

    const typeMeta = ACCT_TYPES.find(t=>t.key===type)||ACCT_TYPES[0];

    // Build payload
    const payload = {
      name, account_type: type, balance, color, notes,
      institution: document.getElementById('af-bank')?.value?.trim() || '',
      account_number: document.getElementById('af-accno')?.value?.trim() || '',
      ifsc: document.getElementById('af-ifsc')?.value?.trim() || '',
      holder: document.getElementById('af-holder')?.value?.trim() || ((State.user||DEMO.user).name),
      branch: document.getElementById('af-branch')?.value?.trim() || '',
      sub_type: document.getElementById('af-subtype')?.value || typeMeta.label,
      cash_location: document.getElementById('af-loc')?.value?.trim() || '',
      upi_id: document.getElementById('af-upi')?.value?.trim() || '',
      linked_app: document.getElementById('af-upiapp')?.value || '',
      credit_limit: parseFloat(document.getElementById('af-crlimit')?.value||'0') || 0,
      include_in_net_worth: type !== 'wallet' && type !== 'upi',
      visible: true,
      avg_inflow: 0, avg_outflow: 0, tx_count: 0,
    };

    const isEdit = State.screen === 'edit-account';
    const editId = State.params?.id;

    // Try real API
    let ok = false;
    if (isEdit) {
      const r = await fetch(API_BASE + '/accounts/' + editId, {
        method: 'PUT',
        headers: { 'Authorization':'Bearer '+State.token, 'Content-Type':'application/json' },
        body: JSON.stringify(payload),
      }).catch(()=>null);
      ok = r && r.ok;
    } else {
      const r = await fetch(API_BASE + '/accounts', {
        method: 'POST',
        headers: { 'Authorization':'Bearer '+State.token, 'Content-Type':'application/json' },
        body: JSON.stringify(payload),
      }).catch(()=>null);
      ok = r && r.ok;
    }

    // Optimistic local update
    const accts = State.data.accounts || DEMO.accounts;
    if (isEdit) {
      const idx = accts.findIndex(a=>a.account_id===editId);
      if (idx >= 0) {
        const oldBalance = accts[idx].balance || 0;
        Object.assign(accts[idx], payload);
        if (DEMO.dashboard) DEMO.dashboard.total_balance += (balance - oldBalance);
      }
    } else {
      const newAcct = { ...payload, account_id: uid('a') };
      accts.push(newAcct);
      if (DEMO.dashboard) DEMO.dashboard.total_balance += balance;
    }
    State.data.accounts = accts;

    State.addAcctType = 'bank';
    State.acctColor   = '#6C47FF';
    this.showToast(ok ? 'Account saved!' : `Account ${isEdit?'updated':'added'} (demo mode)`);
    this.goTab('wealth');
  },

  deleteAccount(id) {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.onclick = e => { if (e.target===overlay) overlay.remove(); };
    overlay.innerHTML = `
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-title">Delete Account?</div>
        <div style="color:var(--text-dim);font-size:14px;margin-bottom:20px">This will permanently remove the account and all linked data. This action cannot be undone.</div>
        <div style="display:flex;gap:10px">
          <button class="btn btn-ghost" style="flex:1" onclick="this.closest('.modal-overlay').remove()">Cancel</button>
          <button class="btn btn-primary" style="flex:2;background:var(--danger)" onclick="App._doDelete('${id}');this.closest('.modal-overlay').remove()">Delete</button>
        </div>
      </div>`;
    document.getElementById('phone-frame').appendChild(overlay);
  },

  async _doDelete(id) {
    await fetch(API_BASE + '/accounts/' + id, {
      method: 'DELETE',
      headers: { 'Authorization':'Bearer '+State.token }
    }).catch(()=>null);
    const accts = State.data.accounts || DEMO.accounts;
    const idx   = accts.findIndex(a=>a.account_id===id);
    if (idx>=0) accts.splice(idx, 1);
    State.data.accounts = accts;
    State.viewAcctId = null;
    this.showToast('Account deleted');
    this.goTab('wealth');
  },

  exportAccount(id, format) {
    const a     = (State.data.accounts||DEMO.accounts).find(x=>x.account_id===id);
    const txs   = (DEMO.transactions||[]).filter(t=>t.account_id===id||t.to_account_id===id);
    const name  = a ? a.name : 'Account';

    if (format === 'csv') {
      const rows = ['Date,Type,Description,Category,Amount,Balance'];
      const sortedTxs = [...txs].sort((x,y)=>new Date(x.date)-new Date(y.date));
      const allAmts   = sortedTxs.map(t => (t._type==='income'||t.to_account_id===id) ? t.amount : -t.amount);
      const opening   = (a ? a.balance : 0) - allAmts.reduce((s,v)=>s+v, 0);
      let running = opening;
      sortedTxs.forEach(t => {
        const isInc = t._type==='income' || t.to_account_id===id;
        const amt   = isInc ? t.amount : -t.amount;
        running += amt;
        rows.push([t.date, t._type, (t.source||t.description||t.payee||''), t.category, amt, running].join(','));
      });
      const blob = new Blob([rows.join('\n')], {type:'text/csv'});
      const url  = URL.createObjectURL(blob);
      const el   = document.createElement('a');
      el.href = url; el.download = `${name}-statement.csv`; el.click();
      URL.revokeObjectURL(url);
      this.showToast(`${name} statement downloaded`);
    } else {
      this.showToast(`${format.toUpperCase()} export — connect to backend for full export`);
    }
  },

  exportAllAccounts() {
    const accts = State.data.accounts || DEMO.accounts;
    const rows  = ['Account,Type,Balance,Institution,Visible'];
    accts.forEach(a => rows.push([a.name, a.account_type, a.balance, a.institution||'', a.visible!==false?'Yes':'No'].join(',')));
    const blob = new Blob([rows.join('\n')], {type:'text/csv'});
    const url  = URL.createObjectURL(blob);
    const el   = document.createElement('a');
    el.href = url; el.download = 'accounts-summary.csv'; el.click();
    URL.revokeObjectURL(url);
    this.showToast('Accounts summary exported');
  },
